<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181925"><title>下一场安可</title>
<style>
:root{color-scheme:dark;--bg:#14151f;--card:#202230;--line:#393b50;--text:#f6f3ff;--muted:#b5b3c9;--accent:#dccaff;--green:#a3e0cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#33284a,transparent 480px),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px 16px 110px}h1,h2,h3,p{margin:0 0 10px}h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1rem}.muted,small{color:var(--muted)}small{display:block}button,input,select{font:inherit}button,input,select{border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:inherit;background:#292b3d;min-height:44px}button{cursor:pointer}button.primary,nav button.active{background:var(--accent);color:#231a33;border-color:transparent;font-weight:700}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input:not([type=checkbox]),select{width:100%}input[type=checkbox]{min-height:auto}label{display:block;margin:8px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:8px}.money{color:var(--green);font-weight:700}.slot{min-height:72px}.tag{background:#39304e;color:var(--accent);padding:3px 8px;border-radius:8px;font-size:.8rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}.stats div{background:#292b3d;padding:8px;border-radius:10px}nav{position:fixed;bottom:0;left:0;right:0;z-index:2;background:#1b1c29;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}nav div{display:grid;grid-template-columns:repeat(4,1fr);max-width:660px;margin:auto;gap:6px}dialog{color:var(--text);background:#202230;border:1px solid var(--line);border-radius:20px;width:min(96vw,620px);max-height:85dvh;padding:16px}dialog::backdrop{background:#08090dbb}.story{animation:arrive .35s ease-out}.paper{background:#f3e9d9;color:#29211d;border-radius:4px;padding:24px 16px;margin:22px 0;font-family:serif;box-shadow:5px 7px 0 #0004}.paper h2{font-size:1.9rem}.danger{color:#ffc2cc}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.news{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:18px;font-size:.86rem;color:var(--accent)}.news span{flex:0 0 100%;scroll-snap-align:start;min-width:0}
#annualapply label{min-height:44px;display:flex;align-items:center;gap:8px;margin:0}#annualapply label:has(input:disabled){opacity:.45}
</style>
</head>
<body><main id="app"></main><nav id="nav" aria-label="主面板" hidden></nav><dialog id="sheet"></dialog>
<script>
'use strict';
const KEY = 'encore-agency-v1';
const money = value => Number(value).toLocaleString('zh-CN');
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const random = (min,max) => min + Math.floor(Math.random()*(max-min+1));
const pick = list => list[random(0,list.length-1)];
const limit = value => Math.max(0,Math.min(100,value));
const year = week => Math.floor(week/48)+1;
const month = week => Math.floor(week%48/4)+1;
const date = week => '第 '+year(week)+' 年 · '+month(week)+' 月第 '+(week%4+1)+' 周';
const tabs = ['本月','艺人','作品','公司'];
const stations = [
  {name:'首尔舞台',fans:0,description:'没有粉丝也能上，小公司的首选舞台。',cost:900,range:[70,320],rival:[0,4700]},
  {name:'全国放送',fans:8000,description:'粉丝大于 8,000 才能上，适合已有一定人气的艺人。',cost:2300,range:[240,780],rival:[8001,24800]},
  {name:'世界中心',fans:25000,description:'粉丝大于 25,000 才能上，竞争更激烈。',cost:5500,range:[650,1900],rival:[25001,88000]}
];
const invites = {
  brand:{name:'品牌站台',hint:'＋资金　＋粉丝　－健康',pay:5200},
  recall:{name:'召回打歌',hint:'＋粉丝　－健康',pay:0},
  variety:{name:'综艺出演',hint:'＋资金　＋粉丝　－健康',pay:2600},
  ad:{name:'广告拍摄',hint:'＋资金　＋粉丝　－健康',pay:6800},
  audition:{name:'影视试镜',hint:'25% 获得角色 · －健康',pay:0},
  solo:{name:'个人 Solo 作品邀约',hint:'启动制作 · 4 周后完成',pay:0}
};
const activities = {
  vocal:{name:'声乐训练',hint:'＋歌唱　－健康',cost:250},
  dance:{name:'舞蹈训练',hint:'＋舞蹈　－健康',cost:250},
  rest:{name:'主动休养',hint:'＋健康',cost:0},
  beauty:{name:'医美',hint:'＋颜值　可能－颜值',cost:1400},
  scout:{name:'星探发掘',hint:'发现练习生',cost:300},
  recruit:{name:'公司招募',hint:'发现练习生或成熟艺人',cost:750},
  groupwrite:{name:'团体作曲',hint:'曲库新增 1 首歌　－健康',cost:0},
  write:{name:'成员自作曲',hint:'曲库新增 1 首歌　－健康',cost:0},
  album:{name:'专辑制作',hint:'4 周后完成，艺人可照常活动',cost:0},
  release:{name:'发行作品',hint:'＋粉丝',cost:2000},
  road:{name:'地方路演（团体）',hint:'＋资金　＋粉丝　－健康',cost:0},
  warm:{name:'家乡动员（单人）',hint:'＋资金　＋粉丝　－健康',cost:0},
  sale:{name:'专辑签售',hint:'＋资金　＋粉丝　－健康',cost:0},
  show:{name:'音乐台打歌',hint:'＋粉丝　－健康',cost:0},
  invite:{name:'接受邀约',hint:'选择执行周',cost:0},
  concert:{name:'演唱会',hint:'＋粉丝　－健康',cost:0},
  festival:{name:'世界中心年末拼盘',hint:'＋资金　＋粉丝　－健康',cost:0},
  shoot:{name:'影视拍摄',hint:'＋资金　－健康 · 等待播出',cost:0},
  press:{name:'召开说明会',hint:'＋粉丝',cost:0}
};
const venues = {
  local:{name:'韩国小型专场',fans:5000,cost:20000,rate:2.6,gain:[600,1900]},
  arena:{name:'韩国大型专场',fans:22000,cost:50000,rate:2.8,gain:[1100,2900]},
  abroad:{name:'海外首演',fans:30000,cost:100000,rate:3.25,gain:[1700,3900]},
  family:{name:'家族演唱会',fans:0,cost:80000,rate:2.9,gain:[900,2700]},
  tour:{name:'世界巡演',fans:55000,cost:100000,rate:3.1,gain:[2300,5200]}
};
const male = ['旻宰','泰旴','道允','宇贤','时温','睿俊','贤宇','在律','江珉','延昊'];
const female = ['知媛','荷允','瑞妍','恩夏','多温','宝敏','雪雅','有真','采恩','宥娜'];
const songNames = ['雨停之前','玻璃窗','夜班公车','慢一拍','纸月亮','拥挤的信箱','四月的海','最后一班地铁'];
const app = document.querySelector('#app');
const nav = document.querySelector('#nav');
const sheet = document.querySelector('#sheet');
let state = null, tab = 0, artistFilter='团体', artistSort=null, intro = 0, draft = null, storageFailed = false;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
function save(){
  try { localStorage.setItem(KEY,JSON.stringify(state)); storageFailed=false; }
  catch { storageFailed=true; }
}
function id(){return ++state.serial;}
function person(key){return state.people.find(p=>p.id===key);}
function team(key){return state.groups.find(g=>g.id===key && !g.closed);}
function work(key){return state.works.find(w=>w.id===key);}
function target(key){
  const [type,raw] = String(key||'').split(':');
  return type==='g'?team(Number(raw)):type==='p'?person(Number(raw)):null;
}
function groupOf(p){return state.groups.find(g=>!g.closed && g.members.includes(p.id));}
function performers(key){
  const entry=target(key);
  return !entry?[]:entry.members?entry.members.map(person).filter(Boolean):[entry];
}
function units(){
  return [...state.groups.filter(g=>!g.closed).map(g=>['g:'+g.id,g]),
    ...state.people.filter(p=>p.solo).map(p=>['p:'+p.id,p])];
}
function availableWorks(key){return state.works.filter(w=>w.owner===key && w.status==='released');}
function activePeople(){return state.people.map(p=>['p:'+p.id,p]);}
function allTargets(){return [...units(),...activePeople().filter(([key])=>!units().some(([k])=>k===key))];}
function lock(p){return p.sick||p.leaving||p.shelved||p.showLock;}
function lockedText(p){return p.leaving?'待处理离社':p.sick?'病休中':p.showLock?'选秀锁档':p.shelved?'暂停公开活动':'';}
function wages(){return state.people.reduce((sum,p)=>sum+p.salary,0);}
function log(message){state.logs.push(message);}
function message(title,body,fromUncle=false){state.messages.unshift({id:id(),title,body,read:false,fromUncle});}
function milestone(key,title,body){
  if(state.flags[key])return;
  state.flags[key]=true;
  if(!body)return;
  const story=['aid','release','paid','local','arena','family','abroad','announced','tourDone'].includes(key);
  if(story)message(title,body,true);
  if(story||key==='humane')notice(title,body);
}
function notice(title,body,action='',kind=''){
  (state.notices??=[]).push({title,body,action,kind});
}
function newPerson(gender,mature=false){
  const names=gender==='男'?male:female;
  const used=new Set([...state.people,...state.candidates].map(p=>p.name));
  return {id:id(),name:pick(names.filter(n=>!used.has(n)).length?names.filter(n=>!used.has(n)):names),
    gender,status:mature?'artist':'trainee',solo:false,fans:mature?random(250,4200):0,
    vocal:random(mature?42:25,mature?83:67),dance:random(mature?42:25,mature?83:67),
    beauty:random(35,88),health:random(77,100),salary:500,salaryTier:0,cool:0,
    personality:pick(['慢热','外向','重视个人发展','团队优先','好胜','沉稳']),writer:random(1,4)===1,mood:'平稳'};
}
function rivalLineup(){
  const names=['月湾娱乐 · ORBITAL','白昼唱片 · Nacre','星岸企划 · MIRU','桥灯音乐 · PAGE','北港娱乐 · HAZE','春日制作 · Pollen'];
  return stations.map(s=>{
    const pool=[...names];
    return Array.from({length:random(1,3)},()=>{
      const name=pool.splice(random(0,pool.length-1),1)[0];
      return {name,fans:random(...s.rival)};
    });
  });
}
function start(config){
  state={version:3,termsMigrated:true,inviteWindowUpdated:true,serial:0,...config,week:0,cash:50000,debt:200000,loan:0,arrears:0,people:[],groups:[],
    works:[],songs:[],queue:[],inbox:[],events:[],messages:[],logs:[],last:[],candidates:[],flags:{},
    rivals:rivalLineup(),familyYear:0,splitYear:0,annual:null,tour:null,roles:[]};
  const genders=config.kind==='男团'?Array(5).fill('男'):config.kind==='女团'?Array(5).fill('女'):['男','男','女','女','女'];
  for(const gender of genders){
    const p=newPerson(gender,true);p.fans=random(120,650);state.people.push(p);
  }
  const group={id:id(),term:{ends:96,years:2},name:config.groupName,members:state.people.map(p=>p.id),fans:random(600,1250),closed:false};
  state.groups.push(group);
  state.works.push({id:id(),owner:'g:'+group.id,title:'雨后的练习室',format:'专辑',status:'released',old:true});
  message('交接短信',state.company+'大楼的钥匙寄给你了。叔叔先出去避避风头。',true);state.messages[0].read=true;
  refreshNews(true);save();
}
function button(label,action,arg='',style='',disabled=false){
  return '<button type="button" class="'+style+'" data-action="'+action+'" data-arg="'+escape(arg)+'"'+(disabled?' disabled':'')+'>'+escape(label)+'</button>';
}
function textBlock(title,contents){return '<section class="card"><h3>'+escape(title)+'</h3>'+contents+'</section>';}
function options(rows){return rows.map(([value,label])=>'<option value="'+escape(value)+'">'+escape(label)+'</option>').join('');}
function listNames(rows){return rows.map(([key,p])=>[key,p.name+(p.members?' · '+p.members.length+' 人':'')+' · '+money(p.fans)+' 粉丝']);}
function open(title,body){
  sheet.innerHTML='<div class="row spread"><h2>'+escape(title)+'</h2>'+button('关闭','close')+'</div>'+body;
  if(!sheet.open)sheet.showModal();
  sheet.scrollTop=0;
}
function error(message){
  const area=sheet.open?sheet:app;
  let node=area.querySelector('#error');
  if(!node){node=document.createElement('p');node.id='error';node.className='danger';node.setAttribute('role','alert');area.append(node);}
  node.textContent=message; node.scrollIntoView?.({block:'nearest'});
}
function finish(){if(sheet.open)sheet.close();save();render();}
function showTab(key){tab=key;finish();window.scrollTo(0,0);}
function render(){
  if(!state || intro){
    nav.hidden=true;
    if(intro===1){
      app.innerHTML='<div class="story"><div class="paper"><small>娱乐晚报</small><h2>「'+escape(draft.company)+'」宣布破产，公司代表跑路！！</h2></div>'+button('查看手机短信','intro',2,'primary')+' '+button('跳过序章','intro',3)+'</div>';
    }else if(intro===2){
      app.innerHTML='<div class="story"><h1>叮，收到一条短信</h1>'+textBlock('叔叔','<p>'+escape(draft.company)+'大楼的钥匙寄给你了。叔叔先出去避避风头。</p>')+'<p>你带着自己攒下的 50,000 打开办公室。桌上的账本还欠着 200,000。</p>'+button('进入公司','intro',3,'primary')+'</div>';
    }else{
      app.innerHTML='<h1>下一场安可</h1><p class="muted">韩国经纪公司经营游戏</p><form id="setup" class="card stack"><label>公司名<input name="company" maxlength="24" value="长夜企划" required></label><label>代表名<input name="player" maxlength="16" value="小夏" required></label><label>初始团体名<input name="groupName" maxlength="24" value="Afterlight" required></label><label>初始团体<select name="kind"><option>男团</option><option>女团</option><option>混团</option></select></label><small>混团为 2 男 3 女。原团已有旧歌可供演出。</small><button class="primary">接手公司</button></form>';
    }
    return;
  }
  const pending=state.inbox.filter(offerVisible).length+state.events.length+(state.promoEvents||[]).length;
  nav.hidden=false;
  nav.innerHTML='<div>'+tabs.map((name,i)=>button(name+(i===0&&pending?' · '+pending:''),'tab',i,i===tab?'active':'')).join('')+'</div>';
  app.innerHTML='<header><div class="row spread"><small>'+escape(state.company)+' · '+escape(state.player)+'代表</small><span class="money">'+money(state.cash)+'</span></div><h1>'+tabs[tab]+'</h1><small>'+date(state.week)+'</small></header>'+newsNotes()+
    (storageFailed?'<p class="danger">浏览器目前无法自动保存。可在公司页导出存档。</p>':'')+
    [weekPage,artistsPage,worksPage,companyPage][tab]();
  rotateNews();
}
function planLabel(plan){
  if(plan.type==='invite'){const offer=state.inbox.find(i=>i.id===plan.ref);return offer?offerName(offer):'业务邀约';}
  if(plan.type==='show')return '打歌 · '+stations[plan.station].name;
  if(plan.type==='concert')return venues[plan.venue].name;
  return activities[plan.type].name;
}
function planOwner(plan){
  if(plan.type==='festival')return festivalLineup(plan).map(key=>festivalName(key)).join('、');
  return target(plan.target)?.name||plan.lineup?.map(k=>target(k)?.name).filter(Boolean).join('、')||plan.people?.map(k=>person(k)?.name).filter(Boolean).join('、')||work(plan.ref)?.title||'';}
function countdown(left){return left<=1?'本周截止':'剩余 '+left+' 周';}
function weekPage(){
  const queue=[0,1,2,3].map(i=>{
    const plan=state.queue[i];
    return '<div class="card slot row spread">'+(plan?
      '<div><small>第 '+(i+1)+' 周</small><h3>'+escape(planLabel(plan))+'</h3><small>'+escape(planOwner(plan))+'</small><small>'+escape(plan.type==='show'?(stations[plan.station].fans?'需超过 '+money(stations[plan.station].fans)+' 粉丝':'0 粉丝可上')+' · 费用 '+money(planCost(plan)):activities[plan.type].hint)+'</small></div><div class="row">'+(fixedPlan(plan)?'<span class="tag">固定档期</span>':button('替换','schedule',i)+button('移除','remove',i))+'</div>':
      '<small>第 '+(i+1)+' 周</small>'+button('＋ 安排行程','schedule',i))+'</div>';
  }).join('');
  const inbox=state.inbox.filter(offerVisible).sort((a,b)=>a.expiry-b.expiry).map(i=>{
    const entry=target(i.target);
    const queued=state.queue.some(p=>p?.type==='invite'&&p.ref===i.id);
    const status=performers(i.target).map(lockedText).find(Boolean);
    return '<div class="card"><div class="row spread"><strong>'+escape(offerName(i))+'</strong><span class="tag">'+countdown(i.expiry-state.week)+'</span></div><small>'+escape(entry?.name)+'　'+escape((i.self?'艺人自荐 · 拒绝或到期会降低健康　':'')+(status?status+' · ':'')+invites[i.type].hint)+'</small><div class="row">'+button(queued?'已安排':'选择执行周','invite',i.id,'',queued)+button('放弃','decline',i.id,'',queued)+'</div></div>';
  }).join('');
  const projects=state.works.filter(w=>w.status==='making').map(w=>'<p>'+escape(w.title)+' · 剩余 '+(w.ready-state.week)+' 周</p>').join('');
  return '<h2 style="margin-top:16px">月计划 '+state.queue.filter(Boolean).length+' / 4</h2><small>已排项目基础费用 '+money(state.queue.filter(Boolean).reduce((sum,p)=>sum+planCost(p),0))+' · 预计工资 '+money(wages())+'</small>'+queue+
    button('结算本月','advance','','primary',state.queue.filter(Boolean).length!==4)+
    extras()+
    '<h2 style="margin-top:20px">待处理</h2>'+annualPending()+
    (state.events.filter(e=>!person(e.person)?.showLock).map(e=>textBlock(eventTitle(e),button('查看选择','event',e.id))).join(''))+
    (state.promoEvents||[]).map(e=>textBlock('音源注水争议',button('查看公关选项','promoreply',e.id))).join('')+inbox+(annualPending()||state.inbox.length||state.events.length||(state.promoEvents||[]).length?'':'<p class="muted">本月暂无待处理邀约或事件。</p>')+
    textBlock('进行中',projects||'<small>没有制作中的项目。</small>')+
    textBlock('本期结算',[...(state.fanNews||[]),...state.last].map(l=>'<p>'+escape(l)+'</p>').join('')||'<small>结算本月后可查看结果。</small>');
}
const sortStats={vocal:'歌唱',dance:'舞蹈',beauty:'颜值',health:'健康'};
function artistRanking(a,key){
  const people=a.members?a.members.map(person).filter(Boolean):[a];
  return people.reduce((sum,p)=>sum+p[key],0)/Math.max(1,people.length);
}
function artistsPage(){
  const groups=state.groups.filter(g=>!g.closed);
  const people=state.people;
  const filters='<div class="row spread"><div class="row">'+['团体','Solo','练习生'].map(k=>button(k==='Solo'?'Solo 艺人':k,'filter',k,k===artistFilter?'primary':'')).join('')+
    '</div><div class="row">'+button('筛选','sortartists')+button('一键结算','splitall','','',!splitRows().length)+'</div></div>';
  const ranking=artistSort?' <small>'+sortStats[artistSort.key]+(artistSort.direction===1?'从低到高':'从高到低')+'，团体按成员平均值</small>':'';
  const rows=artistFilter==='团体'?groups:people.filter(p=>artistFilter==='Solo'?p.solo:p.status==='trainee'||(!p.solo&&!groupOf(p)));
  if(artistSort)rows.sort((a,b)=>artistSort.direction*(artistRanking(a,artistSort.key)-artistRanking(b,artistSort.key)));
  return '<p class="muted">签约人数 '+people.length+' / 60</p><div class="row">'+button('雇佣星探','scouts')+' '+button('公司招募','preset','recruit')+' '+button('候选人 '+state.candidates.length,'candidates')+' '+button('组建团体','debut','group')+' '+button('Solo 出道','debut','solo')+'</div>'+
    filters+ranking+textBlock(artistFilter==='Solo'?'Solo 艺人':artistFilter,rows.map(a=>{
      const key=(a.members?'g:':'p:')+a.id, due=pendingAmount(a);
      const detail=a.members?a.members.length+' 人 · '+money(a.fans)+' 粉丝':lockedText(a)||(a.cool>state.week?'重组冷却 · '+(a.cool-state.week)+' 周':a.mood);

function workEligible(w,type){
  if(!target(w.owner)||(type==='road'&&!target(w.owner).members))return false;
  if(type==='release')return w.status==='ready'||(w.status==='making'&&w.ready<state.week+4);
  if(['show','sale','road'].includes(type)&&state.queue.some(p=>p?.type==='release'&&p.ref===w.id))return type!=='sale'||w.format==='专辑';
  if(w.status!=='released')return false;
  if(type==='show'&&(w.old||state.week>w.released+6))return false;
  return type!=='sale'||(!w.old&&w.format==='专辑'&&state.week<w.released+25);
}

  if(p.type==='show')return stations[p.station].cost;

  if(p.type==='invite'&&state.inbox.find(i=>i.id===p.ref)?.type==='solo')return 2300;
  return activities[p.type].cost;

function isPlanned(type,ref,station,except=-1){

function unavailableStation(w,i,slot){
  if(!w)return true;

}

function fixedPlan(plan){return plan?.type==='festival'||plan?.familyBooking===true;}
function enqueue(plan,slot){
  if(!Number.isInteger(slot)||slot<0||slot>3){error('请选择第 1～4 周。');return;}
  if(fixedPlan(state.queue[slot])){error('该周已预留年度演出。');return;}
  if(plan.type==='release'&&isPlanned('release',plan.ref,null,slot)){error('这张专辑本月已经安排发行。');return;}
  if(plan.type==='show'&&unavailableStation(work(plan.ref),plan.station,slot)){error('音乐台已安排、已登台或未达到粉丝门槛。');return;}
  if(plan.type==='sale'&&!canSignAt(work(plan.ref),slot)){error('这周已超出签售期，请选择可用周次。');return;}
  if(plan.type==='release'){const w=work(plan.ref);if(w?.status==='making'&&w.ready>state.week+slot){error('这一周作品尚未完成，请选完成周或更晚。');return;}}
  if(plan.type==='invite'){
    const offer=state.inbox.find(i=>i.id===plan.ref);
    if(!offer||state.week+slot>=offer.expiry){error('该周已经超过邀约截止日。');return;}
  }
  if(plan.eventRef&&state.queue.some((p,i)=>i!==slot&&p?.eventRef===plan.eventRef)){error('此事件已有安排。');return;}
  state.queue[slot]=plan;
  finish();
  if(state.monthSummary&&!showNextNotice())showMonthlyReport();
}
function canSignAt(w,slot){
  if(!w||w.old||w.format!=='专辑')return false;
  const release=w.status==='released'?w.released:state.week+state.queue.findIndex(p=>p?.type==='release'&&p.ref===w.id);
  if(w.status!=='released'&&release<state.week)return false;
  const age=state.week+slot-release;
  return age>=1&&age<=24;
}

function refreshPlanOptions(form){
  if(!form)return;
  const {ref,station}=form.elements;
  if(station){
    const w=work(Number(ref.value)), selected=station.value;
    for(const opt of station.options)opt.disabled=Boolean(unavailableStation(w,Number(opt.value),-1));
    const first=Array.from(station.options).find(opt=>!opt.disabled);
    station.value=Array.from(station.options).some(opt=>opt.value===selected&&!opt.disabled)?selected:first?.value??'';
  }
  form.querySelector('button[type=submit],button.primary').disabled=!ref?.value||Boolean(station&&!station.value);
}
function submitPlan(form){
  const data=new FormData(form), type=form.dataset.type, slot=Number(form.dataset.slot);
  const ref=Number(data.get('ref')), entry=work(ref);
  if(['release','show','road','sale'].includes(type)&&!entry){error('请选择可用作品。');return;}
  const p={type,ref,target:entry?.owner||data.get('target')||null};
  if(type==='sale'){
    p.signings=data.getAll('signing').filter(kind=>['video','offline'].includes(kind));
    if(!p.signings.length){error('请至少选择一种签售。');return;}
  }
  if(type==='show'){
    p.station=Number(data.get('station'));
    if(entry.stations?.includes(p.station)||state.queue.some((other,i)=>i!==slot&&other?.type==='show'&&other.ref===ref&&other.station===p.station)){error('这部作品已经登上过该音乐台。');return;}
    if(data.get('station')==null||unavailableStation(entry,p.station,slot)){error('该音乐台当前不可排期。');return;}
    p.rivals=stationRivals(p.station);
  }
  const selected=data.getAll('member').map(Number);
  const teams=data.getAll('team').map(Number);
  if(['vocal','dance','beauty','warm'].includes(type)&&!p.target&&!selected.length&&!teams.length){error('请至少选择一个对象。');return;}
  if(!p.target&&teams.length)p.lineup=teams.map(k=>'g:'+k);
  if(!p.target&&selected.length)p.people=selected;
  if(type==='recruit')p.gender=data.get('gender');
  if(type==='write'||type==='groupwrite')p.title=String(data.get('title')||'').trim();
  if(type==='album'){
    p.title=String(data.get('title')).trim();
    p.format='专辑';p.genre=data.get('genre');p.main=Number(data.get('main'));
    const extra=data.getAll('track').map(Number).filter(k=>k!==p.main);
    if(!p.title||extra.length>13){error('请填写作品名。专辑可加 13 首收录曲。');return;}
    p.tracks=[...(p.main?[p.main]:[]),...extra];

  }
  if(slot<0)directPlan(p);else enqueue(p,slot);
}

function removeMember(p,leave,peaceful){
  const group=groupOf(p), key='p:'+p.id;
  if(group){
    const sum=group.members.map(person).reduce((n,a)=>n+a.fans,0);
    const loss=Math.round(group.fans*(sum?p.fans/sum:1/group.members.length)*(peaceful?.32:.73));
    group.fans=Math.max(0,group.fans-loss);
    group.members=group.members.filter(i=>i!==p.id);
    if(group.members.length<2)closeGroup(group);

  }
  if(leave){
    state.people=state.people.filter(a=>a.id!==p.id);
    state.events=state.events.filter(e=>e.person!==p.id);
    state.roles=state.roles.filter(r=>r.target!==key||r.status==='broadcast');
    state.inbox=state.inbox.filter(i=>i.target!==key);
    cancelPlans([key]);
  }
}
function adjust(key,amount,groupShare=true){
  const a=target(key);
  if(!a)return;
  const before=a.fans;
  a.fans=Math.max(0,a.fans+amount);
  if(amount<0&&a.fans<before&&!a.members){
    a.health=limit(a.health-random(1,3));
    if(!a.fans&&a.status==='artist'&&!a.shelved&&!state.events.some(e=>e.type==='zero'&&e.person===a.id))state.events.push({id:id(),type:'zero',person:a.id});
    checkHealth(a);
  }
  if(a.members&&amount>0&&groupShare)for(const p of performers(key).filter(p=>!lock(p)))p.fans+=Math.round(amount*pick([0,.025,.05,.08,.12,.19,.27]));
}
function health(key,amount){for(const p of performers(key))p.health=limit(p.health+amount);}
let monthCash=null;

function coverage(key,range,odds=3){
  const ps=performers(key).filter(p=>!lock(p));
  const quality=ps.reduce((n,p)=>n+(p.vocal+p.dance+p.health)/3,0)/(ps.length||1);
  let amount=Math.round(random(...range)*(.82+quality/240));
  if(random(1,100)<=odds){amount*=random(3,6);log('一段现场片段被大量转发，新观众开始关注 '+target(key).name+'。');}
  adjust(key,amount);
}
function physical(plan,touched,extra=0){

function collapse(ps){

function appearancePay(type,fans){

  return Math.round(base+Math.min(base*2.5,Math.sqrt(Math.max(0,fans))*16));
}

function filmResults(){
  const results=[];

    if(!['auto','cast','waiting'].includes(role.status)||role.air>state.week)continue;
    role.status='broadcast';
    const actor=target(role.target);
    if(!actor)continue;
    const hit=random(1,100)<=45, gain=hit?random(450,1100):0;
    if(gain)adjust(role.target,gain);
    results.push(actor.name+' · 《'+role.title+'》'+(hit?'剧情大火！粉丝 +'+money(gain):'剧本扑了！没有任何影响。'));
  }
  return results;
}
function runPlan(p,touched){
  const a=target(p.target), w=work(p.ref);
  const cost=planCost(p);
  changeCash(-cost);
  switch(p.type){
    case 'vocal': case 'dance':
      a[p.type]=limit(a[p.type]+random(2,5));a.health=limit(a.health-random(2,4));touched.add(a.id);
      log(a.name+'完成训练。');break;
    case 'idle': log('全员休整。');break;
    case 'rest': health(p.target,random(14,23));touched.add(a.id);a.mood='平稳';log(a.name+'休养了一周。');break;
    case 'beauty':
      if(random(1,100)<=20){a.beauty=limit(a.beauty-random(3,12));state.events.push({id:id(),type:'beauty',person:a.id});}
      else{a.beauty=limit(a.beauty+random(2,7));log(a.name+'对这次医美效果满意。');}
      a.health=limit(a.health-4);touched.add(a.id);break;
    case 'scout': case 'recruit':
      if(state.candidates.length>=24){log('候选名单已满，请先处理现有候选人。');changeCash(cost);break;}
      for(let n=0,count=p.type==='recruit'?random(2,5):1;n<count&&state.candidates.length<24;n++)addCandidate(p.gender);
      log('新增候选人。去「艺人」查看或签约。');break;
    case 'groupwrite': {
      const ps=physical(p,touched);
      state.songs.push({id:id(),group:p.target,author:a.name,title:p.title||pick(songNames),quality:random(45,ps.some(q=>q.writer)?100:88),used:false});
      log(a.name+'完成一首团体作曲，已放进曲库。');break;
    }
    case 'write':
      state.songs.push({id:id(),writer:a.id,author:a.name,title:p.title||pick(songNames),quality:random(40,a.writer?100:83),used:false});
      a.health=limit(a.health-random(2,4));touched.add(a.id);log(a.name+'完成一首自作曲，已放进曲库。');break;
    case 'album': createProject(p);break;
    case 'release': {
      w.status='released';w.released=state.week;w.stations=[];
      const draw=random(1,100);w.reception=draw<=15?'大爆':draw<=30?'大失败':'反响平平';
      log('《'+w.title+'》发行反响：'+w.reception+'。');
      const songs=(w.tracks||[]).map(k=>state.songs.find(s=>s.id===k)).filter(Boolean);
      const extra=Math.round(170*Math.log2(1+songs.length));
      const quality=songs.length?Math.round(songs.reduce((sum,s)=>sum+s.quality,0)/songs.length):55;
      coverage(p.target,[100+extra,380+extra+quality],5);
      log('《'+w.title+'》已发行。');
      milestone('release','第一部新作品','评论区有人问：「这家公司还在做歌？」过了一会儿，同一个账号又留了一条评论：「副歌我已经听第三遍了。」');
      break;
    }
    case 'road': case 'warm': {
      const incident=collapse(physical(p,touched)), warm=p.type==='warm';
      income(warm?(p.hometownPay??2000):4400+Math.min(2700,Math.floor(a.fans/12)),p.target);
      coverage(p.target,incident?[20,110]:warm?[35,125]:[105,385]);
      if(!warm)activitySales(w,a,incident?.4:1);
      log(a.name+(warm?'完成家乡动员。':'完成地方路演，场地方已结款。'));break;
    }
    case 'sale':
      for(const mode of p.signings||['offline'])runSigning(p,w,a,touched,mode);
      break;
    case 'show': {
      w.stations=(w.stations||[]).concat(p.station);
      const rivals=(p.rivals||stationRivals(p.station)).map(r=>stationEligible(r.fans,stations[p.station])?r:{...r,fans:stations[p.station].fans+1}), higher=rivals.filter(r=>r.fans>a.fans).length;
      const tied=rivals.filter(r=>r.fans===a.fans).length, rank=1+higher+random(0,tied);
      const opponent=rivals.slice().sort((x,y)=>y.fans-x.fans)[0];
      const incident=collapse(physical(p,touched));
      const scale=[1,.67,.46,.32][rank-1]*(incident?.7:1);
      const [low,high]=stations[p.station].range.map(n=>Math.max(1,Math.round(n*scale)));
      const gained=random(low,high);
      if(!incident&&random(1,100)<=8)log(a.name+'的结尾 Wink 被观众记住。');
      adjust(p.target,gained);
      if(!incident&&random(1,100)<=3){adjust(p.target,gained*random(2,5));log('这期打歌的一段直拍突然走红。');}
      log(a.name+' · '+stations[p.station].name+(rank===1?'喜提一位':'惜败于 '+opponent?.name)+' · 第 '+rank+' / '+(rivals.length+1));break;
    }
    case 'invite': {
      const offer=state.inbox.find(i=>i.id===p.ref);
      state.inbox=state.inbox.filter(i=>i.id!==p.ref);
      if(offer.type==='recall'){const w=work(offer.work), song=recallSong(offer);(w.recalledSongs??=[]).push(song.id);physical(p,touched);coverage(p.target,[360,1100],6);log(a.name+'完成《'+song.title+'》召回打歌。');break;}
      if(offer.type==='solo'){createProject(p,true);break;}
      if(offer.type==='audition'){audition(p.target,touched);break;}
      physical(p,touched);income(appearancePay(offer.type,a.fans),p.target);
      coverage(p.target,offer.type==='ad'?[160,480]:[280,840],6);
      log(a.name+'完成'+invites[offer.type].name+'。');
      if(!a.members&&random(1,4)===1&&!state.events.some(e=>e.person===a.id&&e.type==='spotlight'))state.events.push({id:id(),type:'spotlight',person:a.id});
      break;
    }
    case 'audition': audition(p.target,touched);break;
    case 'concert': runConcert(p,touched);break;
    case 'press': adjust(p.target,random(70,330));log(a.name+'的说明会结束，部分观众认可了回应。');break;
  }
}

function runConcert(plan,touched){
  const spec=venues[plan.venue];
  const incident=collapse(physical(plan,touched,plan.venue==='tour'?6:3));
  const keys=plan.venue==='family'?plan.lineup:[plan.target];
  const baseFans=keys.reduce((sum,key)=>sum+target(key).fans,0);
  const floor=spec.cost+concertProfitFloor(plan.venue);
  const revenue=Math.max(floor,Math.round(concertBoxOffice(plan.venue,baseFans,plan.songs?.length)*random(90,110)/100*(incident?.85:1)));
  (state.concertHistory??=[]).push({venue:plan.venue,keys:[...keys],week:state.week,participants:planPeople(plan)});
  let remaining=revenue;
  for(const [i,key] of keys.entries()){
    const pay=i===keys.length-1?remaining:Math.floor(revenue*target(key).fans/Math.max(1,baseFans));
    income(pay,key);remaining-=pay;
    coverage(key,incident?spec.gain.map(n=>Math.round(n*.55)):spec.gain,5);

    milestone('family','第一次家族演唱会','安可合照时，一位新人忘了站位。前辈伸手把他拉到身边，后台的人也跟着笑了。');
  }
  if(plan.venue==='local'){
    const title=availableWorks(plan.target)[0]?.title||'第一部作品';
    milestone('local','第一次小型演唱会','返场时，台下一起唱起了《'+title+'》。回到后台，艺人摘下耳返问：「最后一句，你们也听见了吗？」');
  }
  if(plan.venue==='arena')milestone('arena','第一次大型演唱会','开场灯熄灭时，最高一排先亮起一块灯牌，上面写着：「从第一场路演就在。」');
  if(plan.venue==='abroad')milestone('abroad','海外第一站','艺人练了一下午当地语言的问候，台下则用韩语喊出了台上艺人的名字。散场后，有人问能不能留一份应援录音。');
  if(plan.venue==='tour'){
    state.tour.stops++;

  }
  log(spec.name+'已完成。');
}

function genEvents(){
  const available=state.people.filter(p=>p.status==='artist'&&!p.leaving&&!p.showLock&&!state.events.some(e=>e.person===p.id));
  const free=available.filter(p=>!lock(p));
  const raise=available.find(p=> p.fans>10000&&p.health<=50&&state.week>=(p.raiseAfter||0));
  if(raise&&random(1,100)<=25)state.events.push({id:id(),type:'raise',person:raise.id});
  if(!free.length)return;
  const pool=['rumor','privacy','attitude','clip','testpaper','oldphoto','senior','eyerolled'];
  const candidates=free.flatMap(p=>pool.map(type=>({p,type})));
  const existing=state.events.filter(e=>[...pool,'raise'].includes(e.type)).length;
  for(let i=existing;i<3&&candidates.length;i++){
    const {p,type}=candidates.splice(random(0,candidates.length-1),1)[0];
    state.events.push({id:id(),type,person:p.id});
    if(type==='clip'){const gain=random(100,450);adjust('p:'+p.id,gain);log(p.name+'的粉丝剪辑突然爆火 · 粉丝 +'+gain);}
  }
}
const disputes=new Set(['rumor','privacy','attitude','testpaper','oldphoto','senior','eyerolled','truck']);
function resolveDisputes(){
  const results=[];
  for(const e of [...state.events]){
    if(!disputes.has(e.type)&&!(e.type==='concertFollowup'&&e.negative))continue;
    const p=person(e.person);
    state.events=state.events.filter(row=>row.id!==e.id);
    if(!p||p.showLock)continue;
    const before=snapshot(), delta=random(-95,60);
    adjust('p:'+p.id,delta);
    if(e.type==='privacy'&&person(p.id)){
      p.privacy=(p.privacy||0)+1;p.privacyDue=state.week+4;
      p.health=limit(p.health-random(2,5));checkHealth(p);
    }
    const change=deltas(before);
    results.push(p.name+' · '+(e.title||eventNames[e.type])+'（未回应） · '+(delta<0?'讨论仍有余波。':'讨论自然平息。')+(change?' · '+change:''));
  }
  for(const e of state.promoEvents||[]){
    const w=work(e.work), a=target(w?.owner);
    if(!a||!offerVisible({target:w.owner,expiry:state.week+1}))continue;
    const before=snapshot();adjust(w.owner,random(-140,65));
    results.push('《'+w.title+'》音源注水争议（未回应） · '+(deltas(before)||'讨论自然平息。'));
  }
  state.promoEvents=[];
  return results;
}

function concertFollowups(){
  const history=state.concertHistory||[];
  state.concertHistory=history.filter(c=>c.week>=state.week);
  let count=0;
  for(const c of history.filter(c=>c.week<state.week)){
    const draw=random(1,100);
    if(draw>25||count>=2)continue;
    const artist=c.participants.map(person).find(p=>p&&!lock(p));
    if(!artist)continue;
    const pool=draw<=15?['清唱救场',...(c.venue==='family'?['家族舞台出圈']:[]),...(['tour','abroad'].includes(c.venue)?['海外应援出圈']:[])]:draw<=20?['安可歌单引发讨论']:['假唱／对口型争议','出场安排引发争议'];
    const title=venues[c.venue].name+'后续 · '+pick(pool);
    const cause=title.includes('对口型')?pick(['回放音画不同步','伴奏垫音偏重','个别段落临时使用预录']):'';
    state.events.push({id:id(),type:'concertFollowup',person:artist.id,title,cause,negative:draw>20});
    count++;
  }
}
function soloEvents(){
  for(const g of state.groups.filter(g=>!g.closed)){
    if(!availableWorks('g:'+g.id).length)continue;
    const [top,second]=g.members.map(person).filter(Boolean).sort((a,b)=>b.fans-a.fans);
    if(!second||top.fans<=5*second.fans||lock(top)||top.soloPromise||state.events.some(e=>e.person===top.id&&e.type==='friction'))continue;
    if(random(1,100)<=5)state.events.push({id:id(),type:'friction',person:top.id});
  }
}
function retentionChance(p){return !p.soloRetentionUsed?100:p.mood==='沟通良好'?60:40;}

    }else{

    }
  }else if(e.type==='exit'){

  }else{
    if(choice==='protect'&&state.cash<600){error('现金不足。');return;}
    if(choice==='protect'){state.cash-=600;adjust(key,random(20,105));p.mood='受到支持';}
    if(choice==='quiet'||choice==='response'){
      adjust(key,-random(5,85));if(group)adjust('g:'+group.id,-random(0,35));

    if(choice==='promote')adjust(key,random(25,150));
    if(choice==='rest'||(choice==='pause'&&e.type==='spotlight'))health(key,random(4,9));
    if(e.type==='beauty')p.mood='恢复中';
  }
  clear();finish();
}
function spawnInvites(){
  if(state.inbox.length>=9||random(1,100)>76)return;
  const eligible=allTargets().filter(([key,a])=>offerVisible({target:key,expiry:state.week+1})&&!state.inbox.some(i=>i.target===key)&&(a.members||a.status==='artist'));
  if(!eligible.length)return;
  const weights=eligible.map(([,a])=>1+Math.min(14,Math.floor(a.fans/900)));
  let ticket=random(1,weights.reduce((n,w)=>n+w,0)), index=0;
  while(ticket>weights[index])ticket-=weights[index++];
  const [key,a]=eligible[index];
  const kinds=['variety','ad','brand'];
  if(!a.members&&state.flags.release)kinds.push('audition');
  if(!a.members&&groupOf(a)&&a.fans>=8500&&a.cool<=state.week)kinds.push('solo');
  if(random(1,100)>Math.min(97,58+Math.floor(a.fans/450)))return;
  state.inbox.push({id:id(),target:key,type:pick(kinds),expiry:state.week+12,self:!a.members&&random(1,5)===1});
}
function processWages(){
  const due=wages()+state.arrears;
  if(due>state.cash&&!state.flags.aid){
    changeCash(20000);log('发现备用金 · 资金 +20,000');
    milestone('aid','办公桌下的备用金',state.player+'，桌子底下有一块地板是松的。掀开看看，里面是我走之前留下的两万。要是工资还没发，就先拿去用。\n发现备用金 · 资金 +20,000');
  }
  const paid=Math.min(due,state.cash);changeCash(-paid);state.arrears=due-paid;
  if(state.arrears){
    log('已付工资 '+money(paid)+'，仍欠薪 '+money(state.arrears)+'。可借款、接业务或到财务补发。');
    for(const p of state.people)p.mood='工资延期';
  }else if(due){
    log('月度工资已支付 '+money(paid)+'。');
  }
}
function pendingAmount(a){return (a.pendingSplits||[]).reduce((sum,bill)=>sum+bill.amount,0);}
function splitRows(){return allTargets().filter(([,a])=>pendingAmount(a)>0);}
function annualBills(y){
  for(const [key,a] of units()){
    const released=state.works.some(w=>w.owner===key&&w.status==='released'&&!w.old&&w.format==='专辑'&&year(w.released)===y);
    const amount=Math.round((a.earnings||0)*.08);
    if(released&&amount)(a.pendingSplits??=[]).push({year:y,amount,deferred:false});
  }
  for(const [,a] of allTargets())a.earnings=0;
}
function doSplit(pay,key){
  const rows=splitRows().filter(([entry])=>!key||entry===key);
  const total=rows.reduce((n,[,a])=>n+pendingAmount(a),0);
  if(pay&&total>state.cash){error('现金不足以结算这些分账。');return false;}
  if(pay)state.cash-=total;
  const people=new Set();
  for(const [entry,a] of rows){
    if(pay||a.pendingSplits.some(bill=>!bill.deferred))for(const p of performers(entry))people.add(p);
    if(pay)a.pendingSplits=[];
    else for(const bill of a.pendingSplits)bill.deferred=true;
  }
  for(const p of people){p.mood=pay?'分账满意':'对分账延期不满';p.health=limit(p.health+(pay?3:-4));checkHealth(p);}
  if(rows.length)log(pay?'已完成年度分账，支付 '+money(total)+'。':'年度分账延期，可到艺人页补结。');
  return true;
}
activities.idle={name:'全员休整',hint:'未出勤艺人自动恢复健康',cost:0};
function upgrade(value){
  if(value.version===3)return upgradeScoutTiers(value);
  if(value.version===2)return upgradeMonthly(value);
  const first=value.week-value.week%4;
  const queue=[];
  value.queue.filter(Boolean).forEach((plan,i)=>queue[value.week%4+i]=plan);
  value.queue=queue.slice(0,4);
  if(queue[4])value.carryPlan=queue[4];
  value.startedAt=value.week;
  value.week=first;
  for(let i=0;i<value.startedAt-first;i++)value.queue[i]={type:'idle',legacy:true};
  if(value.annual?.status==='booked')value.annual.playWeek=first-first%48+43;
  if(value.annual?.status==='open')value.annual=null;
  return upgradeMonthly(value);
}
function upgradeMonthly(value){
  value.popoBusiness??=value.people.some(p=>p.popo);
  if(!value.annualWindowsUpdated){
    const m=month(value.week);
    if([8,9].includes(m)&&value.season?.status==='closed'&&value.season.year===year(value.week))value.season.status='open';
    if(m===10&&(!value.annual||value.annual.status==='expired'))value.annual={status:'open',playWeek:value.week-value.week%4+7};
    if(m===11)value.familyInvite??='open';
    value.annualWindowsUpdated=true;
  }
  for(const p of value.candidates)p.candidateUntil??=value.week+12;
  for(const w of value.works){
    if(w.status!=='released')w.format='专辑';
    if(w.signed)w.signings??=1;
  }
  for(const p of value.people)if(p.status==='artist'&&!p.solo&&!value.groups.some(g=>!g.closed&&g.members.includes(p.id))&&p.cool<=value.week)p.solo=true;
  for(const a of [...value.groups,...value.people]){
    if(a.splitYear&&a.earnings>0){
      const amount=Math.round(a.earnings*.08);
      if(amount)(a.pendingSplits??=[]).push({year:a.splitYear,amount,deferred:true});
      a.earnings=0;
    }
  }
  value.version=3;
  return upgradeScoutTiers(value);
}
function upgradeScoutTiers(value){
  if(!value.termsMigrated){
    for(const a of [...value.groups.filter(g=>!g.closed),...value.people.filter(p=>p.solo)]){
      a.term??={years:2,ends:value.week-value.week%4+96};
    }
    value.termsMigrated=true;
  }
  value.messages=value.messages.filter(m=>m.title!=='第一笔工资已付清').map(m=>['第一部新作品','第一次小型演唱会','第一次大型演唱会','第一次家族演唱会','海外第一站'].includes(m.title)?{...m,fromUncle:true}:m);
  if(!value.inviteWindowUpdated){
    for(const offer of value.inbox){if(offer.expiry>value.week)offer.expiry+=8;}
    value.inviteWindowUpdated=true;
  }
  value.queue=value.queue.map(p=>p?.type==='shoot'?{type:'idle'}:p);
  const tiers=new Set();
  value.scouts=(value.scouts||[]).filter(scout=>{const level=scout.level??scout;if(tiers.has(level))return false;tiers.add(level);return true;});
  return value;
}
function expireOffer(offer,reason){
  state.inbox=state.inbox.filter(i=>i.id!==offer.id);
  const a=target(offer.target);
  if(a&&offer.self&&!a.members){
    const before=a.health;
    a.health=limit(a.health-3);

function checkHealth(p){
  if(!person(p.id)||p.leaving)return;
  if(p.health>=20)p.red=false;
  if(p.health<20&&!p.red){
    p.red=true;
    if(p.savedOnce){
      const name=p.name;
      removeMember(p,true,false);
      log('离社 · '+name+'再次跌破 20，已离开公司。');
      message('离社 · '+name,'健康再次低于 20，艺人已离开公司。');
    }else{
      p.leaving=true;
      state.events.unshift({id:id(),type:'critical',person:p.id});
      log('离社预警 · '+p.name+'健康低于 20，可挽留一次。');
    }
    return;
  }
  if(p.health<=50&&!p.warned){
    p.warned=true;
    (state.warnings??=[]).push({name:p.name,health:p.health,week:state.week%4+1,id:p.id});
  }
  if(p.health<=50&&groupOf(p)&&!p.sick){
    const peers=groupOf(p).members.filter(k=>k!==p.id).map(k=>person(k).fans).sort((a,b)=>a-b);
    const mid=peers.length/2, median=peers.length%2?peers[Math.floor(mid)]:Math.round((peers[mid-1]+peers[mid])/2);
    const old=p.fans;p.fans=Math.min(old,median);p.sick=true;
    log(p.name+'进入病休'+(old>p.fans?' · 个人粉丝 −'+money(old-p.fans):'')+'。');
  }
  if(p.health>=65&&p.sick){p.sick=false;p.forcedRest=false;log(p.name+'结束病休，下一周恢复活动。');}
  if(p.health>50)p.warned=false;
}

function validateExecution(plan){
  const w=work(plan.ref), a=target(plan.target);
  const offer=plan.type==='invite'?state.inbox.find(i=>i.id===plan.ref):null;
  if(offer?.type==='recall'&&!recallSong(offer))return '歌曲已完成召回或无法演出';
  if(offer?.type==='recall'&&(!a||a.fans<=25000))return '召回打歌需要超过 25,000 粉丝';
  if(plan.type==='invite'&&(!offer||!offerVisible(offer)))return '邀约已过期或取消';
  if(plan.type==='festival'&&state.annual?.status!=='booked')return '拼盘档期已失效';
  if(plan.type==='concert'&&state.debt)return '旧债尚未还清';
  if(plan.type==='concert'&&plan.venue==='tour'&&(!state.tour||state.tour.target!==plan.target||state.tour.stops>=3))return '本轮巡演已结束或阵容已变动';
  if(plan.type==='concert'&&plan.venue==='family'){
    if(month(state.week)!==12||state.familyYear===year(state.week))return '家族演唱会每年 12 月限办一次';
    if(plan.hosts?.some(k=>!person(k)||lock(person(k))))return '开场主持人无法出勤';
    if(plan.songs?.some(id=>!familySongs(plan.lineup).some(song=>song.id===id)))return '有曲目已无法演出';
  }
  if(plan.target&&!a)return '艺人已无法参加';
  const actual=planPeople(plan).filter(k=>person(k)&&!lock(person(k)));
  const partial=['road','show','sale','festival','concert','vocal','dance','beauty','groupwrite','album'].includes(plan.type)||(offer&&!['solo','audition'].includes(offer.type));
  if(plan.type==='concert'&&plan.lineup&&plan.lineup.some(key=>performers(key).filter(p=>!lock(p)).length<(target(key)?.members?2:1)))return '家族演唱会阵容不足';
  if(plan.type==='release'&&w?.status==='ready'){if(planCost(plan)>state.cash)return '余额不足';return '';}
  if((a||plan.people||plan.lineup)&&actual.length<(a?.members&&partial?2:1))return '艺人锁档或可出勤人数不足';
  if(a?.members&&!partial&&actual.length!==a.members.length)return '这项活动需要完整阵容';
  if(plan.type==='release'&&w?.status!=='ready')return '作品尚未制作完成';
  if(['show','sale','road'].includes(plan.type)&&w?.status!=='released')return '作品尚未发行';
  if(plan.type==='road'&&!a?.members)return '地方路演仅限团体';
  if(plan.type==='show'){
    if(w.old||state.week<=w.released||state.week>w.released+6)return '已超出发行后六周打歌期';
    if(w.stations?.includes(plan.station))return '该作品已经上过这家音乐台';
    if(!stationEligible(a.fans,stations[plan.station]))return '需超过 '+money(stations[plan.station].fans)+' 粉丝';
  }
  if(plan.type==='sale'&&(w.old||w.format!=='专辑'||state.week<=w.released||state.week>w.released+24))return '超出发行后六个月签售窗口';
  if(plan.type==='album'&&plan.tracks?.some(k=>state.songs.find(s=>s.id===k)?.used))return '所选歌曲已经用于其他作品';
  const perPerson=Boolean(plan.people)||(['vocal','dance','beauty'].includes(plan.type)&&(a?.members||plan.lineup));
  if(planCost(plan)*(perPerson?actual.length:1)>state.cash)return '余额不足';
  plan.active=actual;
  return '';
}

function deltas(before){
  const items=[];
  const change=(label,amount)=>amount?label+' '+(amount>0?'+':'−')+money(Math.abs(amount)):'';
  if(state.cash!==before.cash)items.push(change('资金',state.cash-before.cash));
  for(const g of state.groups){if(before.groups.has(g.id)&&before.groups.get(g.id)!==g.fans)items.push(g.name+' '+change('组合粉丝',g.fans-before.groups.get(g.id)));}
  for(const p of state.people){
    const old=before.people.get(p.id);
    if(!old)continue;
    const values=[['粉丝','fans'],['健康','health'],['歌唱','vocal'],['舞蹈','dance'],['颜值','beauty']].map(([label,key])=>change(label,p[key]-old[key])).filter(Boolean);
    if(values.length)items.push(p.name+' '+values.join(' '));
  }
  return items.join(' · ');
}

}

      return members.filter(p=>p.sick||p.mood==='待遇不满'||(top>p.fans&&10*top>=27*p.fans));
    });
    const eligible=matches.filter(p=>!state.events.some(e=>e.type==='truck'&&e.person===p.id));
    const p=eligible.length?pick(eligible):null;
    if(p&&!state.events.some(e=>e.type==='truck'&&e.person===p.id))state.events.push({id:id(),type:'truck',person:p.id});
  }

function seasonCheck(){
  const m=month(state.week), y=year(state.week);
  for(const p of [...state.people]){
    if(p.showLock?.until<=state.week){
      const center=p.showLock.center;
      const payout=center?random(120000,160000):random(80000,120000);
      const fans=center?random(25000,40000):random(12000,25000);
      delete p.showLock;
      p.fans+=fans;
      income(payout,'p:'+p.id);
      const result=p.name+'活动期结束，回到公司。限定团收益 +'+money(payout)+' · 个人粉丝 +'+money(fans)+'。';
      notice('限定团成员归队',result);
      (state.fanNews??=[]).push(result);
    }
    if(!p.showLock&&p.privacy&&p.privacyDue<=state.week){
      if(p.privacy>=3){message('私生事件 · 离社',p.name+'身心俱疲，已离开公司。');removeMember(p,true,false);continue;}
      if(!state.events.some(e=>e.type==='privacy'&&e.person===p.id))state.events.push({id:id(),type:'privacy',person:p.id});
    }
  }
  if(m===8){state.season={year:y,gender:y%2?'女':'男',status:'open',people:[]};notice('星光闪耀时 · '+state.season.gender+'生季','最多选派 3 名符合条件的练习生。暂不选择可在待处理事件中继续报名，9 月底截止。','seasonpick','annual');}
  if(m===10&&['open','signed'].includes(state.season?.status))state.season.status='closed';
  if(m!==2||state.season?.status!=='running')return;
  const candidates=state.season.people.map(person).filter(Boolean);
  const score=p=>p.vocal+p.dance+p.beauty;
  const qualified=candidates.filter(p=>Math.min(p.vocal,p.dance,p.beauty)>=50);
  const center=qualified.filter(p=>p.health>=65&&Math.min(p.vocal,p.dance,p.beauty)>=95).sort((a,b)=>score(b)-score(a)||a.id-b.id)[0];
  const results=[];
  for(const p of candidates){
    const success=qualified.includes(p)&&(Math.max(p.vocal,p.dance,p.beauty)>=85||random(1,100)<=25);
    if(success){p.showLock={until:state.week+48,center:p===center};results.push(p.name+(p===center?' C 位出道':'获得出道位'));}
    else{delete p.showLock;results.push(p.name+'回到公司');}
  }
  state.season.status='closed';
  const debuted=candidates.filter(p=>p.showLock?.until).map(p=>p.name);
  const roster=[...debuted,...(state.season.gender==='女'?female:male).filter(name=>!debuted.includes(name))].slice(0,9);
  const result='限定团名单：'+roster.join('、')+'。'+results.join('。')+'。限定团活动期一年。';
  notice('星光闪耀时 · 九人限定团公布',result);
  (state.fanNews??=[]).push('星光闪耀时 · '+result);
  (state.nextNews??=[]).push('星光闪耀时九人限定团：'+roster.join('、'));
}

let newsTimer;
function rotateNews(){
  clearInterval(newsTimer);
  const ticker=app.querySelector('.news');
  if(!ticker||ticker.children.length<2||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  newsTimer=setInterval(()=>{
    if(ticker.matches(':hover')||ticker.contains(document.activeElement))return;
    const cards=Array.from(ticker.children), current=cards.reduce((best,card,i)=>Math.abs(card.offsetLeft-cards[0].offsetLeft-ticker.scrollLeft)<Math.abs(cards[best].offsetLeft-cards[0].offsetLeft-ticker.scrollLeft)?i:best,0);
    ticker.scrollTo({left:cards[(current+1)%cards.length].offsetLeft-cards[0].offsetLeft,behavior:'smooth'});
  },5000);
}

function submitFinance(form){
  const amount=Number(new FormData(form).get('amount')), kind=form.dataset.kind;
  const max=kind==='borrow'?60000-state.loan:Math.min(state.cash,state[kind]);
  if(!Number.isInteger(amount)||amount<1||amount>max){error('请选择有效的金额。');return;}
  if(kind==='borrow'&&(state.debt||state.loan||state.arrears)){error('请先清偿现有债务和欠薪。');return;}
  if(kind==='borrow'){state.cash+=amount;state.loan+=amount;}
  else{state.cash-=amount;state[kind]-=amount;}
  if(kind==='debt'&&!state.debt)milestone('paid','旧债已还清','叔叔发来一张照片。他穿着沾满水泥灰的工服，晒黑了不少，身后垒着半人高的砖。短信只有一句：「'+state.player+'，我就知道你能做到。你上次说想办专场，对吧？哪天开票记得告诉我。」\n\n自办演唱会已解锁。');

    const term=a.term;
    if(!term||term.ends>state.week+4){error('尚未到续约时间。');return;}
    term.request??=random(1,100)<=20?pick(['增加休息安排','考虑个人发展','沟通团队待遇']):'按常规条件续约';
    save();
    open('续约 · '+a.name,'<p>'+escape(term.request)+'。预计年费 '+money(termFee(a))+'，续约时结算，之后每满一年结算一次。</p><form id="renew" data-key="'+key+'"><label>续约期限<select name="years">'+termOptions()+'</select></label><button class="primary">确认续约</button></form>'+button('结束企划','endterm',key));
  },
  endterm:key=>{
    const a=target(key);if(!a)return;
    confirmAction('结束企划','艺人继续留社，保留个人属性和粉丝。','endtermdone',key);
  },
  endtermdone:key=>{
    const a=target(key);if(a?.members)retireGroup(a);else if(a)endSolo(a);finish();if(!showNextNotice())showMonthlyReport();
  },
  dismissask:arg=>{const p=person(Number(arg));confirmAction('结束合约','将 '+p.name+' 移出公司，并取消其个人排程。若有团籍，组合粉丝会受到影响。','dismiss',arg);},
  dismiss:arg=>{const p=person(Number(arg));if(lock(p)){error('制作期间不能解约。');return;}removeMember(p,true,false);finish();},
  finance, concert:concertForm, tour:tourForm,
  invite:arg=>{
    const i=state.inbox.find(x=>x.id===Number(arg));
    if(!i||!offerVisible(i))return;
    directPlan({type:'invite',ref:i.id,target:i.target});
  },
  decline:arg=>{const offer=state.inbox.find(i=>i.id===Number(arg));if(!offer)return;state.logs=[];expireOffer(offer,'已拒绝');const lines=state.logs.slice();(state.fanNews??=[]).push(...lines);finish();open('邀约处理结果',lines.map(line=>'<p>'+escape(line)+'</p>').join(''));},
  event:arg=>{
    const e=state.events.find(x=>x.id===Number(arg)), p=person(e.person);
    const agree=p.mood==='沟通良好'||p.personality==='团队优先'?75:25;
    open(eventTitle(e),(e.cause?'<p>后台记录：'+escape(e.cause)+'。</p>':'')+'<div class="stack">'+eventChoices[e.type].map(([value,label,hint])=>
      '<div>'+button(label,'eventchoice',arg+':'+value)+'<small>'+ (e.type==='friction'&&value==='keep'?retentionChance(p)+'% 留团':e.type==='raise'&&value==='talk'?agree+'% 接受原薪':hint)+'</small></div>').join('')+'</div>');
  },
  eventchoice:arg=>{
    const [ref,choice]=arg.split(':'), event=state.events.find(e=>e.id===Number(ref));
    if(!event)return;
    const actor=person(event.person), title=eventTitle(event), before=snapshot(), previousMessages=state.messages.length, previousFeedback=state.fanNews?.length||0;
    eventChoice(event.id,choice);
    if(state.events.some(e=>e.id===event.id))return;
    const result=deltas(before), feedback=state.fanNews||[];
    if(feedback.length===previousFeedback){
      const line=title+' · '+(!person(actor.id)?'艺人已离社。':actor.mood!==before.people.get(actor.id).mood?'艺人状态：'+actor.mood+'。':state.messages.length!==previousMessages?state.messages[0].body:'已按选项处理。')+(result?' · '+result:'');
      (state.fanNews??=[]).push(line);
      save();
      if(!sheet.open)open('事件结果','<p>'+escape(line)+'</p>');
    }else if(!sheet.open)open('事件结果','<p>'+escape(feedback.at(-1))+'</p>');
  },
  message:arg=>{
    const m=state.messages.find(x=>x.id===Number(arg));m.read=true;save();render();
    open(m.title,escape(m.body).split('\n').map(s=>'<p>'+s+'</p>').join(''));
  },
  messages:()=>open('主线短信',state.messages.filter(m=>m.fromUncle||(m.fromUncle==null&&['叔叔汇来 20,000','旧债已还清','第一次小型演唱会','海外第一站','世界巡演官宣','三站巡演完成'].includes(m.title))).map(m=>'<p>'+button((m.read?'':'● ')+m.title,'message',m.id)+'</p>').join('')||'<p>还没有短信。</p>'),
  annualapply:()=>{
    if(state.annual?.status!=='open'||month(state.week)!==10)return;
    const rows=festivalCandidates();
    if(!rows.length){open('世界中心年末拼盘','<p>当前没有符合条件的出演单位。邀约已放入待处理事件，可在 10 月底前返回报名。</p>');return;}
    open('世界中心年末拼盘 · 报名','<p>任选 1～2 组，可以同类型。所有出演单位共用 11 月第 4 周一个行程格。</p><form id="annualapply">'+rows.map(([key,a])=>
      '<label><input type="checkbox" name="target" value="'+escape(key)+'"> '+escape(a.name)+' · '+(a.members?'团体':'Solo')+' · '+money(a.fans)+' 粉丝</label>').join('')+'<button class="primary" disabled>确认报名</button></form>');
  },
  split:arg=>{
    const rows=splitRows().filter(([key])=>!arg||key===arg);
    open('年度分账','<p>可以当场结算，也可以延期后在艺人页面补结。练习生不参与分账。</p>'+rows.map(([key,a])=>
      textBlock(a.name,'<small>'+a.pendingSplits.map(b=>'第 '+b.year+' 年 '+money(b.amount)).join(' · ')+'</small><div class="row">'+
        button('结算','splitdo','pay:'+key,'primary')+button('延期','splitdo','later:'+key,'',a.pendingSplits.every(b=>b.deferred))+'</div>')).join('')+
      (rows.length>1?button('全部结算','splitall')+button('全部延期','splitdo','later'):''));
  },
  splitall:()=>confirmAction('一键结算','将支付全部待分账金额 '+money(splitRows().reduce((n,[,a])=>n+pendingAmount(a),0))+'。','splitdo','pay'),
  splitdo:arg=>{const [mode,...parts]=arg.split(':');if(doSplit(mode==='pay',parts.join(':'))){finish();if(splitRows().some(([,a])=>a.pendingSplits.some(b=>!b.deferred)))actions.split();}},

  export:()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='encore-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  },
  import:()=>open('导入存档','<p>导入会覆盖当前进度。可以先关闭并导出备份。</p><form id="import"><label>选择存档文件<input type="file" name="file" accept=".json,application/json" required></label><button class="primary">确认导入并覆盖</button></form>')
};
sheet.addEventListener('cancel',event=>{if(state?.notices?.length||state?.monthSummary){event.preventDefault();if(state.notices?.length)showNextNotice();else actions.close();}});
document.addEventListener('click',event=>{
  const node=event.target.closest('[data-action]');
  if(node&&!node.disabled)actions[node.dataset.action]?.(node.dataset.arg);
});
document.addEventListener('input',event=>{
  const input=event.target;
  if(input.form?.id==='annualapply'){
    const boxes=input.form.querySelectorAll('[name=target]');
    const count=Array.from(boxes).filter(box=>box.checked).length;
    for(const box of boxes)box.disabled=!box.checked&&count>=2;
    input.form.querySelector('button').disabled=count<1||count>2;
  }
  if(input.form?.id==='plan'&&input.name==='ref'&&['show','release'].includes(input.form.dataset.type))refreshPlanOptions(input.form);
  if(['planSort','planDirection'].includes(input.name)){
    const list=input.form.querySelector('.plan-choices'), key=input.form.elements.planSort.value, direction=Number(input.form.elements.planDirection.value);
    if(key)Array.from(list.children).sort((a,b)=>direction*(Number(a.dataset[key])-Number(b.dataset[key]))).forEach(row=>list.append(row));
  }
  if(input.form?.dataset.venue==='family'){
    const form=input.form, data=new FormData(form), lineup=data.getAll('lineup');
    for(const box of form.querySelectorAll('[name=song]')){
      box.disabled=!lineup.includes(box.dataset.owner);
      if(box.disabled)box.checked=false;
    }
    const count=form.querySelectorAll('[name=song]:checked').length;
    const fans=lineup.reduce((n,key)=>n+target(key).fans,0);
    const estimate=concertBoxOffice('family',fans,count);
    form.querySelector('#ticketEstimate').textContent=lineup.length>=2&&count>=3&&count<=8?money(Math.max(80000+concertProfitFloor('family'),Math.round(estimate*.9)))+'～'+money(Math.max(80000+concertProfitFloor('family'),Math.round(estimate*1.1))):'请至少选两组艺人和 3～8 首歌';
  }
  if(input.form?.id==='finance')sheet.querySelector('#balance').textContent=money(state.cash+(input.form.dataset.kind==='borrow'?1:-1)*Number(input.value));
});
document.addEventListener('submit',async event=>{
  event.preventDefault();
  const form=event.target, data=new FormData(form);
  switch(form.id){
    case 'setup':
      draft={company:String(data.get('company')).trim(),player:String(data.get('player')).trim(),
        groupName:String(data.get('groupName')).trim(),kind:String(data.get('kind'))};
      if(!draft.company||!draft.player||!draft.groupName){error('请填写三个名称。');return;}
      intro=1;render();break;
    case 'plan':submitPlan(form);break;
    case 'popoapply': {
      const selected=new Set(data.getAll('member').map(Number));
      if(!state.popoBusiness||!selected.size){error('请勾选要开通的艺人。');return;}
      for(const p of state.people)if(selected.has(p.id)&&p.fans>=10000)p.popo=true;
      finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'artistsort':artistSort={key:data.get('stat'),direction:Number(data.get('direction'))};finish();break;
    case 'season': {
      const members=data.getAll('member').map(Number);
      if(state.season?.status!=='open'||![8,9].includes(month(state.week))||!members.length||members.length>3||members.some(id=>!seasonCandidates().some(p=>p.id===id))){error('请选择 1～3 名可参赛的练习生。');return;}
      state.season.people=members;state.season.status='running';
      for(const key of members)person(key).showLock={competing:true};
      finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'debut':submitDebut(form);break;
    case 'renew':{
      const a=target(form.dataset.key), years=Number(data.get('years'));
      if(!a?.term||![1,2,3].includes(years))break;
      const fee=Math.min(state.cash,termFee(a));
      changeCash(-fee);startTerm(a,years);
      (state.fanNews??=[]).push(a.name+'续约 '+years+' 年 · 资金 −'+money(fee));
      finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'finance':submitFinance(form);showNextNotice();break;
    case 'rename': {
      const name=String(data.get('name')).trim();
      if(!name){error('请填写名称。');return;}
      const entry=(form.dataset.kind==='g'?team:person)(Number(form.dataset.id));
      if(name!==entry.name){
        if(!entry.firstName){entry.fans=Math.max(0,entry.fans-Math.ceil(entry.fans*.07));entry.renameUntil=state.week+24;}
        entry.name=name;
      }
      delete entry.firstName;finish();break;
    }
    case 'concert': {
      const venue=form.dataset.venue, lineup=data.getAll('lineup');
      if(venue==='family'&&lineup.length<2){error('请选择至少两个演出单位。');return;}
      const hosts=[Number(data.get('hostMale')),Number(data.get('hostFemale'))].filter(Boolean);
      const songs=data.getAll('song');
      if(venue==='family'){
        if(hosts.length===1){error('请安排一男一女搭档主持，或两位都不安排。');return;}
        if(songs.length<3||songs.length>8||songs.some(id=>!familySongs(lineup).some(song=>song.id===id))){error('请从已选阵容中勾选 3～8 首歌。');return;}
      }
      if(venue==='family'){
        const slot=Number(data.get('familyWeek'));
        if(state.debt||month(state.week)!==11||state.familyInvite!=='open'||![0,1,2,3].includes(slot)){error('当前无法提交家族演唱会企划。');return;}
        state.familyPlan={slot,plan:{type:'concert',venue,lineup,hosts,songs,familyBooking:true}};
        state.familyInvite='booked';
        finish();if(!showNextNotice())showMonthlyReport();break;
      }
      directPlan({type:'concert',venue,target:data.get('target')});break;
    }
    case 'announce': {

      state.tour={target:data.get('target'),stops:0};
      milestone('announced','世界巡演官宣','票什么时候开售？给叔叔发个链接。');
      finish();showNextNotice();break;
    }
    case 'annualapply': {
      if(month(state.week)!==10||state.annual?.status!=='open')return;
      const lineup=[...new Set(data.getAll('target'))], eligible=new Map(festivalCandidates());
      if(lineup.length<1||lineup.length>2||lineup.some(key=>!eligible.has(key))){error('请选择 1～2 组符合条件的出演单位。');return;}
      state.annual.lineup=lineup;
      state.annual.names=Object.fromEntries(lineup.map(key=>[key,eligible.get(key).name]));
      state.annual.status='booked';finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'import':
      try {
        const next=JSON.parse(await data.get('file').text());
        if(!savedGame(next))throw Error('invalid');
        state=upgrade(next);tab=0;finish();
      }catch{error('请选择本游戏导出的有效存档。');}
      break;
  }
});
if(state)state=savedGame(state)?upgrade(state):null;
render();
if(state&&!showNextNotice())showMonthlyReport();
</script>
</body>
</html>
