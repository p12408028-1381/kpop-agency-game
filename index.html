<script>
'use strict';
const KEY = 'encore-agency-v1';
/* ── 平衡表 ────────────────────────────────────────────────
   集中放数值，改平衡只需要动这一段。
   MONEY_PER_FAN     每 1 元资金折算的“粉丝规模系数”基准
   SCALE_LOG         规模系数强度：1 + log10(1+fans/K)*A
   ALBUM_UNIT        专辑单本利润（常规 / 含周边）
   SIGNING_UNIT      签售应募期单本利润（含应募券与特典溢价）
   SALARY_RATE       艺人工资 = 上月公司收入 × 该比例
   AGENCY_RATE       练习生工资 = 量级 × 该比例（比出道艺人低很多）
   ──────────────────────────────────────────────────────── */
const BAL={
  salaryRate:.12, agencyRate:.03,
  scaleLog:.55, scaleBase:1000,
  launchMin:.45, launchMax:.95, walkonMin:.15, walkonMax:.45,
  fameGainRate:.004, fameSalesRate:.007
};
// 知名度：还清旧债后开启，0~100。涨粉与首周销量各吃一份系数。
const fameTiers=[[0,'鲜为人知'],[20,'初露头角'],[40,'业内知名'],[60,'广为人知'],[80,'享誉国际']];
function fame(){return state?.debt?0:(state?.fame||0);}
function fameTitle(value=fame()){let title=fameTiers[0][1];for(const [min,label] of fameTiers)if(value>=min)title=label;return title;}
function fameGainFactor(){return 1+fame()*BAL.fameGainRate;}
function fameSalesFactor(){return 1+fame()*BAL.fameSalesRate;}
function addFame(amount,reason){
  if(!state||state.debt)return 0;
  const before=state.fame||0;
  state.fame=Math.min(100,before+amount);
  const gained=state.fame-before;
  if(gained>0){log((reason?reason+' · ':'')+'公司知名度 +'+gained+'（'+state.fame+' / 100）');(state.nextNews??=[]).push('业界动态 · '+state.company+'知名度提升至 '+state.fame+' / 100。');}
  return gained;
}
function famePanel(){
  if(state.debt)return '';
  return '<button class="fame-card" data-action="famedetails" aria-label="查看公司知名度加成，当前'+fameTitle()+'，'+fame()+'点"><strong>'+fameTitle()+'</strong><span>'+fame()+' / 100</span></button>';
}
function fameDetails(){
  if(state.debt)return;
  const value=fame();
  const percent=(points,rate)=>Number((points*rate*100).toFixed(1))+'%';
  const bonuses=points=>'涨粉 +'+percent(points,BAL.fameGainRate)+' · 首周销量 +'+percent(points,BAL.fameSalesRate);
  const thresholds=[...fameTiers.slice(1),[100,'知名度满点']];
  open('知名度加成','<h3>'+fameTitle()+' · '+value+' / 100</h3><p class="fame-bonus'+(value?'':' locked')+'">'+bonuses(value)+'</p>'+
    '<p>每增加 1 点，涨粉加成提高 '+percent(1,BAL.fameGainRate)+'，首周销量加成提高 '+percent(1,BAL.fameSalesRate)+'。以下为各点数对应的累计加成。</p>'+
    thresholds.map(([min,label])=>'<p class="fame-bonus'+(value>=min?'':' locked')+'">'+label+' · '+min+' 点 · '+(value>=min?'已激活':'未激活')+'<br>'+bonuses(min)+'</p>').join('')+
    '<small>知名度来源：选秀成功出道 +1 · 海外演唱会 +1 · 世界中心年末拼盘 +2 · 家族演唱会 +2 · 世界巡演 +3 · 救灾捐款 +2～5。</small>');
}
const money = value => Number(value).toLocaleString('zh-CN');
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const random = (min,max) => min + Math.floor(Math.random()*(max-min+1));
const pick = list => list[random(0,list.length-1)];
const limit = value => Math.max(0,Math.min(100,value));
const year = week => Math.floor(week/48)+1;
const month = week => Math.floor(week%48/4)+1;
const date = week => '第 '+year(week)+' 年 · '+month(week)+' 月第 '+(week%4+1)+' 周';
const tabs = ['本月','艺人','作品','公司'];
const stations = [
  {name:'首尔舞台',fans:0,description:'没有粉丝也能上，小公司的首选舞台。',cost:900,range:[60,220],rival:[0,4700]},
  {name:'全国放送',fans:8000,description:'粉丝大于 8,000 才能上，适合已有一定人气的艺人。',cost:2300,range:[200,600],rival:[8001,24800]},
  {name:'世界中心',fans:25000,description:'粉丝大于 25,000 才能上，竞争更激烈。',cost:5500,range:[520,1400],rival:[25001,88000]}
];
const invites = {
  brand:{name:'品牌站台',hint:'＋资金　＋粉丝　－健康',pay:5200},
  recall:{name:'召回打歌',hint:'＋粉丝　－健康',pay:0},
  variety:{name:'综艺出演',hint:'＋资金　＋粉丝　－健康',pay:2600},
  ad:{name:'广告拍摄',hint:'＋资金　＋粉丝　－健康',pay:6800},
  audition:{name:'影视试镜',hint:'试镜基础成功率 40%，影视企划部建成后 60% · －健康',pay:0},
  solo:{name:'个人 Solo 作品邀约',hint:'启动制作 · 4 周后完成',pay:0}
};
const activities = {
  tourdepart:{name:'世界巡演 · 出发',hint:'巡演单位离队 12 周',cost:0},
  vocal:{name:'声乐训练',hint:'＋歌唱　－健康',cost:250},
  dance:{name:'舞蹈训练',hint:'＋舞蹈　－健康',cost:250},
  rest:{name:'主动休养',hint:'＋健康',cost:0},
  beauty:{name:'医美',hint:'＋颜值　可能－颜值',cost:1400},
  scout:{name:'星探发掘',hint:'发现练习生',cost:300},
  recruit:{name:'公司招募',hint:'发现练习生',cost:750},
  groupwrite:{name:'团体作曲',hint:'曲库新增 1 首歌　－健康',cost:0},
  write:{name:'成员自作曲',hint:'曲库新增 1 首歌　－健康',cost:0},
  album:{name:'专辑制作',hint:'4 周后完成，艺人可照常活动',cost:0},
  release:{name:'发行作品',hint:'＋粉丝',cost:2000},
  road:{name:'地方路演',hint:'＋资金　＋粉丝　－健康',cost:900},
  warm:{name:'家乡动员',hint:'＋资金　＋粉丝　－健康',cost:0},
  sale:{name:'专辑签售',hint:'＋资金　＋粉丝　－健康',cost:0},
  show:{name:'音乐台打歌',hint:'＋粉丝　－健康',cost:0},
  invite:{name:'接受邀约',hint:'选择执行周',cost:0},
  concert:{name:'演唱会',hint:'＋粉丝　－健康',cost:0},
  festival:{name:'世界中心年末拼盘',hint:'＋资金　＋粉丝　－健康',cost:0},
  shoot:{name:'影视拍摄',hint:'＋资金　－健康 · 等待播出',cost:0},
  press:{name:'召开说明会',hint:'＋粉丝',cost:0}
};
const venues = {
  local:{name:'韩国小型专场',fans:5000,cost:15000,rate:.6,floor:12000,cap:35000,gain:[520,1500]},
  arena:{name:'韩国大型专场',fans:22000,cost:40000,rate:.9,floor:30000,cap:85000,gain:[950,2400]},
  abroad:{name:'海外专场',fans:30000,cost:60000,rate:1.2,floor:45000,cap:150000,gain:[1400,3200]},
  family:{name:'家族演唱会',fans:0,cost:50000,rate:.8,floor:25000,cap:180000,gain:[800,2200]},
  tour:{name:'世界巡演',fans:55000,cost:60000,rate:1.6,floor:120000,cap:250000,gain:[1900,4200]}
};
const male = ['旻宰','泰旴','道允','宇贤','时温','睿俊','贤宇','在律','江珉','延昊',...('俊赫 允成 瑞律 时宇 民奎 佑镇 在民 成勋 允浩 志勋 秀彬 泰俊 东赫 俊熙 义贤 道勋 珉锡 振宇 荣宰 昀成 胜元 智安 河俊 承佑 知翰 宇彬 珉豪 建宇 载勋 仁秀 太贤 东允 叙俊 辰赫 廷宇 浩彬 佑成 灿宇 尚贤 景律'.split(' '))];
const female = ['知媛','荷允','瑞妍','恩夏','多温','宝敏','雪雅','有真','采恩','宥娜',...('智秀 恩彩 瑞珍 素妍 娜恩 夏琳 允书 秀彬 雅凛 秀雅 惠珍 智敏 佳恩 智妍 素律 允真 艺琳 叙允 秀彗 诗恩 道熙 多仁 佳律 慧林 瑞英 罗希 侑利 世雅 普美 叡媛 昭律 银书 智友 夏恩 熙秀 多惠 恩率 采璘 诗妍 佳炫'.split(' '))];
const songNames = ['雨停之前','玻璃窗','夜班公车','慢一拍','纸月亮','拥挤的信箱','四月的海','最后一班地铁'];
const app = document.querySelector('#app');
const nav = document.querySelector('#nav');
const sheet = document.querySelector('#sheet');
let state = null, tab = 0, artistFilter='团体', artistSort=null, intro = 0, draft = null, storageFailed = false;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
function save(){
  try { localStorage.setItem(KEY,JSON.stringify(state)); storageFailed=false; }
  catch { storageFailed=true; }
}
function id(){return ++state.serial;}
function person(key){return state.people.find(p=>p.id===key);}
function team(key){return state.groups.find(g=>g.id===key && !g.closed);}
function work(key){return state.works.find(w=>w.id===key);}
function target(key){
  const [type,raw] = String(key||'').split(':');
  return type==='g'?team(Number(raw)):type==='p'?person(Number(raw)):null;
}
function groupOf(p){return state.groups.find(g=>!g.closed && g.members.includes(p.id));}
function performers(key){
  const entry=target(key);
  return !entry?[]:entry.members?entry.members.map(person).filter(Boolean):[entry];
}
function units(){
  return [...state.groups.filter(g=>!g.closed).map(g=>['g:'+g.id,g]),
    ...state.people.filter(p=>p.solo).map(p=>['p:'+p.id,p])];
}
function availableWorks(key){return state.works.filter(w=>w.owner===key && w.status==='released');}
function activePeople(){return state.people.map(p=>['p:'+p.id,p]);}
function allTargets(){return [...units(),...activePeople().filter(([key])=>!units().some(([k])=>k===key))];}
function tours(){return state.tours??(state.tourLock?[state.tourLock]:[]);}
function tourOf(p){return p&&tours().find(t=>state.week<t.until&&(t.members||performers(t.target).map(q=>q.id)).includes(p.id));}
function tourLocked(p){
  return Boolean(tourOf(p));
}
function lock(p){return p.sick||p.leaving||p.shelved||p.showLock||p.restLock||tourLocked(p);}
function lockedText(p){
  if(p.leaving)return '待处理离社';
  if(tourLocked(p))return '世界巡演中（'+(tourOf(p).until-state.week)+' 周后归队）';
  if(p.sick||p.forcedRest)return '养病中';
  if(p.restLock)return (p.restLabel||'长期休假')+'（'+(p.restLock- state.week)+' 周后归队）';
  if(p.showLock){
    const until=typeof p.showLock==='number'?p.showLock:p.showLock.until;
    return '群星闪耀时 · 封闭录制中'+(until?'（'+Math.max(0,until-state.week)+' 周后归队）':'');
  }
  if(p.shelved)return '暂停公开活动';
  return '';
}
// 工资 = 上月公司收入 × 比例，按个人权重分摊。
// 收入为 0 的月份工资自动为 0 —— 不设固定支出、不产生欠薪、不会透支。
function salaryWeight(p){
  const tier=Math.floor((p.fans||0)/4000);           // 粉丝越多，权重越高（有成长感）
  return (p.status==='artist'?.6:.15)*(1+tier*.5);
}
function wagePool(){return Math.max(0,Math.round((state.lastMonthIncome||0)*BAL.salaryRate));}
function wages(){return (state.people.some(p=>p.status==='artist')?wagePool():0)+500*state.people.filter(p=>p.status!=='artist').length;}
function personWage(p){
  if(p.status!=='artist')return 500;
  const pool=wagePool();
  if(!pool)return 0;
  const total=state.people.filter(q=>q.status==='artist').reduce((sum,q)=>sum+salaryWeight(q),0)||1;
  return Math.round(pool*salaryWeight(p)/total);
}
function log(message){state.logs.push(message);}
function message(title,body,fromUncle=false){state.messages.unshift({id:id(),title,body,read:false,fromUncle});}
function milestone(key,title,body){
  if(state.flags[key])return;
  state.flags[key]=true;
  if(!body)return;
  const story=['aid','release','paid','local','arena','family','abroad','announced','tourDone'].includes(key);
  if(story)message('叔叔的短信 · '+title,body,true);
  if(story||key==='humane')notice(story?'叔叔发来了新的短信 · '+title:title,body);
}
function notice(title,body,action='',kind=''){
  (state.notices??=[]).push({title,body,action,kind});
}
const internationalNames={
  日本:{男:'佐藤悠真 高桥海斗 中村莲 伊藤直树 山田晴人 小林翔太',女:'铃木美咲 佐藤结衣 高桥凛 小川阳菜 田中七海 森川葵'},
  中国:{男:'林远 周子昂 陈星宇 韩嘉树 沈亦安 许明澈',女:'林知夏 沈佳宁 周可欣 许星禾 苏念安 陈予晴'},
  美国:{男:['Evan Brooks','Noah Rivera','Miles Carter','Eli Morgan','Owen Reed','Caleb Hayes'],女:['Ava Reed','Maya Brooks','Zoe Parker','Nora Lane','Lily Hayes','Ivy Carter']},
  澳大利亚:{男:['Luca Hart','Finn Lawson','Hugo Bell','Archie West','Oscar Quinn','Toby Ellis'],女:['Ruby Ellis','Isla Hart','Mia Lawson','Tessa Bell','Chloe West','Matilda Quinn']}
};
function nameWithCountry(p){return p.name+(p.country?' · '+p.country:'');}
function newPerson(gender,mature=false,country=''){
  const names=country?internationalNames[country][gender]:(gender==='男'?male:female);
  const pool=Array.isArray(names)?names:names.split(' ');
  const used=new Set([...state.people,...state.candidates,state.transfer].filter(Boolean).map(p=>p.name));
  const fresh=pool.filter(name=>!used.has(name));
  return {id:id(),name:pick(fresh.length?fresh:pool),country,
    gender,hasDebuted:mature,status:mature?'artist':'trainee',solo:false,fans:mature?random(250,4200):0,
    vocal:random(mature?42:25,mature?83:67),dance:random(mature?42:25,mature?83:67),
    beauty:random(35,88),health:random(77,100),cool:0,
    personality:pick(['慢热','外向','重视个人发展','团队优先','好胜','沉稳']),writer:random(1,4)===1,mood:'平稳'};
}
function rivalLineup(){
  const names=['月湾娱乐 · ORBITAL','白昼唱片 · Nacre','星岸企划 · MIRU','桥灯音乐 · PAGE','北港娱乐 · HAZE','春日制作 · Pollen'];
  return stations.map(s=>{
    const pool=[...names];
    return Array.from({length:random(1,3)},()=>{
      const name=pool.splice(random(0,pool.length-1),1)[0];
      return {name,fans:random(...s.rival)};
    });
  });
}
function start(config){
  state={version:5,recruitmentUpdated:true,termsMigrated:true,inviteWindowUpdated:true,serial:0,...config,week:0,cash:50000,debt:200000,loan:0,arrears:0,lastMonthIncome:0,people:[],groups:[],
    works:[],songs:[],queue:[],inbox:[],events:[],messages:[],logs:[],last:[],candidates:[],flags:{},fame:0,donationNews:null,donationLast:0,dissolveDues:[],
    rivals:rivalLineup(),familyYear:0,splitYear:0,annual:null,tour:null,roles:[]};
  const genders=config.kind==='男团'?Array(5).fill('男'):config.kind==='女团'?Array(5).fill('女'):['男','男','女','女','女'];
  for(const gender of genders){
    const p=newPerson(gender,true);p.fans=random(120,650);p.openingName=true;state.people.push(p);
  }
  const group={id:id(),term:{ends:96,years:2},name:config.groupName,members:state.people.map(p=>p.id),fans:random(600,1250),closed:false};
  state.groups.push(group);
  state.works.push({id:id(),owner:'g:'+group.id,title:'雨后的练习室',format:'专辑',status:'released',old:true});
  message('交接短信',state.company+'大楼的钥匙寄给你了。叔叔先出去避避风头。',true);state.messages[0].read=true;

  const queued=(kind,id)=>state.queue.some(p=>p&&(kind==='offer'?p.type==='invite'&&p.ref===id:p.eventRef===id));
  const rows=[];
  for(const e of state.events){

  }
  if(dueTerms().length)rows.push({kind:'terms',id:'terms',rank:1});

function enqueue(plan,slot){
  if(!Number.isInteger(slot)||slot<0||slot>3){error('请选择第 1～4 周。');return;}
  if(fixedPlan(state.queue[slot])){error('该周已有固定演出。');return;}
  if(plan.type==='release'&&isPlanned('release',plan.ref,null,slot)){error('这张专辑本月已经安排发行。');return;}
  if(['road','show','sale'].includes(plan.type)&&!rosterAvailable(plan.target,state.week+slot,slot)){error('该周能够出勤的艺人人数不足。');return;}
  if(plan.type==='show'&&unavailableStation(work(plan.ref),plan.station,slot)){error('音乐台已安排、已登台或未达到粉丝门槛。');return;}
  if(plan.type==='sale'&&!canSignAt(work(plan.ref),slot)){error('这周已超出签售期，请选择可用周次。');return;}
  if(plan.type==='release'){const w=work(plan.ref);if(w?.status==='making'&&w.ready>state.week+slot){error('这一周作品尚未完成，请选完成周或更晚。');return;}}
  if(plan.type==='invite'){
    const offer=state.inbox.find(i=>i.id===plan.ref);
    if(!offer||state.week+slot>=offer.expiry){error('该周已经超过邀约截止日。');return;}
  }
  if(plan.eventRef&&state.queue.some((p,i)=>i!==slot&&p?.eventRef===plan.eventRef)){error('此事件已有安排。');return;}
  state.queue[slot]=plan;
  finish();
  if(state.monthSummary&&!showNextNotice())showMonthlyReport();

function submitPlan(form){
  const data=new FormData(form), type=form.dataset.type, slot=Number(form.dataset.slot);
  const ref=Number(data.get('ref')), entry=work(ref);
  if(['release','show','road','sale'].includes(type)&&!entry){error('请选择可用作品。');return;}
  const p={type,ref,target:entry?.owner||data.get('target')||null};
  if(type==='sale'){
    p.signings=data.get('signing')==='both'?['offline','video']:[data.get('signing')].filter(kind=>['video','offline'].includes(kind));
    if(!p.signings.length){error('请至少选择一种签售。');return;}
  }
  if(type==='show'){
    p.station=Number(data.get('station'));
    if(entry.stations?.includes(p.station)||state.queue.some((other,i)=>i!==slot&&other?.type==='show'&&other.ref===ref&&other.station===p.station)){error('这部作品已经登上过该音乐台。');return;}
    if(data.get('station')==null||unavailableStation(entry,p.station,slot)){error('该音乐台当前不可排期。');return;}
    p.rivals=stationRivals(p.station);
  }
  const selected=data.getAll('member').map(Number);
  const teams=data.getAll('team').map(Number);
  if(['vocal','dance','beauty','warm'].includes(type)&&!p.target&&!selected.length&&!teams.length){error('请至少选择一个对象。');return;}
  if(['vocal','dance','beauty','warm'].includes(type)&&!p.target){
    p.people=[...new Set([...selected,...teams.flatMap(id=>performers('g:'+id).map(member=>member.id))])]
      .filter(id=>person(id)&&!lock(person(id)));
    if(!p.people.length){error('请选择至少一位可出勤成员。');return;}
  }else{
    if(!p.target&&teams.length)p.lineup=teams.map(k=>'g:'+k);
    if(!p.target&&selected.length)p.people=selected;
  }
  if(type==='write'||type==='groupwrite'){p.title=String(data.get('title')||'').trim();p.genre=data.get('genre');}
  if(type==='album'){
    p.title=String(data.get('title')).trim();
    p.merch=Boolean(state.merchBusiness&&data.has('merch'));
    p.format='专辑';p.main=Number(data.get('main'));p.genre=state.songs.find(s=>s.id===p.main)?.genre||data.get('genre');
    const extra=data.getAll('track').map(Number).filter(k=>k!==p.main);
    if(!p.title||extra.length>13){error('请填写作品名。专辑可加 13 首收录曲。');return;}
    p.tracks=[...(p.main?[p.main]:[]),...extra];
    if(p.tracks.some(k=>!(state.songs.find(s=>s.id===k)?.group===p.target||performers(p.target).some(a=>a.id===state.songs.find(s=>s.id===k)?.writer)))){error('请选择该企划参与成员创作的歌曲。');return;}
  }
  if(slot<0)directPlan(p);else enqueue(p,slot);
}

function submitRoster(form){
  const g=team(Number(form.dataset.group)), data=new FormData(form);
  if(!g)return;
  const remove=[...new Set(data.getAll('remove').map(Number))];
  const add=[...new Set(data.getAll('add').map(Number))];
  const eligible=new Set(rosterCandidates().map(p=>p.id));
  if(remove.some(id=>!g.members.includes(id)||lock(person(id)))||add.some(id=>!eligible.has(id))){
    error('有成员已无法调整，请重新选择。');return;
  }
  const members=g.members.filter(id=>!remove.includes(id)).concat(add);
  if(members.length<2||members.length>13){error('调整后必须有 2～13 名成员。');return;}
  if(!remove.length&&!add.length){error('请至少选择一位要添加或移除的成员。');return;}
  const departed=remove.map(person);
  const before=g.fans;
  const kept=g.members.filter(id=>!remove.includes(id));
  g.fans=Math.max(0,before-groupDepartureLoss(g,departed,true));
  g.members=members;
  for(const p of departed){
    if(!p.solo){
      p.status='trainee';
      delete p.term;delete p.soloPromise;
      const key='p:'+p.id;
      state.inbox=state.inbox.filter(offer=>offer.target!==key);
    }
  }
  for(const id of add){const p=person(id);p.status='artist';p.hasDebuted=true;}
  const anchor=(kept[0]??members[0]);
  if(before>=25000&&remove.length)pushEvent('kick',anchor,{group:g.id,members:remove});
  if(before>=25000&&add.length)pushEvent('airdrop',anchor,{group:g.id,members:add});
  (state.fanNews??=[]).push(g.name+' · 已调整成员'+(add.length?' · 加入 '+add.map(id=>person(id).name).join('、'):'')+
    (departed.length?' · 离队 '+departed.map(p=>p.name).join('、'):'')+(before>g.fans?' · 组合粉丝 −'+money(before-g.fans):''));
  finish();groupPage(g);
}

function retireGroup(g){
  const members=[...g.members];
  const fans=g.fans;
  for(const k of members){
    const p=person(k);
    if(!p)continue;
    p.solo=false;p.status='trainee';p.cool=state.week+4;
    delete p.term;delete p.soloPromise;
    state.inbox=state.inbox.filter(i=>i.target!=='p:'+p.id);
    cancelPlans(['p:'+p.id]);
  }
  closeGroup(g);
  g.fans=0;
  // 团粉散了，个人盘也跟着缩水（默认分支：−15~30%）
  const rate=random(15,30)/100;
  for(const k of members){const p=person(k);if(p){p.fans=Math.max(0,Math.round(p.fans*(1-rate)));p.mood='解散后低落';}}
  if(fans>=25000)pushEvent('disband',members[0],{group:g.id,members,fansBefore:fans});
}

function contractMonth(){

    const term=a.term;
    if(!term)continue;
    if(state.week===term.ends-4)continue;
    else if(state.week>=term.ends){
      term.expired=true;
    }else if((term.ends-state.week)%48===0){
      const fee=Math.min(availableCash(),termFee(a));

function groupDepartureLoss(group,departed,peaceful){
  const sum=group.members.map(person).reduce((n,a)=>n+a.fans,0);
  const share=sum?departed.reduce((n,p)=>n+p.fans,0)/sum:departed.length/group.members.length;
  return Math.round(group.fans*share*(peaceful?.32:.73));
}
function removeMember(p,leave,peaceful){

    group.members=group.members.filter(i=>i!==p.id);
    if(group.members.length<2)closeGroup(group);

  }
  if(leave){
    state.people=state.people.filter(a=>a.id!==p.id);
    state.events=state.events.filter(e=>e.person!==p.id);
    state.roles=state.roles.filter(r=>r.target!==key||r.status==='broadcast');

function adjust(key,amount,groupShare=true){

  const before=a.fans;

  if(amount<0&&a.fans<before&&!a.members){
    a.health=limit(a.health-random(1,3));
    checkHealth(a);
  }
  if(a.members&&amount>0&&groupShare)for(const p of performers(key).filter(p=>!lock(p)))p.fans+=Math.round(amount*pick([0,.025,.05,.08,.12,.19,.27]));
}

function scaleFactor(fans){return 1+Math.log10(1+Math.max(0,fans)/BAL.scaleBase)*BAL.scaleLog;}
function coverage(key,range,odds=3,cap=Infinity){
  const entry=target(key);

  const quality=ps.reduce((n,p)=>n+(p.vocal+p.dance+p.health)/3,0)/(ps.length||1);
  // 成长感：名气和健康都会放大单次曝光的效率（0.85 ~ 1.30）
  const growth=.72+quality/260+(entry?.health??70)/500;
  let amount=Math.round(random(...range)*(.60+quality/240)*growth*scaleFactor(entry?.fans||0)*fameGainFactor());
  if(random(1,100)<=odds){amount=Math.round(amount*random(18,30)/10);log('一段现场片段被大量转发，新观众开始关注 '+entry.name+'。');}
  amount=Math.min(cap,amount);

function runConcert(plan,touched){

    const pay=i===keys.length-1?remaining:Math.floor(revenue*target(key).fans/Math.max(1,baseFans));

  if(plan.venue==='abroad')milestone('abroad','海外第一站','艺人练了一下午当地语言的问候，台下则用韩语喊出了台上艺人的名字。散场后，有人问能不能留一份应援录音。');

function genEvents(){
  for(const p of state.people){
    if(p.restLock&&p.restLock<=state.week){delete p.restLock;delete p.restLabel;if(p.health<60)p.health=limit(p.health+10);}
  }
  const limitN=random(1,100)<=55?1:2;
  let room=limitN-countEvents(['rumor','privacy','academic','truck']);
  if(room<=0)return;
  const people=state.people.filter(p=>p.status==='artist'&&!eventBusy(p));
  if(!people.length)return;
  const picked=[];
  for(let i=0;i<room;i++){
    const pool=dailyPool.filter(([type])=>{
      if(type==='inhouse')return people.length>=2;
      if(type==='rumor')return people.some(p=>p.fans>20000);
      if(type==='privacy')return people.some(p=>p.fans>15000);
      if(type==='academic')return people.some(p=>p.fans>10000);
      return people.some(p=>!p.sick);
    }).map(([type,w])=>{
      return [type,w];
    });
    const type=weightedPick(pool);
    if(!type)break;
    const eligible=people.filter(p=>!picked.includes(p.id)&&!state.events.some(e=>e.person===p.id&&['rumor','privacy','academic','truck'].includes(e.type)));
    const cands=eligible.map(p=>{
      let w=1+(p.fans/6000);
      if(type==='rumor'&&p.fans>20000)w+=3;
      if(type==='privacy'){
        w+=3;
        if(p.health<50)w+=2;
        if(p.privacy)w*=1.5;
      }
      if(type==='academic'&&p.fans>10000)w+=2;
      if(type==='truck')w+=p.sick||p.mood==='待遇不满'?2:0;
      return [p,w];
    });
    const p=weightedPick(cands);
    if(!p)break;
    picked.push(p.id);
    if(type==='privacy'){
      // 有安保部时，私生事件只有 35% 的机会真正发生（绝对概率，非权重打折）
      if(state.securityBusiness&&random(1,100)>35)continue;
      p.privacy=(p.privacy||0)+1;
      pushEvent('privacy',p.id,{stage:p.privacy});
    }else if(type==='truck'){
      pushEvent('truck',p.id);
    }else{
      pushEvent(type,p.id,type==='inhouse'?{title:p.name+'与'+pick(people.filter(q=>q!==p)).name+' · 社内恋爱传言'}:{});
    }
  }
}
const disputes=new Set(['rumor','privacy','academic','truck','clip','eyerolled','attitude','senior']);
function resolveDisputes(presented){
  const results=[];
  for(const e of [...state.events]){
    if(!presented.has(e.id)||!disputes.has(e.type))continue;
    const p=person(e.person);
    state.events=state.events.filter(row=>row.id!==e.id);
    if(!p||eventBusy(p))continue;
    const before=snapshot(), delta=random(-95,60);
    adjust('p:'+p.id,delta);
    const change=deltas(before);
    results.push(p.name+' · '+(eventNames[e.type]||'事件')+'（未回应） · '+(delta<0?'讨论仍有余波。':'讨论自然平息。')+(change?' · '+change:''));
  }
  for(const e of state.promoEvents||[]){
    if(!presented.has(e.id))continue;
    const w=work(e.work), a=target(w?.owner);
    if(!a||!offerVisible({target:w.owner,expiry:state.week+1}))continue;
    const before=snapshot();adjust(w.owner,random(-140,65));
    results.push('《'+w.title+'》音源注水争议（未回应） · '+(deltas(before)||'讨论自然平息。'));
  }
  state.promoEvents=(state.promoEvents||[]).filter(e=>!presented.has(e.id));
  return results;
}
// 行动后余波：路演 / 打歌 / 训练 / 医美 / 签售
function actionAftermath(type,plan,touched){
  const key=plan.target, a=target(key);
  if(!a)return;
  const units=performers(key).filter(p=>p&&!eventBusy(p));
  if(!units.length)return;
  const who=()=>pick(units);
  const add=(kind,p,extra)=>{
    if(kind==='fancam'||kind==='clip'){
      const gain=random(100,380);
      if(monthStory(p.name+'的直拍被转进了歌迷群。有人问起歌名，拍视频的粉丝顺手贴上了舞台链接。粉丝 +'+gain+'。','fancam'))p.fans+=gain;
      return;
    }
    return pushEvent(kind,p.id,extra);
  };
  if(type==='road'||type==='warm'){
    if(random(1,100)<=35){const k=weightedPick(roadPool);if(k)add(k,who());}
  }else if(type==='show'){
    const rank=plan._rank||0;
    if(rank===1&&random(1,100)<=70)add('onewin',who());
    else if((rank===2||rank===3)&&random(1,100)<=55)add('onebit',who());
    else if(random(1,100)<=40){const k=weightedPick(showPool);if(k)add(k,who());}
  }else if(type==='vocal'||type==='dance'){
    const who2=units[0];
    if(!who2)return;
    if(type==='vocal'&&who2.singCool>state.week)return;
    const stressed=who2.health<45||(who2[type+'Streak']||0)>=3;
    if(stressed&&random(1,100)<=28){const k=weightedPick(afterPool[type]);if(k)add(k,who2);}
  }else if(type==='beauty'){
    const who2=units[0];
    if(!who2||who2.faceCool>state.week)return;
    who2.beautyTimes=(who2.beautyTimes||0)+1;
    if(random(1,100)<=30)add('oldphoto',who2);
    if(who2.beautyTimes>=2&&random(1,100)<=35)add('overdone',who2);
  }else if(type==='sale'){
    for(const p of units){
      if(random(1,100)>38)continue;
      const pool=salePools[pick(plan.signings||['offline'])]||salePools.offline;
      const k=weightedPick(pool);
      if(k&&!state.events.some(e=>e.person===p.id&&['skip','proposal','cutscreen','notrans'].includes(e.type)))add(k,p);
    }
  }
}
function soloEvents(requested=null){
  for(const g of state.groups.filter(g=>!g.closed)){
    if(!availableWorks('g:'+g.id).length)continue;
    const members=g.members.map(person).filter(Boolean).sort((a,b)=>b.fans-a.fans);
    if(members.length<2||members.some(p=>p.fans<=2000))continue;
    const aside=members.slice(1).reduce((n,p)=>n+p.fans,0)/Math.max(1,members.length-1);
    const top=members[0];
    const gap=aside?top.fans/aside:0;
    if(gap<3||(requested&&top!==requested))continue;
    if(eventBusy(top)||top.soloPromise||state.events.some(e=>e.person===top.id&&e.type==='friction'))continue;
    if(g.frictionCool&&g.frictionCool>state.week)continue;
    const chance=1.2+Math.min(2.4,Math.floor((gap-3)/2)*.6);
    if(!requested&&random(1,1000)>chance*10)continue;
    if(!pushEvent('friction',top.id,{title:top.name+'想和你聊聊以后'}))continue;
    (state.fanNews??=[]).push(top.name+'想和你谈谈以后的活动，可以在待处理里继续这次谈话。');
    g.frictionCool=state.week+24;
  }
}
function retentionChance(p){return !p.soloRetentionUsed?100:p.mood==='沟通良好'?60:40;}
function eventChoice(ref,choice){
  const e=state.events.find(x=>x.id===ref);
  if(!e)return;
  const p=person(e.person), key=p?'p:'+p.id:null;
  const clear=()=>{state.events=state.events.filter(x=>x.id!==ref);};
  const needRest=()=>{if(!p)return true;if(eventBusy(p)){error('该艺人目前无法安排。');return true;}return false;};
  const result=(title,text,extra='')=>{clear();finish();open(title,'<p>'+escape(text)+'</p>'+extra);};
  // —— 小组类：解散 / 退团 / 空降 ——
  if(e.type==='disband'||e.type==='kick'||e.type==='airdrop'){
    const g=team(e.group);
    const merged=new Set([...(e.merged||[]),...(e.members||[])]);
    clear();
    if(g){
      const losers=merged.size?[...merged].map(person).filter(Boolean):g.members.map(person).filter(Boolean);
      if(e.type==='disband'){
        const rate=choice==='explain'?random(10,20)/100:choice==='farewell'?random(0,8)/100:random(15,30)/100;
        for(const q of losers){q.fans=Math.max(0,Math.round(q.fans*(1-rate)));q.mood='平稳';}
        if(choice==='farewell'){
          const slot=state.queue.findIndex(x=>!x);
          if(slot>=0)state.queue[slot]={type:'concert',venue:'family',lineup:[],hosts:[],songs:[],farewell:true};
          else log('告别演唱会没有空档，这次只能作罢。');
        }
        if(choice==='ignore')scheduleTruckBacklash(g,'解散');
        (state.fanNews??=[]).push(g.name+'宣布解散 · 成员个人粉丝 −'+Math.round(rate*100)+'%');
        result('解散结果',g.name+'已宣布解散，成员的个人粉丝下降了 '+Math.round(rate*100)+'%。'+(choice==='farewell'?'告别演唱会已经排进本周的档期。':''));
      }else if(e.type==='kick'){
        const rate=choice==='negotiate'?.08:choice==='reveal'?.04:.15;
        g.fans=Math.max(0,Math.round(g.fans*(1-rate)));
        if(choice==='reveal')for(const q of losers)q.fans=Math.max(0,Math.round(q.fans*.8));
        if(choice==='ignore'||(choice==='negotiate'&&random(1,100)>40))scheduleTruckBacklash(g,'退团');
        (state.fanNews??=[]).push(g.name+'成员调整引发讨论 · 组合粉丝 −'+Math.round(rate*100)+'%');
        result('成员变动',choice==='reveal'?'公开原因之后，讨论平息得比预想快，只是被移出的那位掉粉最多。':'公司完成了说明。组合粉丝下降了 '+Math.round(rate*100)+'%。');
      }else{
        if(choice==='video'&&random(1,100)<=60){g.fans=Math.round(g.fans*1.03);result('空降争议','练习室视频放出去后，评论区的语气变了。组合粉丝小幅上升。');}
        else if(choice==='senior'){for(const q of g.members.map(person).filter(Boolean))q.fans+=random(80,220);result('空降争议','前辈带着上了节目，新人露了脸。全员粉丝上涨。');}
        else{
          if(random(1,100)<=20)g.fans=Math.max(0,Math.round(g.fans*.94));
          scheduleTruckBacklash(g,'空降');
          result('空降争议','公司没有回应。评论区第一条还挂着「这谁」。');
        }
      }
    }
    finish();return;
  }
  if(e.type==='privacy'){
    const stage=e.stage||p.privacy||1;
    if(stage>=3&&choice!=='leave'){
      if(needRest())return;
      p.restLock=state.week+8;p.restLabel='长期休假';p.privacy=0;p.health=limit(p.health+30);p.mood='稳住';
      (state.fanNews??=[]).push(p.name+'开始长期休假 · 8 周后归队');
      result('批了长假',p.name+'把手机关了，说要出去走走。合约保留，8 周后回来。');return;
    }
    if(stage>=3){
      (state.fanNews??=[]).push(p.name+'与公司解约 · 原因：私生事件长期困扰');
      removeMember(p,true,false);
      result('解约','公司在解约书上签了字，原因写得很清楚。');return;
    }
    if(choice==='protect'){
      const fee=state.securityBusiness?0:600;
      if(state.cash<fee){error('现金不足。');return;}
      if(fee){state.cash-=fee;log('加强安保 · 资金 −600');}
      adjust(key,random(20,105));p.mood='受到支持';
      result('安保升级',(fee?'花了 600 元加强安保，':'安保部直接接手了，')+'宿舍楼下那辆车第二天就不见了。');return;
    }
    if(choice==='rest'){
      p.health=limit(p.health+8);adjust(key,-random(20,40));
      result('减少外出',p.name+'接下来的行程都改成了线上。健康恢复了一些，但曝光少了。');return;
    }
    p.health=limit(p.health-random(4,9));checkHealth(p);
    clear();finish();return;
  }
  if(e.type==='critical'){
    clear();
    if(choice==='leave'){removeMember(p,true,false);}
    else{p.savedOnce=true;p.leaving=false;p.sick=true;p.forcedRest=true;p.mood='停工休养';}
    finish();return;
  }
  if(e.type==='friction'){
    const group=groupOf(p);
    if(!group){clear();finish();return;}
    if(eventBusy(p)){error('这位艺人目前无法出勤。');return;}
    const fans=group.fans;
    let text;
    if(choice==='keep'){
      const kept=random(1,100)<=retentionChance(p);
      p.soloRetentionUsed=true;
      if(kept){p.mood='平稳';text=p.name+'接受挽留，继续留在团里。';}
      else{p.mood='想再谈谈';finish();open('想再谈谈','<p>'+escape(p.name)+'说：“我还是想试试自己的舞台，我们过阵子再聊吧。”成员继续随团活动。</p>');return;}
    }else if(choice==='solo'){
      p.solo=true;if(!p.term)startTerm(p,1);p.soloPromise=true;p.mood='平稳';
      text=p.name+'留在团里，个人作品可以稍后安排。';
    }else if(choice==='separate'){
      removeMember(p,false,true);
      if(random(1,100)<=25)group.fans=fans;
      p.solo=true;if(!p.term)startTerm(p,1);p.mood='平稳';
      text=p.name+'解除团约，成为公司旗下 Solo 艺人。';
    }else{
      removeMember(p,true,true);text=p.name+'已解约离开公司。';
    }
    if(group.fans<fans)text+=' 组合粉丝 −'+money(fans-group.fans)+'。';
    clear();(state.fanNews??=[]).push(text);finish();
    open('单飞协商结果','<p>'+escape(text)+'</p>'+(choice==='solo'?button('去制作个人作品','forplan','album:'+key,'primary')+' '+button('稍后安排','close'):''));
    return;
  }
  if(e.type==='inhouse'||e.type==='styling'){
    const replies={reply:'公司回复：“谢谢关心，请把更多关注留给他们的作品。”',deny:'公司澄清了传言，两人继续各自的工作。',photo:'工作人员发出了当天的后台合照，成员们还在评论里认领自己的造型。',quiet:'公司暂时没有回应。'};
    result(eventTitle(e),replies[choice]||replies.quiet);return;
  }
  if(e.type==='truck'){
    if(choice==='respond'){p.mood='沟通良好';p.health=limit(p.health+4);clear();finish();return;}
    adjust(key,-random(75,320));clear();finish();return;
  }
  if(e.type==='clip'){
    if(choice==='boost'&&state.cash<800){error('现金不足。');return;}
    const fans=choice==='boost'?(state.cash-=800,random(200,950)):choice==='share'?random(80,250):random(100,450);
    adjust(key,fans);
    (state.fanNews??=[]).push(p.name+'的粉丝剪辑 · 粉丝 +'+money(fans)+(choice==='boost'?' · 资金 −800':''));
    result('粉丝剪辑',(choice==='boost'?'追加推广已投出去，视频播放量又翻了一轮。':choice==='share'?'转发之后评论区很热闹。':'剪辑继续自己传播。')+'粉丝 +'+money(fans)+'。');
    return;
  }
  if(e.type==='rumor'){
    if(choice==='press'&&!needRest()){directPlan({type:'press',target:key,eventRef:ref});return;}
    if(choice==='respect'){
      const gain=random(1,100)<=50?random(40,120):-random(60,180);adjust(key,gain);
      result('绯闻回应',gain>0?'回应被接受，评论区在夸「有边界感」。粉丝 +'+money(gain)+'。':'回应反而被追着问更多，粉丝 '+money(Math.abs(gain))+'。');return;
    }
    const loss=random(30,80);adjust(key,-loss);
    if(random(1,100)<=5){adjust(key,-random(60,160));result('绯闻发酵','没回应，讨论过了两周又上了一次热搜。粉丝 −'+money(loss)+'，随后再 −'+money(random(0,0))+'。');return;}
    result('绯闻冷处理','没有回应，讨论慢慢淡了下去。粉丝 −'+money(loss)+'。');return;
  }
  if(e.type==='academic'){
    if(choice==='admit'){
      const gain=random(1,100)<=60?random(80,220):random(20,60);adjust(key,gain);
      result('学业争议','「我确实不是念书的料」这条被转了很多次。粉丝 +'+money(gain)+'。');return;
    }
    if(choice==='prove'){
      const gain=p.fans>30000?random(20,50):random(40,120);adjust(key,gain);
      result('学业争议','练舞室监控和练习时长被摆了出来。粉丝 +'+money(gain)+'。');return;
    }
    const loss=random(10,75);adjust(key,-loss);
    result('学业争议','公司没有回应。帖子热度自己降了下去。粉丝 −'+money(loss)+'。');return;
  }
  if(['eyerolled','attitude','senior'].includes(e.type)){
    if(choice==='press'&&!needRest()){directPlan({type:'press',target:key,eventRef:ref});return;}
    const odds=e.type==='eyerolled'?45:e.type==='senior'?40:50;
    const hit=random(1,100)<=odds;
    const gain=hit?random(40,200):-random(e.type==='senior'?80:50,e.type==='senior'?250:200);
    adjust(key,gain);
    const tail=e.type==='eyerolled'?'有人觉得艺人很有态度，也接受了说明。':e.type==='senior'?'部分观众仍认为这表现不尊重前辈。':'讨论还在继续，一部分粉丝选择离开。';
    result('公关反馈',(gain>0?'不少观众接受了这次回应。':tail)+' 粉丝 '+(gain>0?'+':'−')+money(Math.abs(gain))+'。');return;
  }
  if(e.type==='onebit'){
    if(choice==='again'){if(needRest())return;directPlan({type:'show',station:1,target:key,eventRef:ref});return;}
    const gain=random(100,300);adjust(key,gain);
    result('打歌收尾','这次就到这里。粉丝 +'+money(gain)+'。');return;
  }
  if(e.type==='onewin'){
    const gain=choice==='speech'?random(300,800):random(150,400);
    adjust(key,gain);if(choice==='speech')p.mood='平稳';
    result('一位获奖',(choice==='speech'?'感言被剪成短视频，在首页挂了一整天。':'简短致谢，干净利落。')+'粉丝 +'+money(gain)+'。');return;
  }
  if(e.type==='glitch'){
    if(choice==='stop'){state.cash-=2000;p.mood='平稳';result('中止演出','演出停了，退款也办了。资金 −2,000，但没有传出什么难听的话。');return;}
    if(random(1,100)<=50){const gain=random(400,900);adjust(key,gain);result('清唱救场','话筒没声，他直接清唱。这段后来被反复转发。粉丝 +'+money(gain)+'。');}
    else{const loss=random(50,200);adjust(key,-loss);result('清唱救场','有人截了那一段，问「是不是没开麦」。粉丝 −'+money(loss)+'。');}
    return;
  }
  if(e.type==='fancam'){
    if(choice==='apply'&&!needRest()){state.inbox.push({id:id(),target:key,type:'variety',expiry:state.week+12});result('路人片段','公司顺势报名了当地节目。新的综艺邀约已放进邀约列表。');return;}
    const gain=choice==='share'?random(200,600):random(50,150);
    adjust(key,gain);
    result('路人片段',(choice==='share'?'官方转发了那条视频。':'没有大动作，但视频自己还在传。')+'粉丝 +'+money(gain)+'。');return;
  }
  if(e.type==='skip'){
    if(choice==='contact'&&random(1,100)<=50){const gain=random(250,500);adjust(key,gain);result('被跳签','工作人员找到了那位粉丝，对方说那天只是有急事。这件事后来被写成了「双向体谅」。粉丝 +'+money(gain)+'。');return;}
    if(choice==='contact'){const loss=random(20,80);adjust(key,-loss);result('被跳签','联系被当成作秀，「公司还要人出来解释」。粉丝 −'+money(loss)+'。');return;}
    const gain=choice==='explain'?random(150,400):random(50,180);
    adjust(key,gain);
    result('被跳签',(choice==='explain'?'「可能是我的问题」这句话让很多人心疼。':'视频自己发酵开了，评论区全是「手停在半空」。')+'粉丝 +'+money(gain)+'。');return;
  }
  if(e.type==='proposal'){
    let gain=choice==='polite'?random(80,200):random(150,350);
    let tail=choice==='polite'?'温柔地拒绝了，现场氛围反而很好。':'一句玩笑带过去，全场都笑了。';
    if(choice==='humor'&&random(1,100)<=30){const bonus=random(200,500);gain+=bonus;tail+='那段还被剪成了梗，又多涨了 '+money(bonus)+'。';}
    adjust(key,gain);
    result('当场求婚',tail+'粉丝 +'+money(gain)+'。');return;
  }
  if(e.type==='cutscreen'){

    if(choice==='proof'){
      if(random(1,100)<=70){const gain=random(200,600);adjust(key,gain);result('切小屏争议','完整录屏放出来，风向立刻转了。粉丝 +'+money(gain)+'。');}
      else{const loss=random(80,200);adjust(key,-loss);result('切小屏争议','录屏里又被人挑出别的细节。粉丝 −'+money(loss)+'。');}
      return;
    }

function pendingAmount(a){return (a.pendingSplits||[]).reduce((sum,bill)=>sum+bill.amount,0);}

function annualBills(y){

    const released=state.works.some(w=>w.owner===key&&w.status==='released'&&!w.old&&w.format==='专辑'&&year(w.released)===y);
    const amount=Math.min(60000,Math.round((a.earnings||0)*.08));

function doSplit(pay,key){
  const rows=splitRows().filter(([entry])=>!key||entry===key);
  const total=rows.reduce((n,[,a])=>n+pendingAmount(a),0);
  if(pay&&total>state.cash){
    for(const [entry,a] of rows)for(const bill of a.pendingSplits)bill.deferred=true;
    log('现金不足，年度分账已延期，可到艺人页补结。');
    render();return false;
  }
  if(pay)state.cash-=total;
  const people=new Set();
  for(const [entry,a] of rows){
    if(pay||a.pendingSplits.some(bill=>!bill.deferred))for(const p of performers(entry))people.add(p);
    if(pay)a.pendingSplits=[];

  }
  for(const p of people){p.mood=pay?'分账满意':'对分账延期不满';p.health=limit(p.health+(pay?3:-4));checkHealth(p);}
  if(rows.length)log(pay?'已完成年度分账，支付 '+money(total)+'。':'年度分账延期，可到艺人页补结。');
  return true;
}

function deltas(before){
  const items=[];

  if(state.cash!==before.cash)items.push(change('资金',state.cash-before.cash));
  for(const g of state.groups){if(before.groups.has(g.id)&&before.groups.get(g.id)!==g.fans)items.push(g.name+' '+change('组合粉丝',g.fans-before.groups.get(g.id)));}
  for(const p of state.people){
    const old=before.people.get(p.id);
    if(!old)continue;
    const values=[['粉丝','fans'],['健康','health'],['歌唱','vocal'],['舞蹈','dance'],['颜值','beauty']].map(([label,key])=>change(label,p[key]-old[key])).filter(Boolean);

function runSigning(plan,w,artist,touched,mode,startingFans=artist.fans){
  const video=mode==='video', label=video?'视频签售':'线下签售';
  const previous=w.signings??(w.signed?1:0);
  w.videoSignings??=0;
  w.offlineSignings??=Math.max(0,previous-w.videoSignings);
  w.signings=previous+1;
  const field=video?'videoSignings':'offlineSignings';
  w[field]++;

  const attendees=planPeople(plan).map(person);
  for(const p of attendees){
    touched.add(p.id);

    const fatigue=w[field]>=(video?6:4)?1.5:1;
    p.health=limit(p.health-Math.ceil(base*(video?.5:1)*fatigue));
  }
  const entrants=Math.min(10000,startingFans)*.04+Math.max(0,startingFans-10000)*.015;
  const overlap=(video&&plan.signings?.includes('offline')) ? 0.7 : 1;
  // 场次的 30 个见面名额独立于应募销量，一名粉丝可购买多张。
  const sold=Math.round(entrants*(video?random(125,180):random(160,230))/100*demand*overlap);
  w.sales=(w.sales||0)+sold;
  const pay=albumRevenue(w,sold);
  income(pay,w.owner);
  log('《'+w.title+'》'+label+' · 应募售出 '+money(sold)+' 张'+' · 收入 +'+money(pay));
  if(w.signings>10&&random(1,100)<=4){adjust(plan.target,-random(20,90));log('签售过密引发疲劳，部分粉丝取消关注。');}
  else if(attendees.some(p=>p.health<32)&&random(1,100)<=22){adjust(plan.target,-random(20,70));log('签售疲态引发议论。');}
  else coverage(plan.target,video?[50,150]:[80,200],0);
}
function albumRevenue(w,sold){

// 首周销量 = 核心粉丝盘（每个人买 0.55~1.05 张）+ 路人盘（随知名度次线性增长）

  const walkon=Math.pow(fans,.68)*random(BAL.walkonMin*100,BAL.walkonMax*100)/100*(w.genre===state.newsGenre?1.25:1);
  return Math.max(20,core+walkon);
}
function launchSalesFactor(w){

// 出道概率：无门槛，连续曲线（平均值分段 + 短板惩罚 + 特长加成），封顶 95%、保底 5%
function debutPart(p){
  const stats=[p.vocal,p.dance,p.beauty];
  const average=stats.reduce((sum,value)=>sum+value,0)/3;
  const low=Math.min(...stats), high=Math.max(...stats);
  const base=average>=90?88:average>=80?72:average>=70?55:average>=60?40:average>=50?25:15;
  const shortfall=low>=60?0:low>=50?8:low>=40?18:30;
  const talent=high>=90?8:high>=85?3:0;
  return {base,shortfall,talent,average,low,high};
}
function debutOdds(p){
  const d=debutPart(p);
  return Math.max(5,Math.min(95,d.base-d.shortfall+d.talent));
}
function seasonCheck(){
  const m=month(state.week), y=year(state.week);
  for(const p of [...state.people]){
    if(p.showLock?.until<=state.week){
      const center=p.showLock.center;
      const payout=center?random(120000,160000):random(80000,120000);
      const fans=center?random(25000,40000):random(12000,25000);
      delete p.showLock;
      p.fans+=fans;
      income(payout,'p:'+p.id);
      const result=p.name+'活动期结束，回到公司。限定团收益 +'+money(payout)+' · 个人粉丝 +'+money(fans)+'。';
      notice('限定团成员归队',result);
      (state.fanNews??=[]).push(result);
    }
    if(p.restLock&&p.restLock<=state.week){delete p.restLock;delete p.restLabel;}
  }
  if(m===8){state.season={year:y,gender:y%2?'女':'男',status:'open',people:[]};notice('群星闪耀时 · '+state.season.gender+'生季','最多选派 3 名符合条件的练习生。暂不选择可在待处理事件中继续报名，9 月底截止。','seasonpick','annual');}
  if(m===10&&['open','signed'].includes(state.season?.status))state.season.status='closed';
  if(m!==2||state.season?.status!=='running')return;
  const candidates=state.season.people.map(person).filter(Boolean);
  const score=p=>p.vocal+p.dance+p.beauty;
  // C 位：三项 ≥88 且健康 ≥65 里总分最高，真的能达成
  const center=candidates.filter(p=>p.health>=65&&Math.min(p.vocal,p.dance,p.beauty)>=88).sort((a,b)=>score(b)-score(a)||a.id-b.id)[0];
  const results=[],ranks=[2,3,4,5,6,7,8,9];
  for(const p of candidates){
    const success=random(1,100)<=debutOdds(p);
    if(success){p.showLock={until:state.week+48,center:p===center};results.push(p.name+(p===center?' C 位出道':'第 '+ranks.splice(random(0,ranks.length-1),1)[0]+' 名出道成功'));}
    else{delete p.showLock;results.push(p.name+'没能出道，回到公司');}
  }
  state.season.status='closed';
  const debuted=candidates.filter(p=>p.showLock?.until).map(p=>p.name);
  // 九人限定团是节目的事，与公司无关；只有自己人出道时才提公司
  const mine=debuted.length, summary=results.join('。')+'。';

  (state.fanNews??=[]).push(summary);
  (state.nextNews??=[]).push('群星闪耀时 · '+summary);
  if(mine)addFame(mine,'选秀成功出道');
}

function promote(w,tier){
  const entry=target(w.owner), cost=promoFees[tier];
  if(w.promoted||state.cash<cost){error('已宣传或现金不足。');return;}
  changeCash(-cost);w.promoted=true;
  const recommended=entry.fans<8000?0:entry.fans<15000?1:2;
  if(tier>recommended&&random(1,100)<=25){
    (state.promoEvents??=[]).push({id:id(),work:w.id});
    finish();actions.promoreply(String(state.promoEvents.at(-1).id));
  }else{
    const gain=random(...[[300,600],[1100,2000],[3000,5000]][tier]);
    adjust(w.owner,gain);finish();
    open('宣传结果','<p>宣传吸引了新观众。</p><p>资金 −'+money(cost)+' · 粉丝 +'+money(gain)+'</p>');
  }
}
let newsTimer;
function rotateNews(){
  clearInterval(newsTimer);
  const ticker=app.querySelector('.news');
  if(!ticker||ticker.children.length<2||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  newsTimer=setInterval(()=>{
    if(ticker.matches(':hover')||ticker.contains(document.activeElement))return;
    const cards=Array.from(ticker.children), current=cards.reduce((best,card,i)=>Math.abs(card.offsetLeft-cards[0].offsetLeft-ticker.scrollLeft)<Math.abs(cards[best].offsetLeft-cards[0].offsetLeft-ticker.scrollLeft)?i:best,0);
    ticker.scrollTo({left:cards[(current+1)%cards.length].offsetLeft-cards[0].offsetLeft,behavior:'smooth'});
  },5000);
}
function annualNews(){
  const m=month(state.week), lines=[];
  if(m===8||m===9){
    const names=state.season?.people?.map(id=>person(id)?.name).filter(Boolean)||[];
    const headline='群星闪耀时 · '+(state.season?.gender||(year(state.week)%2?'女':'男'))+'生季开始啦！';
    lines.push(headline+(names.length?state.company+'派出了'+names.join('、')+'。':'全民制作人请多多关心吧！'));
  }
  if(m===11){
    const names=state.annual?.status==='booked'?festivalLineup({}).map(festivalName):[];
    lines.push('世界中心年末拼盘 · '+(names.length?state.company+'的'+names.join('、')+'要登上年末舞台了，记得来给他们捧场！':'年末拼盘快开演了，你最期待谁的舞台？'));
  }
  if(m===12){
    const plan=state.queue.find(p=>p?.venue==='family');
    const names=plan?.lineup.map(key=>target(key)?.name).filter(Boolean)||[];
    lines.push('家族演唱会 · '+(names.length?'平时各跑各的行程，这次终于能一起站上舞台。'+state.company+'家族演唱会见！出演：'+names.join('、')+'。':'年末演出季来了，各家艺人正忙着合体彩排。'));
  }
  return lines;
}

// 慈善捐款：灾情新闻挂 12 周，期间公司页可捐；金额越高，知名度加得越多
const donationTiers=[[.05,2,'杯水车薪'],[.1,3,'尽力而为'],[.2,5,'倾力相助']];
function donationActive(){
  const d=state.donationNews;
  return !state.debt&&d&&!d.done&&d.until>state.week?d:null;
}
function donationLines(){
  // 旧债未还清前，捐款相关的一切（灾情、募捐、过期通知）都不出现在新闻里
  if(state.debt||!state.donationNews)return [];
  const d=state.donationNews;
  if(d.done&&d.thanksWeek!==state.week)return [];
  if(d.done)return ['社会 · 公司已就'+d.event+'捐款，'+d.event+'的安置工作仍在继续。'];
  if(d.until<=state.week)return ['社会 · '+d.event+'的募捐通道已关闭，公司未参与此次捐助。'];

  return ['社会 · '+d.event+'。受灾地区正在招募援助，多家企业已响应。（公司可在「公司」页捐款，剩余 '+(d.until-state.week)+' 周）'];
}
function donationAmounts(){
  return donationTiers.map(([rate,fame,label])=>({rate,fame,label,amount:Math.max(20000,Math.round(availableCash()*rate/1000)*1000)}));
}
function donationPanel(){
  const d=donationActive();
  if(!d)return '';
  const rows=donationAmounts();
  return '<div class="card donation"><div class="row spread"><strong>社会责任 · 救灾捐款</strong><span class="tag">剩余 '+(d.until-state.week)+' 周</span></div>'+
    '<small>'+escape(d.event)+'。捐款可提升公司知名度，金额越高提升越多。</small><div class="row">'+
    rows.map((r,i)=>button(money(r.amount)+' · 知名度 +'+r.fame,'donate',i,'',state.cash<r.amount)).join('')+'</div></div>';
}
function donate(index){
  const d=donationActive(), tier=donationAmounts()[Number(index)];
  if(!d||!tier)return;
  if(state.cash<tier.amount){error('可用现金不足。');return;}
  changeCash(-tier.amount);
  d.done=true;d.thanksWeek=state.week+4;
  addFame(tier.fame,'救灾捐款');
  const fans=Math.round(state.people.filter(p=>!lock(p)).reduce((n,p)=>n+p.fans,0)*.003);
  for(const p of state.people.filter(p=>!lock(p)))p.fans+=Math.max(1,Math.round(fans/Math.max(1,state.people.length)));
  (state.fanNews??=[]).push('公司就'+d.event+'捐款 '+money(tier.amount)+' · 知名度 +'+tier.fame);
  open('捐款已完成','<p>公司向'+escape(d.event)+'捐款 '+money(tier.amount)+'。新闻里写了一句「'+state.company+'已加入援助」。</p><p>公司知名度 +'+tier.fame+'。</p>');
}

  const reports=state.nextNews||[];state.nextNews=[];
  // 社会新闻（捐款灾情）优先保留在顶部，不受季度换版影响
  const social=[];
  if(![1,4,7,10].includes(month(state.week))){state.news=[...social,...reports,...(state.news||[]).filter(n=>n.startsWith('行业')).slice(0,2),...donationLines()];return;}

function finance(kind){
  if(kind==='borrow'&&state.debt){error('请先还清开局旧债。');return;}
  const labels={debt:'偿还旧债',borrow:'借款',loan:'偿还借款',arrears:'补发欠薪'};
  const max=kind==='borrow'?Math.max(0,60000-state.loan):Math.min(availableCash(),state[kind]);
  open(labels[kind],'<p>当前余额 '+money(state.cash)+' · 下次工资 '+money(wages())+'</p><small>'+
    (kind==='debt'?'旧债可分次还清。还清后解锁自办演唱会。':kind==='borrow'?'可用借款额度 '+money(max)+'，可手动偿还。':'按可用现金偿付。')+
    '</small>'+(max?'<form id="finance" data-kind="'+kind+'"><label>金额<input name="amount" type="number" min="1" max="'+max+'" value="'+max+'" required></label><p>操作后余额 <output id="balance">'+money(state.cash+(kind==='borrow'?max:-max))+'</output></p><button class="primary">确认'+labels[kind]+'</button></form>':'<p>暂无可操作金额。</p>'));
}
function submitFinance(form){
  const amount=Number(new FormData(form).get('amount')), kind=form.dataset.kind;
  const max=kind==='borrow'?60000-state.loan:Math.min(availableCash(),state[kind]);
  if(!Number.isInteger(amount)||amount<1||amount>max){error('请选择有效的金额。');return;}
  if(kind==='borrow'&&state.debt){error('请先还清开局旧债。');return;}
  if(kind==='borrow'){state.cash+=amount;state.loan+=amount;}
  else{state.cash-=amount;state[kind]-=amount;}
  if(kind==='debt'&&!state.debt){state.donationNews=null;state.donationLast=0;state.news=(state.news||[]).filter(n=>!n.startsWith('社会'));milestone('paid','旧债已还清','叔叔发来一张照片。他穿着沾满水泥灰的工服，晒黑了不少，身后垒着半人高的砖。短信只有一句：「'+state.player+'，我就知道你能做到。你上次说想办专场，对吧？哪天开票记得告诉我。」\n\n自办演唱会已解锁。');}
  finish();
}

  open(batch?'本批招募结果':'候选人',(body||'<p>暂无待处理候选人。</p>')+button('稍后处理','close'));

function signCandidate(p,source,name=p?.name){
  if(!p||!name||state.people.length>=60)return;
  if(source==='transfer'){
    if(state.debt||state.loan||state.transfer!==p)return;
    delete state.transfer;
  }else{
    if(!visibleCandidates().includes(p))return;
    state.candidates=state.candidates.filter(c=>c!==p);
  }
  p.firstName=true;
  if(p.status==='artist'){p.solo=true;p.hasDebuted=true;startTerm(p,1);}
  updateName(p,name,namingTerms(p,true));
  state.people.push(p);
  if(source==='transfer'&&random(1,3)!==1){
    const good=random(1,2)===1;
    (state.transferFollowups??=[]).push({id:p.id,gain:good?random(200,800):-random(120,540)});
  }
  finish();if(source!=='transfer')showCandidates(source);
}
function savedGame(value){
  if(!value||![1,2,3,4,5].includes(value.version)||!Number.isInteger(value.week)||value.week<0||!Number.isSafeInteger(value.serial))return false;
  if(!['company','player','groupName','kind'].every(k=>typeof value[k]==='string'))return false;
  if(!Number.isFinite(value.cash)||!['debt','loan','arrears'].every(k=>Number.isFinite(value[k])&&value[k]>=0))return false;
  if(!['people','groups','works','songs','queue','inbox','events','messages','logs','last','candidates','rivals','roles'].every(k=>Array.isArray(value[k])))return false;
  return value.people.length<=60&&value.queue.length<=4&&value.rivals.length===3&&value.flags&&typeof value.flags==='object';
}

  advance,
  idle:arg=>enqueue({type:'idle'},Number(arg)),
  trainfilter:arg=>{const [type,slot,group]=arg.split(':');dutyForm(type,Number(slot),'',0,group);},
  selectall:arg=>{const form=sheet.querySelector('#plan');for(const box of form.querySelectorAll('input[name=member],input[name=team]'))box.checked=arg!=='none';},
  category:arg=>{const [types,slot]=arg.split(':');open('选择活动','<div class="stack">'+types.split(',').map(type=>button(activities[type].name,'planform',type+':'+slot)).join('')+'</div>');},
  group:arg=>groupPage(team(Number(arg))),
  person:arg=>personPage(person(Number(arg))),
  debut:debutForm,
  companyrecruit:()=>open('公司招募','<p>每月一次，每批 2～5 人，费用 '+money(activities.recruit.cost)+'。</p><form id="companyrecruit"><label>招募对象<select name="gender">'+options([sexOptions[2],...sexOptions.slice(0,2)])+'</select></label><button class="primary">确认招募</button></form>'),
  candidates:source=>showCandidates(source||'list'),
  hire:arg=>{
    const [id,source]=arg.split(':');signCandidate(visibleCandidates().find(p=>p.id===Number(id)),source);
  },
  hirename:arg=>{
    const [id,source]=arg.split(':');changeName(visibleCandidates().find(p=>p.id===Number(id)),source);
  },
  pass:arg=>{
    const [id,source]=arg.split(':');
    state.candidates=state.candidates.filter(c=>c.id!==Number(id));finish();showCandidates(source);
  },
  rename:arg=>changeName(person(Number(arg))),
  grouprename:arg=>changeName(team(Number(arg))),
  talk:arg=>{const p=person(Number(arg));p.mood='沟通良好';save();render();personPage(p);},
  roster:arg=>rosterForm(team(Number(arg))),
  dissolveask:arg=>{
    const g=team(Number(arg));
    confirmAction('解散 '+g.name,'现有演出停止，成员仍与公司签约。4 周后可以重新组团或 Solo 出道。原团作品保留在发行记录。','dissolve',arg);
  },
  dissolve:arg=>{
    const g=team(Number(arg));
    if(g.members.map(person).some(lock)){error('制作中的团体暂时无法解散。');return;}
    retireGroup(g);finish();
  },
  endsoloask:arg=>{const p=person(Number(arg));confirmAction('结束 Solo 企划',groupOf(p)?'结束个人企划，继续留在原团活动。':'结束个人企划，退回练习生名单，可重新组队。','endsolo',arg);},
  endsolo:arg=>{const p=person(Number(arg));if(p&&!lock(p))endSolo(p);finish();},
  termoffer:renewPage,
  endterm:key=>{
    const a=target(key);if(!a)return;
    confirmAction('结束企划','艺人继续留社，保留个人属性和粉丝。','endtermdone',key);
  },
  endtermdone:key=>{
    const a=target(key);if(a?.members)retireGroup(a);else if(a)endSolo(a);finish();if(!showNextNotice())showMonthlyReport();
  },
  dismissask:arg=>{const p=person(Number(arg));confirmAction('结束合约','将 '+p.name+' 移出公司，并取消其个人排程。若有团籍，组合粉丝会受到影响。','dismiss',arg);},
  dismiss:arg=>{const p=person(Number(arg));if(lock(p)){error('制作期间不能解约。');return;}removeMember(p,true,false);finish();},
  finance, stage:stagePage, concert:concertForm,
  donate:arg=>{const i=Number(arg);if(!Number.isInteger(i))return;donate(i);},
  invite:arg=>{
    const i=state.inbox.find(x=>x.id===Number(arg));
    if(!i||!offerVisible(i))return;
    directPlan({type:'invite',ref:i.id,target:i.target});
  },
  decline:arg=>{const offer=state.inbox.find(i=>i.id===Number(arg));if(!offer)return;state.logs=[];expireOffer(offer,'已拒绝');const lines=state.logs.slice();(state.fanNews??=[]).push(...lines);finish();open('邀约处理结果',lines.map(line=>'<p>'+escape(line)+'</p>').join(''));},
  event:arg=>{
    const e=state.events.find(x=>x.id===Number(arg));
    if(!e)return;
    const p=person(e.person);
    open(eventTitle(e),(e.type==='creative'?'<p>'+escape(e.detail)+'</p>':'')+(e.cause?'<p>后台记录：'+escape(e.cause)+'。</p>':'')+'<div class="stack">'+eventChoicesFor(e).map(([value,label,hint])=>
      '<div>'+button(label,'eventchoice',arg+':'+value)+'<small>'+ (e.type==='friction'&&value==='keep'?retentionChance(p)+'% 留团':hint)+'</small></div>').join('')+'</div>');
  },
  confirmdeparture:arg=>{
    const [ref,choice]=arg.split(':');
    if(['separate','leave'].includes(choice)&&state.events.some(e=>e.id===Number(ref)&&e.type==='friction'))eventChoice(Number(ref),choice);
  },
  eventchoice:arg=>{
    const [ref,choice]=arg.split(':'), event=state.events.find(e=>e.id===Number(ref));
    if(!event)return;
    if(event.type==='creative'){handleCreative(event,choice);return;}
    if(event.type==='friction'&&['separate','leave'].includes(choice)){
      const p=person(event.person),g=p&&groupOf(p);if(!g)return;
      confirmAction('确认成员去向',p.name+'将退出'+g.name+(choice==='leave'?'并离开公司。':'，留社以 Solo 身份活动。'),'confirmdeparture',arg);return;
    }
    const actor=person(event.person), title=eventTitle(event), before=snapshot(), previousMessages=state.messages.length, previousFeedback=state.fanNews?.length||0;
    eventChoice(event.id,choice);
    if(state.events.some(e=>e.id===event.id))return;
    const result=deltas(before), feedback=state.fanNews||[];
    if(feedback.length===previousFeedback){
      const line=title+' · '+(!person(actor.id)?'艺人已离社。':actor.mood!==before.people.get(actor.id).mood?'艺人状态：'+actor.mood+'。':state.messages.length!==previousMessages?state.messages[0].body:'已按选项处理。')+(result?' · '+result:'');
      (state.fanNews??=[]).push(line);
      save();
      if(!sheet.open)open('事件结果','<p>'+escape(line)+'</p>');
    }else if(!sheet.open)open('事件结果','<p>'+escape(feedback.at(-1))+'</p>');
  },
  message:arg=>{
    const m=state.messages.find(x=>x.id===Number(arg));m.read=true;save();render();
    open(m.title,escape(m.body).split('\n').map(s=>'<p>'+s+'</p>').join(''));
  },
  messages:()=>open('短信回顾',state.messages.filter(m=>m.fromUncle||(m.fromUncle==null&&['叔叔汇来 20,000','旧债已还清','第一次小型演唱会','海外第一站','世界巡演官宣','三站巡演完成'].includes(m.title))).map(m=>'<p>'+button((m.read?'':'● ')+m.title,'message',m.id)+'</p>').join('')||'<p>还没有短信。</p>'),
  annualapply:()=>{
    if(state.annual?.status!=='open'||month(state.week)!==10)return;
    const rows=festivalCandidates();
    if(!rows.length){open('世界中心年末拼盘','<p>报名条件：团体至少 30,000 粉丝、Solo 至少 25,000 粉丝，须有已发行作品，演出周团体至少两人、Solo 本人可出勤。当前没有达标单位。邀约已放入待处理事件，可在 10 月底前返回报名。</p>');return;}
    open('世界中心年末拼盘 · 报名','<p>任选 1～2 组，可以同类型。所有出演单位共用 11 月第 4 周一个行程格。</p><form id="annualapply">'+rows.map(([key,a])=>
      '<label><input type="checkbox" name="target" value="'+escape(key)+'"> '+escape(a.name)+' · '+(a.members?'团体':'Solo')+' · '+money(a.fans)+' 粉丝</label>').join('')+'<button class="primary" disabled>确认报名</button></form>');
  },
  split:arg=>{
    const rows=splitRows().filter(([key])=>!arg||key===arg);
    open('年度分账','<p>可以当场结算，也可以延期后在艺人页面补结。练习生不参与分账。</p>'+rows.map(([key,a])=>
      textBlock(a.name,'<small>'+a.pendingSplits.map(b=>'第 '+b.year+' 年 '+money(b.amount)).join(' · ')+'</small><div class="row">'+
        button('结算','splitdo','pay:'+key,'primary')+button('延期','splitdo','later:'+key,'',a.pendingSplits.every(b=>b.deferred))+'</div>')).join('')+
      (rows.length>1?button('全部结算','splitall')+button('全部延期','splitdo','later'):''));
  },
  splitall:()=>confirmAction('一键结算','将支付全部待分账金额 '+money(splitRows().reduce((n,[,a])=>n+pendingAmount(a),0))+'。','splitdo','pay'),
  splitdo:arg=>{const [mode,...parts]=arg.split(':');if(doSplit(mode==='pay',parts.join(':'))){finish();if(splitRows().some(([,a])=>a.pendingSplits.some(b=>!b.deferred)))actions.split();}},

  export:()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='encore-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  },
  import:()=>open('导入存档','<p>导入会覆盖当前进度。可以先关闭并导出备份。</p><form id="import"><label>选择存档文件<input type="file" name="file" accept=".json,application/json" required></label><button class="primary">确认导入并覆盖</button></form>')
};
sheet.addEventListener('cancel',event=>{if(sheet.querySelector('#rename')?.dataset.source){event.preventDefault();actions.close();return;}if(state?.notices?.length||state?.monthSummary){event.preventDefault();if(state.notices?.length)showNextNotice();else actions.close();}});
document.addEventListener('click',event=>{
  const node=event.target.closest('[data-action]');
  if(node&&!node.disabled)actions[node.dataset.action]?.(node.dataset.arg);
});
document.addEventListener('input',event=>{
  const input=event.target;
  if(input.form?.id==='makeup'&&input.name==='artist')input.form.elements.beauty.value=person(Number(input.value)).beauty;
  if(input.form?.dataset.type==='album'&&['target','main'].includes(input.name))albumChoices(input.form,input.name==='target');
  if(input.form?.id==='debut'&&input.name==='member')readinessSummary(input.form);
  if(input.form?.id==='rename'&&input.name==='name'){
    const entry=renameEntry(input.form);
    if(entry)input.form.querySelector('[data-preview]').textContent=namingPreview(entry,input.value,namingTerms(entry,Boolean(input.form.dataset.source)));
  }
  if(input.form?.id==='annualapply'){
    const boxes=input.form.querySelectorAll('[name=target]');
    const count=Array.from(boxes).filter(box=>box.checked).length;
    for(const box of boxes)box.disabled=!box.checked&&count>=2;
    input.form.querySelector('button').disabled=count<1||count>2;
  }
  if(input.form?.id==='plan'&&input.name==='ref'&&['show','release'].includes(input.form.dataset.type))refreshPlanOptions(input.form);
  if(['planSort','planDirection'].includes(input.name)){
    const key=input.form.elements.planSort.value, direction=Number(input.form.elements.planDirection.value);
    if(key)for(const list of input.form.querySelectorAll('.plan-choices'))Array.from(list.children).sort((a,b)=>direction*(Number(a.dataset[key])-Number(b.dataset[key]))).forEach(row=>list.append(row));
  }
  if(input.form?.id==='renew'){
    const form=input.form;
    if(input.name==='renewAll')for(const box of form.querySelectorAll('[name=renewKey]'))box.checked=input.checked;
    if(input.name==='allYears'&&input.value)for(const select of form.querySelectorAll('select[name^="years-"]'))select.value=input.value;
    const keys=new Set(new FormData(form).getAll('renewKey')),rows=dueTerms().filter(([k])=>keys.has(k));
    form.querySelector('#renewTotal').textContent='已选 '+rows.length+' 组 · 总费用 '+money(rows.reduce((sum,[,a])=>sum+termFee(a),0));
  }
  if(input.form?.dataset.venue==='family'){
    const form=input.form, data=new FormData(form), lineup=data.getAll('lineup');
    for(const box of form.querySelectorAll('[name=song]')){
      box.disabled=!lineup.includes(box.dataset.owner);
      if(box.disabled)box.checked=false;
    }
    const count=form.querySelectorAll('[name=song]:checked').length;
    const fans=lineup.reduce((n,key)=>n+target(key).fans,0);
    form.querySelector('#ticketEstimate').textContent=lineup.length>=2&&count>=3&&count<=8?money(familyTickets(fans)*30)+'～'+money(familyTickets(fans)*33):'请至少选两组艺人和 3～8 首歌';
  }
  if(input.form?.id==='finance')sheet.querySelector('#balance').textContent=money(state.cash+(input.form.dataset.kind==='borrow'?1:-1)*Number(input.value));
});
document.addEventListener('submit',async event=>{
  event.preventDefault();
  const form=event.target, data=new FormData(form);
  switch(form.id){
    case 'makeup':{
      const p=person(Number(data.get('artist'))),n=Number(data.get('beauty'));
      if(!p||!Number.isInteger(n)||n<0||n>100)return;
      if(p.beauty===n){finish();return;}
      confirmAction('确认定妆',p.name+' · 基础颜值 '+p.beauty+' → '+n+'。费用 1,500,000，下次可在'+date(state.week+16)+'定妆。','makeupconfirm',p.id+':'+n);break;
    }
    case 'setup':
      draft={company:String(data.get('company')).trim(),player:String(data.get('player')).trim(),
        groupName:String(data.get('groupName')).trim(),kind:String(data.get('kind'))};
      if(!draft.company||!draft.player||!draft.groupName){error('请填写三个名称。');return;}
      intro=1;render();break;
    case 'plan':submitPlan(form);break;
    case 'popoapply': {
      const selected=new Set(data.getAll('member').map(Number));
      if(!state.popoBusiness||!selected.size){error('请勾选要开通的艺人。');return;}
      for(const p of state.people)if(selected.has(p.id)&&p.fans>=10000)p.popo=true;
      finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'artistsort':artistSort={key:data.get('stat'),direction:Number(data.get('direction'))};finish();break;
    case 'season': {
      const members=data.getAll('member').map(Number);
      if(state.season?.status!=='open'||![8,9].includes(month(state.week))||!members.length||members.length>3||members.some(id=>!seasonCandidates().some(p=>p.id===id))){error('请选择 1～3 名可参赛的练习生。');return;}
      state.season.people=members;state.season.status='running';
      for(const key of members)person(key).showLock={competing:true};
      finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'companyrecruit':companyRecruit(form);break;
    case 'debut':submitDebut(form);break;
    case 'roster':submitRoster(form);break;
    case 'renew':{
      const keys=new Set(data.getAll('renewKey'));
      const rows=dueTerms().filter(([k])=>keys.has(k));
      if(!rows.length){error('请选择要续约的团体或艺人。');return;}
      const fee=rows.reduce((n,[,a])=>n+termFee(a),0);
      if(fee>state.cash){error('现金不足，请调整选择。');return;}
      for(const [key,a] of rows){
        const years=Number(data.get('years-'+key));if(![1,3,5].includes(years))return;
      }
      changeCash(-fee);
      for(const [key,a] of rows){const years=Number(data.get('years-'+key));const begins=Math.max(state.week,a.term.ends);startTerm(a,years);a.term.ends=begins+years*48;(state.fanNews??=[]).push(a.name+'续约 '+years+' 年。');}
      finish();break;
    }
    case 'finance':submitFinance(form);showNextNotice();break;
    case 'rename': {
      const name=String(data.get('name')).trim();
      if(!name){error('请填写名称。');return;}
      const entry=renameEntry(form);if(!entry||entry.renameUntil>state.week)return;
      if(form.dataset.source)signCandidate(entry,form.dataset.source,name);
      else{updateName(entry,name,namingTerms(entry));finish();}
      break;
    }
    case 'concert': {
      const venue=form.dataset.venue, lineup=data.getAll('lineup');
      if(venue==='family'&&lineup.length<2){error('请选择至少两个演出单位。');return;}
      const hosts=[Number(data.get('hostMale')),Number(data.get('hostFemale'))].filter(Boolean);
      const songs=data.getAll('song');
      if(venue==='family'){
        if(hosts.length===1){error('请安排一男一女搭档主持，或两位都不安排。');return;}
        if(songs.length<3||songs.length>8||songs.some(id=>!familySongs(lineup).some(song=>song.id===id))){error('请从已选阵容中勾选 3～8 首歌。');return;}
      }
      if(venue==='family'){
        const slot=Number(data.get('familyWeek'));
        if(state.debt||month(state.week)!==11||state.familyInvite!=='open'||![0,1,2,3].includes(slot)){error('当前无法提交家族演唱会企划。');return;}
        state.familyPlan={slot,plan:{type:'concert',venue,lineup,hosts,songs,familyBooking:true}};
        state.familyInvite='booked';
        finish();if(!showNextNotice())showMonthlyReport();break;
      }
      directPlan({type:'concert',venue,target:data.get('target')});break;
    }
    case 'stagebook':{
      const venue=form.dataset.venue, slot=Number(form.dataset.slot),key=data.get('target');
      const reason=stageReason(venue,key,state.week+slot);
      if(reason){error(reason);return;}
      enqueue(venue==='tour'?{type:'tourdepart',target:key,scheduled:true}:{type:'concert',venue,target:key},slot);break;
    }
    case 'annualapply': {
      if(month(state.week)!==10||state.annual?.status!=='open')return;
      const lineup=[...new Set(data.getAll('target'))], eligible=new Map(festivalCandidates());
      if(lineup.length<1||lineup.length>2||lineup.some(key=>!eligible.has(key))){error('请选择 1～2 组符合条件的出演单位。');return;}
      state.annual.lineup=lineup;
      state.annual.names=Object.fromEntries(lineup.map(key=>[key,eligible.get(key).name]));
      state.annual.status='booked';finish();if(!showNextNotice())showMonthlyReport();break;
    }
    case 'import':
      try {
        const next=JSON.parse(await data.get('file').text());
        if(!savedGame(next))throw Error('invalid');
        state=upgrade(next);tab=0;finish();
      }catch{error('请选择本游戏导出的有效存档。');}
      break;
  }
});
if(state)state=savedGame(state)?upgrade(state):null;
render();
if(state&&!showNextNotice())showMonthlyReport();
</script>
</body>
</html>
