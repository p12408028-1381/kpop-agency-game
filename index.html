<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181925"><title>下一场安可</title>
<style>
:root{color-scheme:dark;--bg:#14151f;--card:#202230;--line:#393b50;--text:#f6f3ff;--muted:#b5b3c9;--accent:#dccaff;--green:#a3e0cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#33284a,transparent 480px),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px 16px 110px}h1,h2,h3,p{margin:0 0 10px}h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1rem}.muted,small{color:var(--muted)}small{display:block}button,input,select{font:inherit}button,input,select{border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:inherit;background:#292b3d;min-height:44px}button{cursor:pointer}button.primary,nav button.active{background:var(--accent);color:#231a33;border-color:transparent;font-weight:700}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input:not([type=checkbox]),select{width:100%}input[type=checkbox]{min-height:auto}label{display:block;margin:8px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:8px}.money{color:var(--green);font-weight:700}.slot{min-height:72px}.tag{background:#39304e;color:var(--accent);padding:3px 8px;border-radius:8px;font-size:.8rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}.stats div{background:#292b3d;padding:8px;border-radius:10px}nav{position:fixed;bottom:0;left:0;right:0;z-index:2;background:#1b1c29;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}nav div{display:grid;grid-template-columns:repeat(4,1fr);max-width:660px;margin:auto;gap:6px}dialog{color:var(--text);background:#202230;border:1px solid var(--line);border-radius:20px;width:min(96vw,620px);max-height:85dvh;padding:16px}dialog::backdrop{background:#08090dbb}.story{animation:arrive .35s ease-out}.paper{background:#f3e9d9;color:#29211d;border-radius:4px;padding:24px 16px;margin:22px 0;font-family:serif;box-shadow:5px 7px 0 #0004}.paper h2{font-size:1.9rem}.danger{color:#ffc2cc}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.news{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:18px;font-size:.86rem;color:var(--accent)}.news span{flex:0 0 100%;scroll-snap-align:start;min-width:0}
</style>
</head>
<body><main id="app"></main><nav id="nav" aria-label="主面板" hidden></nav><dialog id="sheet"></dialog>
<script>
'use strict';
const KEY = 'encore-agency-v1';
const money = value => Number(value).toLocaleString('zh-CN');
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const random = (min,max) => min + Math.floor(Math.random()*(max-min+1));
const pick = list => list[random(0,list.length-1)];
const limit = value => Math.max(0,Math.min(100,value));
const year = week => Math.floor(week/48)+1;
const month = week => Math.floor(week%48/4)+1;
const date = week => '第 '+year(week)+' 年 · '+month(week)+' 月第 '+(week%4+1)+' 周';
const tabs = ['本月','艺人','作品','公司'];
const stations = [
  {name:'首尔舞台',fans:0,cost:900,range:[70,320],rival:[0,4700]},
  {name:'全国放送',fans:8000,cost:2300,range:[240,780],rival:[4400,19800]},
  {name:'世界中心',fans:20000,cost:5500,range:[650,1900],rival:[17500,88000]}
];
const invites = {
  brand:{name:'品牌站台',hint:'＋粉丝　－健康',pay:5200},
  recall:{name:'召回打歌',hint:'＋粉丝　－健康',pay:3200},
  variety:{name:'综艺出演',hint:'＋粉丝　－健康',pay:2600},
  ad:{name:'广告拍摄',hint:'＋粉丝　－健康',pay:6800},
  audition:{name:'影视试镜',hint:'可能获得角色　－健康',pay:0},
  solo:{name:'个人 Solo 作品邀约',hint:'启动制作 · 4 周后完成',pay:0}
};
const activities = {
  vocal:{name:'声乐训练',hint:'＋歌唱　－健康',cost:250},
  dance:{name:'舞蹈训练',hint:'＋舞蹈　－健康',cost:250},
  rest:{name:'主动休养',hint:'＋健康',cost:0},
  beauty:{name:'医美',hint:'＋颜值　可能－颜值',cost:1400},
  scout:{name:'星探发掘',hint:'发现练习生',cost:300},
  recruit:{name:'公司招募',hint:'发现练习生或成熟艺人',cost:750},
  groupwrite:{name:'团体作曲',hint:'曲库新增 1 首歌　－健康',cost:0},
  write:{name:'成员自作曲',hint:'曲库新增 1 首歌　－健康',cost:0},
  album:{name:'专辑制作',hint:'4 周后完成，艺人可照常活动',cost:0},
  release:{name:'发行作品',hint:'＋粉丝',cost:500},
  road:{name:'地方路演',hint:'＋资金　＋粉丝　－健康',cost:0},
  warm:{name:'家乡动员',hint:'＋资金　＋粉丝　－健康',cost:0},
  sale:{name:'专辑签售',hint:'＋资金　＋粉丝　－健康',cost:0},
  show:{name:'音乐台打歌',hint:'＋粉丝　－健康',cost:0},
  invite:{name:'接受邀约',hint:'选择执行周',cost:0},
  concert:{name:'演唱会',hint:'＋粉丝　－健康',cost:0},
  festival:{name:'音乐台年末拼盘',hint:'＋资金　＋粉丝　－健康',cost:0},
  shoot:{name:'影视拍摄',hint:'＋资金　－健康 · 等待播出',cost:0},
  press:{name:'召开说明会',hint:'＋粉丝',cost:0}
};
const venues = {
  local:{name:'韩国小型专场',fans:5000,cost:5500,pay:10500},
  arena:{name:'韩国大型专场',fans:22000,cost:13000,pay:23500},
  abroad:{name:'海外首演',fans:30000,cost:19000,pay:31500},
  family:{name:'家族演唱会',fans:0,cost:12000,pay:24500},
  tour:{name:'世界巡演',fans:55000,cost:24000,pay:39000}
};
const male = ['旻宰','泰旴','道允','宇贤','时温','睿俊','贤宇','在律','江珉','延昊'];
const female = ['知媛','荷允','瑞妍','恩夏','多温','宝敏','雪雅','有真','采恩','宥娜'];
const songNames = ['雨停之前','玻璃窗','夜班公车','慢一拍','纸月亮','拥挤的信箱','四月的海','最后一班地铁'];
const app = document.querySelector('#app');
const nav = document.querySelector('#nav');
const sheet = document.querySelector('#sheet');
let state = null, tab = 0, artistFilter='团体', artistSort=null, intro = 0, draft = null, storageFailed = false;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
function save(){
  try { localStorage.setItem(KEY,JSON.stringify(state)); storageFailed=false; }
  catch { storageFailed=true; }
}
function id(){return ++state.serial;}
function person(key){return state.people.find(p=>p.id===key);}
function team(key){return state.groups.find(g=>g.id===key && !g.closed);}
function work(key){return state.works.find(w=>w.id===key);}
function target(key){
  const [type,raw] = String(key||'').split(':');
  return type==='g'?team(Number(raw)):type==='p'?person(Number(raw)):null;
}
function groupOf(p){return state.groups.find(g=>!g.closed && g.members.includes(p.id));}
function performers(key){
  const entry=target(key);
  return !entry?[]:entry.members?entry.members.map(person).filter(Boolean):[entry];
}
function units(){
  return [...state.groups.filter(g=>!g.closed).map(g=>['g:'+g.id,g]),
    ...state.people.filter(p=>p.solo).map(p=>['p:'+p.id,p])];
}
function availableWorks(key){return state.works.filter(w=>w.owner===key && w.status==='released');}
function activePeople(){return state.people.map(p=>['p:'+p.id,p]);}
function allTargets(){return [...units(),...activePeople().filter(([key])=>!units().some(([k])=>k===key))];}
function lock(p){return p.sick||p.leaving||p.shelved||p.showLock;}
function lockedText(p){return p.leaving?'待处理离社':p.sick?'病休中':p.showLock?'选秀锁档':p.shelved?'暂停公开活动':'';}
function wages(){return state.people.reduce((sum,p)=>sum+p.salary,0);}
function log(message){state.logs.push(message);}
function message(title,body){state.messages.unshift({id:id(),title,body,read:false});}
function milestone(key,title,body){
  if(state.flags[key])return;
  state.flags[key]=true;
  if(body)message(title,body);
}
function newPerson(gender,mature=false){
  const names=gender==='男'?male:female;
  const used=new Set([...state.people,...state.candidates].map(p=>p.name));
  return {id:id(),name:pick(names.filter(n=>!used.has(n)).length?names.filter(n=>!used.has(n)):names),
    gender,status:mature?'artist':'trainee',solo:false,fans:mature?random(250,4200):0,
    vocal:random(mature?42:25,mature?83:67),dance:random(mature?42:25,mature?83:67),
    beauty:random(35,88),health:random(77,100),salary:500,salaryTier:0,cool:0,
    personality:pick(['慢热','外向','重视个人发展','团队优先','好胜','沉稳']),writer:random(1,4)===1,mood:'平稳'};
}
function rivalLineup(){
  const names=['月湾娱乐 · ORBITAL','白昼唱片 · Nacre','星岸企划 · MIRU','桥灯音乐 · PAGE','北港娱乐 · HAZE','春日制作 · Pollen'];
  return stations.map(s=>{
    const pool=[...names];
    return Array.from({length:random(1,3)},()=>{
      const name=pool.splice(random(0,pool.length-1),1)[0];
      return {name,fans:random(...s.rival)};
    });
  });
}
function start(config){
  state={version:3,serial:0,...config,week:0,cash:50000,debt:200000,loan:0,arrears:0,people:[],groups:[],
    works:[],songs:[],queue:[],inbox:[],events:[],messages:[],logs:[],last:[],candidates:[],flags:{},
    rivals:rivalLineup(),familyYear:0,splitYear:0,annual:null,tour:null,roles:[]};
  const genders=config.kind==='男团'?Array(5).fill('男'):config.kind==='女团'?Array(5).fill('女'):['男','男','女','女','女'];
  for(const gender of genders){
    const p=newPerson(gender,true);p.fans=random(120,650);state.people.push(p);
  }
  const group={id:id(),name:config.groupName,members:state.people.map(p=>p.id),fans:random(600,1250),closed:false};
  state.groups.push(group);
  state.works.push({id:id(),owner:'g:'+group.id,title:'雨后的练习室',format:'专辑',status:'released',old:true});
  refreshNews([],true);save();
}
function button(label,action,arg='',style='',disabled=false){
  return '<button type="button" class="'+style+'" data-action="'+action+'" data-arg="'+escape(arg)+'"'+(disabled?' disabled':'')+'>'+escape(label)+'</button>';
}
function textBlock(title,contents){return '<section class="card"><h3>'+escape(title)+'</h3>'+contents+'</section>';}
function options(rows){return rows.map(([value,label])=>'<option value="'+escape(value)+'">'+escape(label)+'</option>').join('');}
function listNames(rows){return rows.map(([key,p])=>[key,p.name+(p.members?' · '+p.members.length+' 人':'')+' · '+money(p.fans)+' 粉丝']);}
function open(title,body){
  sheet.innerHTML='<div class="row spread"><h2>'+escape(title)+'</h2>'+button('关闭','close')+'</div>'+body;
  if(!sheet.open)sheet.showModal();
  sheet.scrollTop=0;
}
function error(message){
  const area=sheet.open?sheet:app;
  let node=area.querySelector('#error');
  if(!node){node=document.createElement('p');node.id='error';node.className='danger';node.setAttribute('role','alert');area.append(node);}
  node.textContent=message; node.scrollIntoView?.({block:'nearest'});
}
function finish(){if(sheet.open)sheet.close();save();render();}
function showTab(key){tab=key;finish();window.scrollTo(0,0);}
function render(){
  if(!state || intro){
    nav.hidden=true;
    if(intro===1){
      app.innerHTML='<div class="story"><div class="paper"><small>娱乐晚报</small><h2>「'+escape(draft.company)+'」宣布破产，公司代表跑路！！</h2></div>'+button('查看手机短信','intro',2,'primary')+' '+button('跳过序章','intro',3)+'</div>';
    }else if(intro===2){
      app.innerHTML='<div class="story"><h1>叮，收到一条短信</h1>'+textBlock('叔叔','<p>'+escape(draft.company)+'大楼的钥匙寄给你了。叔叔先出去避避风头。</p>')+'<p>你带着自己攒下的 50,000 打开办公室。桌上的账本还欠着 200,000。</p>'+button('进入公司','intro',3,'primary')+'</div>';
    }else{
      app.innerHTML='<h1>下一场安可</h1><p class="muted">韩国经纪公司经营游戏</p><form id="setup" class="card stack"><label>公司名<input name="company" maxlength="24" value="长夜企划" required></label><label>代表名<input name="player" maxlength="16" value="小夏" required></label><label>初始团体名<input name="groupName" maxlength="24" value="Afterlight" required></label><label>初始团体<select name="kind"><option>男团</option><option>女团</option><option>混团</option></select></label><small>混团为 2 男 3 女。原团已有旧歌可供演出。</small><button class="primary">接手公司</button></form>';
    }
    return;
  }
  const unread=state.messages.filter(m=>!m.read).length;
  const pending=state.inbox.length+state.events.length+(state.promoEvents||[]).length+unread;
  nav.hidden=false;
  nav.innerHTML='<div>'+tabs.map((name,i)=>button(name+(i===0&&pending?' · '+pending:''),'tab',i,i===tab?'active':'')).join('')+'</div>';
  app.innerHTML='<header><div class="row spread"><small>'+escape(state.company)+' · '+escape(state.player)+'代表</small><span class="money">'+money(state.cash)+'</span></div><h1>'+tabs[tab]+'</h1><small>'+date(state.week)+'</small></header>'+newsNotes()+
    (storageFailed?'<p class="danger">浏览器目前无法自动保存。可在公司页导出存档。</p>':'')+
    [weekPage,artistsPage,worksPage,companyPage][tab]();
  rotateNews();
}
function planLabel(plan){
  if(plan.type==='invite')return invites[state.inbox.find(i=>i.id===plan.ref)?.type]?.name||'业务邀约';
  if(plan.type==='show')return '打歌 · '+stations[plan.station].name;
  if(plan.type==='concert')return venues[plan.venue].name;
  return activities[plan.type].name;
}
function planOwner(plan){return target(plan.target)?.name||plan.lineup?.map(k=>target(k)?.name).filter(Boolean).join('、')||plan.people?.map(k=>person(k)?.name).filter(Boolean).join('、')||work(plan.ref)?.title||'';}
function countdown(left){return left<=1?'本周截止':'剩余 '+left+' 周';}
function weekPage(){
  const queue=[0,1,2,3].map(i=>{
    const plan=state.queue[i];
    return '<div class="card slot row spread">'+(plan?
      '<div><small>第 '+(i+1)+' 周</small><h3>'+escape(planLabel(plan))+'</h3><small>'+escape(planOwner(plan))+'</small><small>'+escape(plan.type==='show'?'执行时需 '+money(stations[plan.station].fans)+' 粉丝 · 费用 '+money(planCost(plan)):activities[plan.type].hint)+'</small></div><div class="row">'+(plan.type==='festival'?'<span class="tag">固定档期</span>':button('替换','schedule',i)+button('移除','remove',i))+'</div>':
      '<small>第 '+(i+1)+' 周</small>'+button('＋ 安排行程','schedule',i))+'</div>';
  }).join('');
  const inbox=[...state.inbox].sort((a,b)=>a.expiry-b.expiry).map(i=>{
    const entry=target(i.target);
    const queued=state.queue.some(p=>p?.type==='invite'&&p.ref===i.id);
    const status=performers(i.target).map(lockedText).find(Boolean);
    return '<div class="card"><div class="row spread"><strong>'+invites[i.type].name+'</strong><span class="tag">'+countdown(i.expiry-state.week)+'</span></div><small>'+escape(entry?.name)+'　'+escape((i.self?'艺人自荐 · 拒绝或到期会降低健康　':'')+(status||invites[i.type].hint))+'</small><div class="row">'+button(queued?'已安排':'选择执行周','invite',i.id,'',queued)+button('放弃','decline',i.id,'',queued)+'</div></div>';
  }).join('');
  const projects=state.works.filter(w=>w.status==='making').map(w=>'<p>'+escape(w.title)+' · 剩余 '+(w.ready-state.week)+' 周</p>').join('');
  const guide=state.week===0?textBlock('开局路线','<p><strong>简易</strong> · 去「作品」用原团旧歌安排路演，再选一名成员训练或休养。</p><small>困难 · 可以在团体详情立即解散原团。成员仍领工资，4 周后可重组或 Solo 出道。冷却期间可以接地方暖场。</small>'):'';
  return guide+'<h2 style="margin-top:16px">月计划 '+state.queue.filter(Boolean).length+' / 4</h2>'+queue+
    button('结算本月','advance','','primary',state.queue.filter(Boolean).length!==4)+
    (state.annual?annualPanel():'')+extras()+
    '<h2 style="margin-top:20px">待处理</h2>'+
    (state.events.map(e=>textBlock(eventTitle(e),button('查看选择','event',e.id))).join(''))+
    (state.promoEvents||[]).map(e=>textBlock('音源注水争议',button('查看公关选项','promoreply',e.id))).join('')+inbox+(state.inbox.length||state.events.length||(state.promoEvents||[]).length?'':'<p class="muted">本月暂无待处理邀约或事件。</p>')+
    (state.messages.length?textBlock('短信',state.messages.slice(0,4).map(m=>button((m.read?'':'● ')+m.title,'message',m.id)).join(' ')):'')+
    textBlock('进行中',projects||'<small>没有制作中的项目。</small>')+
    textBlock('本期结算',state.last.length?state.last.map(l=>'<p>'+escape(l)+'</p>').join(''):'<small>结算本月后可查看结果。</small>');
}
const sortStats={vocal:'歌唱',dance:'舞蹈',beauty:'颜值',health:'健康'};
function artistRanking(a,key){
  const people=a.members?a.members.map(person).filter(Boolean):[a];
  return people.reduce((sum,p)=>sum+p[key],0)/Math.max(1,people.length);
}
function artistsPage(){
  const groups=state.groups.filter(g=>!g.closed);
  const people=state.people;
  const filters='<div class="row spread"><div class="row">'+['团体','Solo','练习生'].map(k=>button(k==='Solo'?'Solo 艺人':k,'filter',k,k===artistFilter?'primary':'')).join('')+
    '</div><div class="row">'+button('筛选','sortartists')+button('一键结算','splitall','','',!splitRows().length)+'</div></div>';
  const ranking=artistSort?' <small>'+sortStats[artistSort.key]+(artistSort.direction===1?'从低到高':'从高到低')+'，团体按成员平均值</small>':'';
  const rows=artistFilter==='团体'?groups:people.filter(p=>artistFilter==='Solo'?p.solo:p.status==='trainee'||(!p.solo&&!groupOf(p)));
  if(artistSort)rows.sort((a,b)=>artistSort.direction*(artistRanking(a,artistSort.key)-artistRanking(b,artistSort.key)));
  return '<p class="muted">签约人数 '+people.length+' / 60</p><div class="row">'+button('雇佣星探','scouts')+' '+button('公司招募','preset','recruit')+' '+button('候选人 '+state.candidates.length,'candidates')+' '+button('组建团体','debut','group')+' '+button('Solo 出道','debut','solo')+'</div>'+
    filters+ranking+textBlock(artistFilter==='Solo'?'Solo 艺人':artistFilter,rows.map(a=>{
      const key=(a.members?'g:':'p:')+a.id, due=pendingAmount(a);
      const detail=a.members?a.members.length+' 人 · '+money(a.fans)+' 粉丝':lockedText(a)||(a.cool>state.week?'重组冷却 · '+(a.cool-state.week)+' 周':a.mood);
      return '<div class="row spread"><span>'+escape(a.name)+' <small>'+escape(detail)+(due?' · 待分账 '+money(due):'')+'</small></span><div class="row">'+button('详情',a.members?'group':'person',a.id)+(due?button('结算','split',key):'')+'</div></div>';
    }).join('')||'<small>暂无人员。</small>');
}
function worksPage(){
  return '<div class="row">'+button('专辑制作','preset','album')+' '+button('专辑发行','preset','release')+' '+button('个人自作曲','preset','write')+' '+button('团体作曲','preset','groupwrite')+'</div>'+
    textBlock('曲库',state.songs.filter(s=>!s.used).map(s=>'<p>'+escape(s.title)+' <small>'+escape(s.author)+'</small></p>').join('')||'<small>暂无可用自作曲。</small>')+
    ['making','ready','released'].map((status,index)=>textBlock(['制作中','待发行仓库','已发行'][index],state.works.filter(w=>w.status===status).slice().reverse().map(w=>

function workEligible(w,type){
  if(!target(w.owner))return false;
  if(type==='release')return w.status==='ready'||(w.status==='making'&&w.ready<state.week+4);
  if(['show','sale','road'].includes(type)&&state.queue.some(p=>p?.type==='release'&&p.ref===w.id))return type!=='sale'||w.format==='专辑';
  if(w.status!=='released')return false;
  if(type==='show'&&(w.old||state.week>w.released+6))return false;
  return type!=='sale'||(!w.old&&w.format==='专辑'&&state.week<w.released+25);

  if(p.type==='show')return stations[p.station].cost;
  if(p.type==='concert')return venues[p.venue].cost;
  if(p.type==='album')return p.main?5100:9000;
  if(p.type==='invite'&&state.inbox.find(i=>i.id===p.ref)?.type==='solo')return 2300;
  return activities[p.type].cost;
}
function planPeople(p){
  if(p.people)return p.people;

  if(p.lineup)return [...new Set(p.lineup.flatMap(key=>performers(key).map(a=>a.id)))];

  if(!Number.isInteger(slot)||slot<0||slot>3){error('请选择第 1～4 周。');return;}
  if(state.queue[slot]?.type==='festival'&&plan.type!=='festival'){error('该周已预留年末拼盘。');return;}
  if(plan.type==='release'){const w=work(plan.ref);if(w?.status==='making'&&w.ready>state.week+slot){error('这一周作品尚未完成，请选完成周或更晚。');return;}}
  if(plan.type==='invite'){
    const offer=state.inbox.find(i=>i.id===plan.ref);
    if(!offer||state.week+slot>=offer.expiry){error('该周已经超过邀约截止日。');return;}
  }
  if(plan.eventRef&&state.queue.some((p,i)=>i!==slot&&p?.eventRef===plan.eventRef)){error('此事件已有安排。');return;}
  state.queue[slot]=plan;

function removeMember(p,leave,peaceful){
  const group=groupOf(p), key='p:'+p.id;
  if(group){
    const sum=group.members.map(person).reduce((n,a)=>n+a.fans,0);
    const loss=Math.round(group.fans*(sum?p.fans/sum:1/group.members.length)*(peaceful?.32:.73));
    group.fans=Math.max(0,group.fans-loss);
    group.members=group.members.filter(i=>i!==p.id);
    if(group.members.length<2)closeGroup(group);
    else cancelPlans(['g:'+group.id]);
  }
  if(leave){
    state.people=state.people.filter(a=>a.id!==p.id);
    state.events=state.events.filter(e=>e.person!==p.id);
    state.roles=state.roles.filter(r=>r.target!==key||r.status==='broadcast');
    state.inbox=state.inbox.filter(i=>i.target!==key);
    cancelPlans([key]);
  }
}
function adjust(key,amount,groupShare=true){
  const a=target(key);
  if(!a)return;
  const before=a.fans;
  a.fans=Math.max(0,a.fans+amount);
  if(amount<0&&a.fans<before&&!a.members){
    a.health=limit(a.health-random(1,3));
    if(!a.fans&&a.status==='artist'&&!a.shelved&&!state.events.some(e=>e.type==='zero'&&e.person===a.id))state.events.push({id:id(),type:'zero',person:a.id});
    checkHealth(a);
  }
  if(a.members&&amount>0&&groupShare)for(const p of performers(key).filter(p=>!lock(p)))p.fans+=Math.round(amount*pick([0,.025,.05,.08,.12,.19,.27]));
}
function health(key,amount){for(const p of performers(key))p.health=limit(p.health+amount);}
function income(amount,key){
  state.cash+=amount;
  const entry=target(key);
  if(entry)entry.earnings=(entry.earnings||0)+amount;

function coverage(key,range,odds=3){
  const ps=performers(key).filter(p=>!lock(p));
  const quality=ps.reduce((n,p)=>n+(p.vocal+p.dance+p.health)/3,0)/(ps.length||1);
  let amount=Math.round(random(...range)*(.82+quality/240));
  if(random(1,100)<=odds){amount*=random(3,6);log('一段现场片段被大量转发，新观众开始关注 '+target(key).name+'。');}
  adjust(key,amount);
}
function physical(plan,touched,extra=0){
  const ps=planPeople(plan).map(person);
  for(const p of ps){touched.add(p.id);p.health=limit(p.health-Math.max(1,random(4,8)+extra-(p.popo?2:0)));}
  return ps;
}
function collapse(ps){
  const weak=ps.find(p=>p.health<24&&random(1,100)<=45);
  if(!weak)return false;
  weak.health=limit(weak.health-8);
  if(!state.events.some(e=>e.person===weak.id&&e.type==='collapse'))state.events.push({id:id(),type:'collapse',person:weak.id});
  log(weak.name+'在现场晕倒，后半场缩短。');
  return true;
}

function runPlan(p,touched){
  const a=target(p.target), w=work(p.ref);
  const cost=planCost(p);
  state.cash-=cost;
  switch(p.type){
    case 'vocal': case 'dance':
      a[p.type]=limit(a[p.type]+random(2,5));a.health=limit(a.health-random(2,4));touched.add(a.id);
      log(a.name+'完成训练。');break;
    case 'idle': log('全员休整。');break;
    case 'rest': health(p.target,random(14,23));touched.add(a.id);a.mood='平稳';log(a.name+'休养了一周。');break;
    case 'beauty':
      if(random(1,100)<=20){a.beauty=limit(a.beauty-random(3,12));state.events.push({id:id(),type:'beauty',person:a.id});}
      else{a.beauty=limit(a.beauty+random(2,7));log(a.name+'对这次医美效果满意。');}

    case 'scout': case 'recruit':
      if(state.candidates.length>=24){log('候选名单已满，请先处理现有候选人。');state.cash+=cost;break;}

      log('新增候选人。去「艺人」查看或签约。');break;
    case 'groupwrite': {
      const ps=physical(p,touched);

    case 'album': createProject(p);break;
    case 'release': {

      log('《'+w.title+'》已发行。');

      break;
    }
    case 'road': case 'warm': {
      const incident=collapse(physical(p,touched)), warm=p.type==='warm';
      income(warm?2000:4400+Math.min(2700,Math.floor(a.fans/12)),p.target);
      coverage(p.target,incident?[20,110]:warm?[35,125]:[105,385]);
      if(!warm)activitySales(w,a,incident?.4:1);
      log(a.name+(warm?'完成家乡动员。':'完成地方路演，场地方已结款。'));break;
    }
    case 'sale': {
      w.signings=(w.signings??(w.signed?1:0))+1;
      const demand=Math.max(.32,Math.pow(.88,Math.max(0,w.signings-8)));
      const ps=physical(p,touched);
      const base=9100+Math.min(21000,Math.floor(a.fans*.65));
      income(Math.round(base*random(78,122)/100*demand),p.target);
      log('《'+w.title+'》第 '+w.signings+' 场签售'+(demand<1?' · 购买力回落':'')+'。');
      if(ps.some(a=>a.health<32)&&random(1,100)<=32){adjust(p.target,-random(30,110));log('签售疲态引发议论。');}
      else coverage(p.target,[135,540],4);
      log((w.tracks?.length?'有粉丝请成员在自己写的歌词页签名。':'签售结束，现场销售已结款。'));break;
    }
    case 'show': {
      w.stations=(w.stations||[]).concat(p.station);
      const rivals=p.rivals||state.rivals[p.station], higher=rivals.filter(r=>r.fans>a.fans).length;
      const tied=rivals.filter(r=>r.fans===a.fans).length, rank=1+higher+random(0,tied);
      const opponent=rivals.slice().sort((x,y)=>y.fans-x.fans)[0];
      const incident=collapse(physical(p,touched));
      const scale=[1,.67,.46,.32][rank-1]*(incident?.7:1);
      const [low,high]=stations[p.station].range.map(n=>Math.max(1,Math.round(n*scale)));
      const gained=random(low,high);
      if(!incident&&random(1,100)<=8)log(a.name+'的结尾 Wink 被观众记住。');
      adjust(p.target,gained);
      if(!incident&&random(1,100)<=3){adjust(p.target,gained*random(2,5));log('这期打歌的一段直拍突然走红。');}
      activitySales(w,a,scale);
      log(a.name+' · '+stations[p.station].name+(rank===1?'喜提一位':'惜败于 '+opponent?.name)+' · 第 '+rank+' / '+(rivals.length+1));break;
    }
    case 'invite': {
      const offer=state.inbox.find(i=>i.id===p.ref);
      state.inbox=state.inbox.filter(i=>i.id!==p.ref);
      if(offer.type==='recall'){work(offer.work).recalled=true;physical(p,touched);income(3200,p.target);coverage(p.target,[360,1100],6);log(a.name+'完成召回打歌。');break;}
      if(offer.type==='solo'){createProject(p,true);break;}
      if(offer.type==='audition'){audition(p.target,touched);break;}
      physical(p,touched);income(invites[offer.type].pay,p.target);
      coverage(p.target,offer.type==='ad'?[160,480]:[280,840],6);
      log(a.name+'完成'+invites[offer.type].name+'。');
      if(!a.members&&random(1,4)===1&&!state.events.some(e=>e.person===a.id&&e.type==='spotlight'))state.events.push({id:id(),type:'spotlight',person:a.id});
      break;
    }
    case 'audition': audition(p.target,touched);break;
    case 'shoot': {
      const role=state.roles.find(r=>r.id===p.ref);
      physical(p,touched,3);role.status='waiting';role.air=state.week+3;
      income(9000,p.target);log(a.name+'完成《'+role.title+'》拍摄。');break;
    }
    case 'concert': runConcert(p,touched);break;
    case 'festival':
      physical(p,touched,2);income(12500,p.target);coverage(p.target,[900,2700],7);
      state.annual.status='done';log(a.name+'完成音乐台年末拼盘演出。');break;
    case 'press': adjust(p.target,random(70,330));log(a.name+'的说明会结束，部分观众认可了回应。');break;
  }
}

function runConcert(plan,touched){
  const spec=venues[plan.venue];
  const incident=collapse(physical(plan,touched,plan.venue==='tour'?6:3));
  if(plan.venue==='family'){
    const keys=plan.lineup;
    for(const key of keys){income(Math.floor(spec.pay/keys.length),key);coverage(key,incident?[200,550]:[500,1550]);}
    state.familyYear=year(state.week);
  }else{
    income(spec.pay,plan.target);coverage(plan.target,incident?[120,650]:plan.venue==='tour'?[1700,4400]:[580,2250],5);
  }
  if(plan.venue==='local')milestone('local','第一次小型演唱会',state.player+'，叔叔果然没有看错你！！有人发给我一段现场视频。我听见台下有人喊安可，还倒回去听了两遍。');
  if(plan.venue==='abroad')milestone('abroad','海外第一站','演出结束了吧？你们合照拍了吗？给我发一张。下次还有票，给叔叔留个靠后的位置就行。');
  if(plan.venue==='tour'){
    state.tour.stops++;

  }
  log(spec.name+'已完成。');
}

function genEvents(){
  const available=state.people.filter(p=>p.status==='artist'&&!p.leaving&&!p.showLock&&!state.events.some(e=>e.person===p.id));
  const free=available.filter(p=>!lock(p));
  const raise=available.find(p=> p.fans>10000&&p.health<=50&&state.week>=(p.raiseAfter||0));
  if(raise&&random(1,100)<=25)state.events.push({id:id(),type:'raise',person:raise.id});
  if(!free.length||random(1,100)>22)return;
  const p=pick(free.filter(p=>p!==raise).length?free.filter(p=>p!==raise):free);
  if(state.events.some(e=>e.person===p.id))return;
  const pool=['rumor','privacy','attitude','clip','testpaper','oldphoto','senior','eyerolled'];
  if(groupOf(p)&&p.fans>=1700)pool.push('friction','friction');
  const type=pick(pool);
  state.events.push({id:id(),type,person:p.id});
  if(type==='clip'){
    const gain=random(100,450);adjust('p:'+p.id,gain);
    log(p.name+'的粉丝剪辑突然爆火 · 粉丝 +'+gain);
  }
}
function eventChoice(ref,choice){
  const e=state.events.find(x=>x.id===ref), p=person(e.person), key='p:'+p.id, group=groupOf(p);
  const clear=()=>{state.events=state.events.filter(x=>x.id!==ref);};
  if(e.type==='clip'){
    if(choice==='boost'&&state.cash<800){error('现金不足。');return;}
    if(choice==='boost'){
      const gain=random(200,950);state.cash-=800;adjust(key,gain);
      (state.fanNews??=[]).push(p.name+'的粉丝剪辑追加推广 · 资金 −800 · 粉丝 +'+gain);
      message('粉丝剪辑推广结果','资金 −800 · '+p.name+'粉丝 +'+gain);
    }
    clear();finish();return;
  }
  if(['testpaper','oldphoto','senior','eyerolled'].includes(e.type)){
    const before=p.fans;adjust(key,choice==='respect'?random(-115,220):-random(10,75));
    const change=p.fans-before, result=p.name+' · '+eventNames[e.type]+' · 粉丝 '+(change>=0?'+':'−')+money(Math.abs(change));
    (state.fanNews??=[]).push(result);message('公关反馈',result);
    clear();finish();return;
  }
  if(e.type==='critical'||e.type==='zero'){
    clear();
    if(choice==='leave')removeMember(p,true,false);
    else if(choice==='save'){p.savedOnce=true;p.leaving=false;p.sick=true;p.forcedRest=true;p.mood='停工休养';}
    else p.shelved=true;
    finish();return;
  }
  if(e.type==='truck'){
    if(choice==='respond'){p.mood='沟通良好';p.health=limit(p.health+4);}
    else adjust(key,-random(75,320));
    clear();finish();return;
  }
  if(e.type==='privacy'){
    if(choice==='quiet'){p.privacy=(p.privacy||0)+1;p.privacyDue=state.week+4;p.health=limit(p.health-random(4,9));checkHealth(p);}
    else if(choice==='protect'&&state.cash<600){error('现金不足。');return;}
    else {p.privacy=0;if(choice==='rest')p.sick=true;}
  }
  if(lock(p)&&['leave','separate','solo','keep'].includes(choice)){error('该艺人当前处于锁档状态，解锁后再处理。');return;}
  if(choice==='press'||(choice==='rest'&&e.type!=='privacy')){
    const entry={type:choice,target:key,eventRef:ref};directPlan(entry);return;
  }
  if(e.type==='raise'){
    p.raiseAfter=state.week+8;
    const agree=p.mood==='沟通良好'||p.personality==='团队优先'?75:25;
    if(choice==='yes'||random(1,100)<=(choice==='talk'?agree:50)){
      if(choice==='yes'){p.salary+=250;p.salaryTier=Math.floor(p.fans/6500);p.mood='平稳';p.health=limit(p.health+5);} 
      if(choice==='deny'){p.mood='对薪资不满';p.health=limit(p.health-3);checkHealth(p);}
      message('薪资沟通结果',p.name+(choice==='yes'?'接受了新的薪资方案。':'暂时接受维持原薪。'));
    }else{
      p.health=limit(p.health-3);checkHealth(p);p.mood='考虑离开公司'; state.events.push({id:id(),type:'exit',person:p.id});
    }
  }else if(e.type==='exit'||e.type==='friction'){
    if(choice==='keep'){
      if(random(1,100)<=(p.mood==='沟通良好'?75:55))p.mood='平稳';
      else if(e.type==='exit'){removeMember(p,true,false);message('艺人跳槽',p.name+'决定离开公司。');}
      else{removeMember(p,false,false);p.solo=true;p.mood='已独立活动';}
    }
    if(choice==='pay'){p.salary+=250;p.salaryTier=Math.floor(p.fans/6500);p.mood='平稳';p.health=limit(p.health+5);} 
    if(choice==='solo'){p.solo=true;p.mood='平稳';}
    if(choice==='separate'){removeMember(p,false,true);p.solo=true;p.mood='平稳';}
    if(choice==='leave'){removeMember(p,true,true);message('艺人解约',p.name+'已结束公司合约。');}
  }else{
    if(choice==='protect'&&state.cash<600){error('现金不足。');return;}
    if(choice==='protect'){state.cash-=600;adjust(key,random(20,105));p.mood='受到支持';}
    if(choice==='quiet'||choice==='response'){
      adjust(key,-random(5,85));if(group)adjust('g:'+group.id,-random(0,35));
    }
    if(choice==='respect'){const change=random(-45,125);adjust(key,change);message('公关反馈',p.name+(change>=0?'的回应获得部分观众认可。':'的回应未能平息讨论。'));}
    if(choice==='promote')adjust(key,random(25,150));
    if(choice==='rest'||(choice==='pause'&&e.type==='spotlight'))health(key,random(4,9));
    if(e.type==='beauty')p.mood='恢复中';
  }
  clear();finish();
}
function spawnInvites(){
  if(state.inbox.length>=9||random(1,100)>76)return;
  const eligible=allTargets().filter(([key,a])=>!state.inbox.some(i=>i.target===key)&&(a.members||a.status==='artist'));
  if(!eligible.length)return;
  const weights=eligible.map(([,a])=>1+Math.min(14,Math.floor(a.fans/900)));
  let ticket=random(1,weights.reduce((n,w)=>n+w,0)), index=0;
  while(ticket>weights[index])ticket-=weights[index++];
  const [key,a]=eligible[index];
  const kinds=['variety','ad','brand'];
  if(!a.members&&state.flags.release)kinds.push('audition');
  if(!a.members&&groupOf(a)&&a.fans>=8500&&a.cool<=state.week)kinds.push('solo');
  if(random(1,100)>Math.min(97,58+Math.floor(a.fans/450)))return;
  state.inbox.push({id:id(),target:key,type:pick(kinds),expiry:state.week+4,self:!a.members&&random(1,5)===1});
}
function processWages(){

    state.cash+=20000;

  if(state.arrears){
    log('已付工资 '+money(paid)+'，仍欠薪 '+money(state.arrears)+'。可借款、接业务或到财务补发。');
    for(const p of state.people)p.mood='工资延期';
  }else if(due){
    log('月度工资已支付 '+money(paid)+'。');

function upgrade(value){

  value.queue=queue.slice(0,4);
  if(queue[4])value.carryPlan=queue[4];
  value.startedAt=value.week;
  value.week=first;
  for(let i=0;i<value.startedAt-first;i++)value.queue[i]={type:'idle',legacy:true};
  if(value.annual?.status==='booked')value.annual.playWeek=first-first%48+43;

function validateExecution(plan){

  if(offer?.type==='recall'&&(!work(offer.work)||work(offer.work).recalled))return '召回舞台已经完成';
  if(plan.type==='invite'&&(!offer||offer.expiry<=state.week))return '邀约已过期或取消';
  if(plan.type==='festival'&&state.annual?.status!=='booked')return '拼盘档期已失效';
  if(plan.type==='concert'&&state.debt)return '旧债尚未还清';
  if(plan.target&&!a)return '艺人已无法参加';
  const actual=planPeople(plan).filter(k=>person(k)&&!lock(person(k)));
  const partial=['road','show','sale','festival','concert','vocal','dance','groupwrite','album'].includes(plan.type)||(offer&&!['solo','audition'].includes(offer.type));
  if(plan.type==='concert'&&plan.lineup&&plan.lineup.some(key=>performers(key).filter(p=>!lock(p)).length<(target(key)?.members?2:1)))return '家族演唱会阵容不足';
  if(plan.type==='release'&&w?.status==='ready'){if(planCost(plan)>state.cash)return '余额不足';return '';}
  if((a||plan.people||plan.lineup)&&actual.length<(a?.members&&partial?2:1))return '艺人锁档或可出勤人数不足';
  if(a?.members&&!partial&&actual.length!==a.members.length)return '这项活动需要完整阵容';
  if(plan.type==='release'&&w?.status!=='ready')return '作品尚未制作完成';
  if(['show','sale','road'].includes(plan.type)&&w?.status!=='released')return '作品尚未发行';
  if(plan.type==='show'){
    if(w.old||state.week<=w.released||state.week>w.released+6)return '已超出发行后六周打歌期';
    if(w.stations?.includes(plan.station))return '该作品已经上过这家音乐台';
    if(a.fans<stations[plan.station].fans)return '未达到 '+money(stations[plan.station].fans)+' 粉丝门槛';
  }

  if(plan.type==='shoot'&&state.roles.find(r=>r.id===plan.ref)?.status!=='cast')return '影视项目已拍摄或取消';
  const perPerson=Boolean(plan.people)||(['vocal','dance'].includes(plan.type)&&(a?.members||plan.lineup));
  if(planCost(plan)*(perPerson?actual.length:1)>state.cash)return '余额不足';
  plan.active=actual;
  return '';
}

function deltas(before){
  const items=[];
  const change=(label,amount)=>amount?label+' '+(amount>0?'+':'−')+money(Math.abs(amount)):'';
  if(state.cash!==before.cash)items.push(change('资金',state.cash-before.cash));
  for(const g of state.groups){if(before.groups.has(g.id)&&before.groups.get(g.id)!==g.fans)items.push(g.name+' '+change('组合粉丝',g.fans-before.groups.get(g.id)));}
  for(const p of state.people){
    const old=before.people.get(p.id);
    if(!old)continue;
    const values=[['粉丝','fans'],['健康','health'],['歌唱','vocal'],['舞蹈','dance'],['颜值','beauty']].map(([label,key])=>change(label,p[key]-old[key])).filter(Boolean);
    if(values.length)items.push(p.name+' '+values.join(' '));
  }

function changeName(entry){
  if(entry.renameUntil>state.week){error('改名冷却还剩 '+(entry.renameUntil-state.week)+' 周。');return;}
  open('修改名称','<p>首次签约命名免费。之后改名会降低个人或组合粉丝，并进入半年冷却。</p><form id="rename" data-id="'+entry.id+'" data-kind="'+(entry.members?'g':'p')+'"><label>名字<input name="name" maxlength="24" value="'+escape(entry.name)+'" required></label><button class="primary">保存</button></form>');
}
function promote(w,tier){
  const entry=target(w.owner), cost=promoFees[tier];
  if(w.promoted||state.cash<cost){error('已宣传或现金不足。');return;}
  state.cash-=cost;w.promoted=true;
  const recommended=entry.fans<=5000?0:entry.fans<=9999?1:2;
  if(tier>recommended&&random(1,100)<=25){
    (state.promoEvents??=[]).push({id:id(),work:w.id});
    finish();actions.promoreply(String(state.promoEvents.at(-1).id));
  }else{
    const gain=random(110,230)*(tier+1);
    adjust(w.owner,gain);finish();
    open('宣传结果','<p>宣传吸引了新观众。</p><p>资金 −'+money(cost)+' · 粉丝 +'+money(gain)+'</p>');
  }
}
let newsTimer;
function rotateNews(){
  clearInterval(newsTimer);
  const ticker=app.querySelector('.news');
  if(!ticker||ticker.children.length<2||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  newsTimer=setInterval(()=>{
    if(ticker.matches(':hover')||ticker.contains(document.activeElement))return;
    const cards=Array.from(ticker.children), current=cards.reduce((best,card,i)=>Math.abs(card.offsetLeft-cards[0].offsetLeft-ticker.scrollLeft)<Math.abs(cards[best].offsetLeft-cards[0].offsetLeft-ticker.scrollLeft)?i:best,0);
    ticker.scrollTo({left:cards[(current+1)%cards.length].offsetLeft-cards[0].offsetLeft,behavior:'smooth'});
  },5000);
}
function newsNotes(){
  if(!state.news?.length)return '';
  return '<div class="news card" tabindex="0" aria-label="季度新闻">'+state.news.map(line=>'<span>'+escape(line)+'</span>').join('')+'</div>';
}
function refreshNews(report,opening=false){
  if(![1,4,7,10].includes(month(state.week)))return;
  state.newsGenre=pick(genres);
  state.news=['行业新闻 · '+state.newsGenre+'风格热度上升，本季度相关专辑销量提高 20%。',
    ...report.filter(line=>/喜提一位|自拍|直播|美谈|直拍|粉丝剪辑|零分考卷|素人时期|前辈|翻白眼/.test(line)).slice(0,6)];
  if(opening)state.news.push('长夜过去，新的演出季已经开始。');
}
function finance(kind){
  const labels={debt:'偿还旧债',borrow:'借款',loan:'偿还借款',arrears:'补发欠薪'};
  const max=kind==='borrow'?Math.max(0,60000-state.loan):Math.min(state.cash,state[kind]);
  open(labels[kind],'<p>当前余额 '+money(state.cash)+' · 下次工资 '+money(wages())+'</p><small>'+
    (kind==='debt'?'旧债可分次还清。还清后解锁自办演唱会。':kind==='borrow'?'可用借款额度 '+money(max)+'，可手动偿还。':'按可用现金偿付。')+
    '</small>'+(max?'<form id="finance" data-kind="'+kind+'"><label>金额<input name="amount" type="number" min="1" max="'+max+'" value="'+max+'" required></label><p>操作后余额 <output id="balance">'+money(state.cash+(kind==='borrow'?max:-max))+'</output></p><button class="primary">确认'+labels[kind]+'</button></form>':'<p>暂无可操作金额。</p>'));
}
function submitFinance(form){
  const amount=Number(new FormData(form).get('amount')), kind=form.dataset.kind;
  const max=kind==='borrow'?60000-state.loan:Math.min(state.cash,state[kind]);
  if(!Number.isInteger(amount)||amount<1||amount>max){error('请选择有效的金额。');return;}
  if(kind==='borrow'){state.cash+=amount;state.loan+=amount;}
  else{state.cash-=amount;state[kind]-=amount;}
  if(kind==='debt'&&!state.debt)milestone('paid','旧债已还清','叔叔发来一张照片。他穿着沾满水泥灰的工服，晒黑了不少，身后垒着半人高的砖。短信只有一句：「'+state.player+'，我在这儿一切都好。」\n\n自办演唱会已解锁。');
  if(kind==='arrears'&&!state.arrears)milestone('wages','第一笔工资已付清','员工收到了补上的工资，公司照常开门。');
  finish();
}
function expireCandidates(){state.candidates=state.candidates.filter(p=>p.candidateUntil==null||p.candidateUntil>state.week);}
function showCandidates(){
  open('候选人',state.candidates.map(p=>textBlock(p.name,'<p>'+p.gender+' · '+(p.status==='artist'?'成熟艺人／有转签意向':'练习生')+' · '+escape(p.personality)+'</p><small>候选 '+countdown((p.candidateUntil??(state.week+12))-state.week)+'</small><small>歌唱 '+p.vocal+' · 舞蹈 '+p.dance+' · 颜值 '+p.beauty+' · 健康 '+p.health+' · 粉丝 '+money(p.fans)+'</small><div class="row">'+
    button('签约','hire',p.id,'',state.people.length>=60)+button('略过','pass',p.id)+'</div>')).join('')||'<p>安排星探发掘或公司招募后查看。</p>');
}
function savedGame(value){
  if(!value||![1,2,3].includes(value.version)||!Number.isInteger(value.week)||value.week<0||!Number.isSafeInteger(value.serial))return false;
  if(!['company','player','groupName','kind'].every(k=>typeof value[k]==='string'))return false;
  if(!['cash','debt','loan','arrears'].every(k=>Number.isFinite(value[k])&&value[k]>=0))return false;
  if(!['people','groups','works','songs','queue','inbox','events','messages','logs','last','candidates','rivals','roles'].every(k=>Array.isArray(value[k])))return false;
  return value.people.length<=60&&value.queue.length<=4&&value.rivals.length===3&&value.flags&&typeof value.flags==='object';
}
const actions={
  close:()=>sheet.close(),
  filter:arg=>{artistFilter=arg;finish();},
  sortartists:()=>open('艺人筛选','<form id="artistsort"><label>属性<select name="stat">'+options(Object.entries(sortStats))+'</select></label><label>排序<select name="direction"><option value="-1">从高到低</option><option value="1">从低到高</option></select></label><button>应用</button></form>'),
  restartask:()=>confirmAction('重新开局','此操作会清除当前存档。需要保留时，请先导出存档。','restart',''),
  restart:()=>{state=null;tab=0;artistFilter='团体';finish();},
  popo:arg=>{person(Number(arg)).popo=true;finish();},
  unshelve:arg=>{person(Number(arg)).shelved=false;finish();},
  scouts:()=>{
    const current=state.scouts||[];
    open('雇佣星探','<p>最多同时雇佣 3 位。月底带来候选人，唱跳颜随机一项至少达到 70／80／90。</p>'+scoutFees.map((fee,i)=>textBlock('第 '+(i+1)+' 档 · '+money(fee)+'／月',
      button('选择招募性别','scoutgender',i,'',current.length>=3))).join('')+
      current.map((scout,i)=>textBlock('已雇佣 · 第 '+((scout.level??scout)+1)+' 档 · '+(scout.gender||'不限'),button('解雇','scoutfire',i))).join(''));
  },
  scoutgender:arg=>open('星探招募对象',sexOptions.map(([value,label])=>button(label,'scouthire',arg+':'+value)).join(' ')),
  scouthire:arg=>{const [level,gender]=arg.split(':');state.scouts??=[];if(state.scouts.length<3)state.scouts.push({level:Number(level),gender});save();actions.scouts();},
  scoutfire:arg=>{state.scouts.splice(Number(arg),1);save();actions.scouts();},

  promote:arg=>{
    const w=work(Number(arg));open('宣传《'+w.title+'》','<p>每个作品可宣传一次，不占行程。高预算和较低粉丝规模可能引发争议。</p>'+promoFees.map((fee,i)=>button(money(fee)+' · '+['0–5,000 粉','5,001–9,999 粉','10,000 粉以上'][i],'promotedo',arg+':'+i)).join(' '));
  },
  promotedo:arg=>{const [ref,tier]=arg.split(':');promote(work(Number(ref)),Number(tier));},
  promoreply:arg=>open('音源注水争议','<p>宣传预算高于当前粉丝规模，部分观众质疑音源表现。</p>'+button('公开说明','promofinish',arg+':explain')+button('保持沉默','promofinish',arg+':quiet')),
  promofinish:arg=>{
    const [ref,choice]=arg.split(':'), event=state.promoEvents.find(e=>e.id===Number(ref));
    if(!event)return;
    const w=work(event.work), entry=target(w?.owner), before=entry?.fans||0;
    if(entry)adjust(w.owner,choice==='explain'?random(-170,240):-random(75,280));
    state.promoEvents=state.promoEvents.filter(e=>e!==event);
    const delta=(entry?.fans||0)-before, result='《'+w.title+'》宣传争议 · 粉丝 '+(delta>=0?'+':'−')+money(Math.abs(delta));
    (state.fanNews??=[]).push(result);
    finish();open('公关结果','<p>'+escape(result)+'</p>');
  },
  seasonjoin:()=>{state.season.status='signed';finish();},
  seasonpick:()=>{
    const rows=state.people.filter(p=>p.gender===state.season.gender&&!lock(p));
    open('选派参赛成员','<p>参赛期间锁档，落选者 2 月解锁，入选者继续锁档一年。</p><form id="season">'+rows.map(p=>'<label><input name="member" type="checkbox" value="'+p.id+'"> '+escape(p.name)+'</label>').join('')+'<button>确认派出</button></form>');
  },
  transfer:()=>{
    if(state.debt||state.loan||!state.transfer)return;
    const p=state.transfer;
    open('转签 · '+p.name,'<p>歌唱 '+p.vocal+' · 舞蹈 '+p.dance+' · 颜值 '+p.beauty+' · 健康 '+p.health+' · 粉丝 '+money(p.fans)+'</p>'+button('接受转签','transferdo','yes','primary',state.people.length>=60)+button('拒绝','transferdo','no'));
  },
  transferdo:arg=>{
    if(state.debt||state.loan||!state.transfer)return;
    const p=state.transfer;delete state.transfer;
    if(arg==='yes'&&state.people.length<60){
      p.firstName=true;if(p.status==='artist')p.solo=true;state.people.push(p);
      if(random(1,3)!==1){const good=random(1,2)===1;adjust('p:'+p.id,good?random(200,800):-random(120,540));message('转签后续',p.name+(good?'以往的幕后故事受到好评。':'的过往争议重新受到关注。'));}
    }
    finish();
  },
  intro:arg=>{intro=Number(arg);if(intro===3){start(draft);intro=0;draft=null;}render();},
  tab:arg=>showTab(Number(arg)),
  schedule:arg=>schedule(Number(arg)),
  planform:arg=>{const [type,slot]=arg.split(':');dutyForm(type,Number(slot));},
  preset:arg=>dutyForm(arg),
  workplan:arg=>{const [type,ref]=arg.split(':');dutyForm(type,-1,'',Number(ref));},
  forplan:arg=>{const [type,...key]=arg.split(':');dutyForm(type,-1,key.join(':'));},
  remove:arg=>{state.queue[Number(arg)]=null;finish();},
  replace:arg=>enqueue(pendingPlan,Number(arg)),
  advance,
  idle:arg=>enqueue({type:'idle'},Number(arg)),
  albummenu:arg=>open('专辑',button('专辑制作','planform','album:'+arg)+button('专辑发行','planform','release:'+arg)),
  dancefilter:arg=>{const [slot,group]=arg.split(':');dutyForm('dance',Number(slot),'',0,group);},
  selectall:arg=>{const form=sheet.querySelector('#plan');for(const box of form.querySelectorAll('input[name=member],input[name=team]'))box.checked=arg!=='none';},
  category:arg=>{const [types,slot]=arg.split(':');open('选择活动','<div class="stack">'+types.split(',').map(type=>button(activities[type].name,'planform',type+':'+slot)).join('')+'</div>');},
  group:arg=>groupPage(team(Number(arg))),
  person:arg=>personPage(person(Number(arg))),
  debut:debutForm,
  candidates:showCandidates,
  hire:arg=>{
    const p=state.candidates.find(c=>c.id===Number(arg));
    if(!p||state.people.length>=60)return;
    p.firstName=true;if(p.status==='artist')p.solo=true;state.people.push(p);state.candidates=state.candidates.filter(c=>c.id!==p.id);finish();
    actions.rename(p.id);
  },
  pass:arg=>{state.candidates=state.candidates.filter(c=>c.id!==Number(arg));save();render();showCandidates();},
  rename:arg=>changeName(person(Number(arg))),
  grouprename:arg=>changeName(team(Number(arg))),
  talk:arg=>{const p=person(Number(arg));p.mood='沟通良好';save();render();personPage(p);},
  dissolveask:arg=>{
    const g=team(Number(arg));
    confirmAction('解散 '+g.name,'现有演出停止，成员仍与公司签约。4 周后可以重新组团或 Solo 出道。原团作品保留在发行记录。','dissolve',arg);
  },
  dissolve:arg=>{
    const g=team(Number(arg));
    if(g.members.map(person).some(lock)){error('制作中的团体暂时无法解散。');return;}
    for(const key of g.members){const p=person(key);p.cool=state.week+4;p.solo=false;cancelPlans(['p:'+p.id]);}
    closeGroup(g);finish();
  },
  dismissask:arg=>{const p=person(Number(arg));confirmAction('结束合约','将 '+p.name+' 移出公司，并取消其个人排程。若有团籍，组合粉丝会受到影响。','dismiss',arg);},
  dismiss:arg=>{const p=person(Number(arg));if(lock(p)){error('制作期间不能解约。');return;}removeMember(p,true,false);finish();},
  finance, concert:concertForm, tour:tourForm,
  invite:arg=>{
    const i=state.inbox.find(x=>x.id===Number(arg));
    if(!i||i.expiry<=state.week)return;
    directPlan({type:'invite',ref:i.id,target:i.target});
  },
  decline:arg=>{const offer=state.inbox.find(i=>i.id===Number(arg));if(offer){state.logs=[];expireOffer(offer,'已拒绝');state.last=state.logs.slice(0,15);}finish();},
  event:arg=>{
    const e=state.events.find(x=>x.id===Number(arg)), p=person(e.person);
    const agree=p.mood==='沟通良好'||p.personality==='团队优先'?75:25;
    open(eventTitle(e),'<div class="stack">'+eventChoices[e.type].map(([value,label,hint])=>
      '<div>'+button(label,'eventchoice',arg+':'+value)+'<small>'+ (e.type==='raise'&&value==='talk'?agree+'% 接受原薪':hint)+'</small></div>').join('')+'</div>');
  },
  eventchoice:arg=>{const [ref,choice]=arg.split(':');eventChoice(Number(ref),choice);},
  message:arg=>{
    const m=state.messages.find(x=>x.id===Number(arg));m.read=true;save();render();
    open(m.title,escape(m.body).split('\n').map(s=>'<p>'+s+'</p>').join(''));
  },
  messages:()=>open('短信记录',state.messages.map(m=>'<p>'+button((m.read?'':'● ')+m.title,'message',m.id)+'</p>').join('')||'<p>还没有短信。</p>'),
  annualapply:()=>{
    const rows=units().filter(([key,a])=>state.annual.eligible.includes(key)&&a.fans>80000&&availableWorks(key).length);
    if(!rows.length){open('音乐台年末拼盘','<p>需要一个已有发行作品、超过 80,000 粉丝的团体或 Solo。</p>');return;}
    open('确认报名','<p>每年限一家族中的一个出演单位，确认后固定占用 11 月第 4 周。</p><form id="annualapply"><label>出演单位<select name="target">'+options(listNames(rows))+'</select></label><button class="primary">确认报名</button></form>');
  },
  roles:()=>open('影视项目',state.roles.map(r=>textBlock(r.title,'<small>'+escape(target(r.target)?.name)+' · '+({cast:'已入选',waiting:'等待播出',broadcast:'已播出'}[r.status])+'</small>'+
    (r.status==='cast'?button('安排拍摄','shoot',r.id):''))).join('')||'<p>暂无影视项目。</p>'),
  shoot:arg=>{const role=state.roles.find(r=>r.id===Number(arg));directPlan({type:'shoot',ref:role.id,target:role.target});},
  split:arg=>{
    const rows=splitRows().filter(([key])=>!arg||key===arg);
    open('年度分账','<p>可以当场结算，也可以延期后在艺人页面补结。练习生不参与分账。</p>'+rows.map(([key,a])=>
      textBlock(a.name,'<small>'+a.pendingSplits.map(b=>'第 '+b.year+' 年 '+money(b.amount)).join(' · ')+'</small><div class="row">'+
        button('结算','splitdo','pay:'+key,'primary')+button('延期','splitdo','later:'+key,'',a.pendingSplits.every(b=>b.deferred))+'</div>')).join('')+
      (rows.length>1?button('全部结算','splitall')+button('全部延期','splitdo','later'):''));
  },
  splitall:()=>confirmAction('一键结算','将支付全部待分账金额 '+money(splitRows().reduce((n,[,a])=>n+pendingAmount(a),0))+'。','splitdo','pay'),
  splitdo:arg=>{const [mode,...parts]=arg.split(':');if(doSplit(mode==='pay',parts.join(':'))){finish();if(splitRows().some(([,a])=>a.pendingSplits.some(b=>!b.deferred)))actions.split();}},

  export:()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='encore-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  },
  import:()=>open('导入存档','<p>导入会覆盖当前进度。可以先关闭并导出备份。</p><form id="import"><label>选择存档文件<input type="file" name="file" accept=".json,application/json" required></label><button class="primary">确认导入并覆盖</button></form>')
};
document.addEventListener('click',event=>{
  const node=event.target.closest('[data-action]');
  if(node&&!node.disabled)actions[node.dataset.action]?.(node.dataset.arg);
});
document.addEventListener('input',event=>{
  const input=event.target;
  if(input.form?.id==='finance')sheet.querySelector('#balance').textContent=money(state.cash+(input.form.dataset.kind==='borrow'?1:-1)*Number(input.value));
});
document.addEventListener('submit',async event=>{
  event.preventDefault();
  const form=event.target, data=new FormData(form);
  switch(form.id){
    case 'setup':
      draft={company:String(data.get('company')).trim(),player:String(data.get('player')).trim(),
        groupName:String(data.get('groupName')).trim(),kind:String(data.get('kind'))};
      if(!draft.company||!draft.player||!draft.groupName){error('请填写三个名称。');return;}
      intro=1;render();break;
    case 'plan':submitPlan(form);break;
    case 'artistsort':artistSort={key:data.get('stat'),direction:Number(data.get('direction'))};finish();break;
    case 'season': {
      const members=data.getAll('member').map(Number);
      if(!members.length||members.length>3){error('请选择 1～3 名艺人。');return;}
      state.season.people=members;state.season.status='running';
      for(const key of members)person(key).showLock={competing:true};
      finish();break;
    }
    case 'debut':submitDebut(form);break;
    case 'finance':submitFinance(form);break;
    case 'rename': {
      const name=String(data.get('name')).trim();
      if(!name){error('请填写名称。');return;}
      const entry=(form.dataset.kind==='g'?team:person)(Number(form.dataset.id));
      if(name!==entry.name){
        if(!entry.firstName){entry.fans=Math.max(0,entry.fans-Math.ceil(entry.fans*.07));entry.renameUntil=state.week+24;}
        entry.name=name;
      }
      delete entry.firstName;finish();break;
    }
    case 'concert': {
      const venue=form.dataset.venue, lineup=data.getAll('lineup');
      if(venue==='family'&&lineup.length<2){error('请选择至少两个演出单位。');return;}
      if(venue==='family'){
        const participants=lineup.flatMap(k=>performers(k).map(p=>p.id));
        if(new Set(participants).size!==participants.length){error('第一版家族演唱会的各演出单位需要独立阵容。');return;}
      }
      directPlan({type:'concert',venue,target:data.get('target'),...(venue==='family'?{lineup}:{})});break;
    }
    case 'announce': {
      const firstAnnouncement=!state.flags.announced;
      state.tour={target:data.get('target'),stops:0};
      milestone('announced','世界巡演官宣',state.player+'，巡演公告我看见了。当初那串钥匙，是我不敢自己回去开门，才寄给你的。谢谢你把'+state.company+'救回来。以后，大楼的钥匙就归你了。叔叔谢谢你。');
      finish();if(firstAnnouncement)actions.message(state.messages[0].id);break;
    }
    case 'annualapply':
      state.annual.target=data.get('target');state.annual.status='booked';finish();break;
    case 'import':
      try {
        const next=JSON.parse(await data.get('file').text());
        if(!savedGame(next))throw Error('invalid');
        state=upgrade(next);tab=0;finish();
      }catch{error('请选择本游戏导出的有效存档。');}
      break;
  }
});
if(state)state=savedGame(state)?upgrade(state):null;
render();
